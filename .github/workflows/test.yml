name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: |
          cd src
          uv sync
      # Los tests `network` bajan shapefiles de portales municipales: se quedan
      # fuera del CI porque fallan cuando el portal está caído, no por el código.
      - name: Run pytest
        run: |
          cd src
          uv run pytest ../tests/ -m "not network"
