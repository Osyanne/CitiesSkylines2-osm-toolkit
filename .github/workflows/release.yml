name: Release

# Publica la release de GitHub de una versión, con el título y las notas de su
# sección `## [vX.Y.Z] — fecha — título` en CHANGELOG.md. Dos formas:
# - Automática: un push a main que cambia src/pyproject.toml y deja una
#   `version` sin tag crea el tag anotado vX.Y.Z sobre ese commit y la release.
# - Manual (workflow_dispatch): tag + commit, para versiones que quedaron sin
#   release. Si no es la versión actual de pyproject, no se marca como "latest".

on:
  push:
    branches: [main]
    paths: [src/pyproject.toml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (vX.Y.Z); tiene que tener su sección en CHANGELOG.md"
        required: true
      target:
        description: "Commit (SHA) o rama donde va el tag"
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          current="v$(sed -n 's/^version = "\(.*\)"$/\1/p' src/pyproject.toml)"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            sha=$(git rev-parse --verify "$INPUT_TARGET^{commit}")
          else
            tag="$current"
            sha="$GITHUB_SHA"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag inválido: '$tag' (se espera vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$current" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "El tag $tag ya existe: no hay nada que publicar."
          fi

      - name: Title and notes from CHANGELOG.md
        id: notes
        if: steps.resolve.outputs.exists != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        shell: python
        run: |
          import os, re, sys

          tag = os.environ["TAG"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          header = re.search(rf"^## \[{re.escape(tag)}\](.*)$", text, re.M)
          if not header:
              print(f"::error::CHANGELOG.md no tiene una sección ## [{tag}]")
              sys.exit(1)
          # "— 2026-09-25 — Título" → "vX.Y.Z — Título"; sin título, solo el tag
          parts = [p.strip() for p in header.group(1).split("—") if p.strip()]
          title = f"{tag} — {parts[-1]}" if len(parts) >= 2 else tag
          rest = text[header.end():]
          following = re.search(r"^## \[", rest, re.M)
          notes = (rest[:following.start()] if following else rest).strip()
          notes = re.sub(r"\n-{3,}$", "", notes).strip()  # separador entre versiones
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"title={title}\n")
          print(title)

      - name: Tag and publish
        if: steps.resolve.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
          TITLE: ${{ steps.notes.outputs.title }}
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "$TITLE"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TITLE" \
            --notes-file release-notes.md --latest="$LATEST"
