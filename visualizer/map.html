  let searchActiveIndex = -1;
  let searchSerial = 0;
  let searchPending = null;
  let searchRequest = null;
  let searchTimer = null;
  let searchLastSent = -Infinity;
  let searchMarker = null;
  let searchGeometry = null;
  let searchComposing = false;

  searchInput.placeholder = `Search in ${CITY_META.display_name}`;
  searchInput.setAttribute("aria-label", searchInput.placeholder);

  async function loadSearchConfig() {
    try {
      const response = await fetch("search-config.json");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const config = await response.json();
      if (config?.enabled !== true || new URL(config.endpoint).protocol !== "https:") {
        throw new Error("Configuración desactivada o endpoint inválido");
      }
      searchConfig = config;
      const provider = document.createElement("a");
      provider.textContent = `Search by ${typeof config.provider === "string" ? config.provider : "Nominatim"}`;
      // Una configuración externa no debe introducir enlaces ejecutables.
      try {
        const policy = new URL(config.policy);
        if (policy.protocol === "https:") provider.href = policy.href;
      } catch {}
      const osm = document.createElement("a");
      osm.href = "https://www.openstreetmap.org/copyright";
      osm.textContent = "© OpenStreetMap contributors";
      searchAttribution.replaceChildren(provider, document.createTextNode(" · "), osm);
      searchOpen.hidden = false;
    } catch (error) {
      console.warn("[search]", error.message);
    }
  }

  function searchGeoJSON() {
    return { type: "FeatureCollection", features: searchGeometry
      ? [{ type: "Feature", properties: {}, geometry: searchGeometry }] : [] };
  }

  function createSearchLayers() {
    if (!map.getSource("cs2-search")) map.addSource("cs2-search", { type: "geojson", data: searchGeoJSON() });
    const layers = [
      { id: SEARCH_LAYERS[0], type: "fill", filter: ["==", ["geometry-type"], "Polygon"],
        paint: { "fill-color": "#4cc9f0", "fill-opacity": 0.15 } },
      { id: SEARCH_LAYERS[1], type: "line",
        paint: { "line-color": "#4cc9f0", "line-width": 3, "line-opacity": 0.95 } },
    ];
    for (const layer of layers) {
      if (!map.getLayer(layer.id)) addLayerOrdered({ ...layer, source: "cs2-search",
        layout: { visibility: searchGeometry ? "visible" : "none" } });
    }
  }

  function syncSearchGeometry() {
    map.getSource("cs2-search")?.setData(searchGeoJSON());
    for (const id of SEARCH_LAYERS) {
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", searchGeometry ? "visible" : "none");
    }
  }

  function clearSearchPlace() {
    searchMarker?.remove();
    searchMarker = null;
    searchGeometry = null;
    syncSearchGeometry();
  }

  function closeSearchList() {
    searchResults.hidden = true;
    searchInput.setAttribute("aria-expanded", "false");
    searchInput.removeAttribute("aria-activedescendant");
    searchActiveIndex = -1;
    for (const option of searchResults.children) option.setAttribute("aria-selected", "false");
  }

  function cancelSearch() {
    searchSerial++;
    clearTimeout(searchTimer);
    searchTimer = null;
    searchPending = null;
    if (searchRequest) {
      clearTimeout(searchRequest.timeout);
      searchRequest.controller.abort();
      searchRequest = null;
    }
  }

  function closeSearch() {
    cancelSearch();
    closeSearchList();
    clearSearchPlace();
    searchStatus.textContent = "";
    searchPanel.hidden = true;
    searchOpen.setAttribute("aria-expanded", "false");
    searchOpen.focus({ preventScroll: true });
  }

  function consumeSearchEscape(ev) {
    if (searchPanel.hidden) return false;
    ev.stopImmediatePropagation();
    // El IME puede cancelar su composición sin que Escape llegue al mapa.
    if (ev.isComposing || searchComposing) return true;
    ev.preventDefault();
    if (!searchResults.hidden) closeSearchList();
    else closeSearch();
    return true;
  }

  function placeSearchPanel() {
    if (searchPanel.hidden) return;
    const rect = visibleMapRect();
    const viewport = window.visualViewport;
    const bottom = Math.min(rect.canvas.top + rect.bottom,
      viewport ? viewport.offsetTop + viewport.height : window.innerHeight);
    searchPanel.style.maxHeight = `${Math.max(0, bottom - searchPanel.getBoundingClientRect().top - 12)}px`;
  }

  function renderSearchResults(items) {
    searchItems = items;
    closeSearchList();
    searchResults.replaceChildren();
    items.forEach((item, i) => {
      const parts = String(item.display_name || "").split(",").map(part => part.trim());
      const option = document.createElement("li");
      option.id = `search-opt-${i}`;
      option.setAttribute("role", "option");
      option.setAttribute("aria-selected", "false");
      const name = document.createElement("strong");
      name.textContent = item.name || parts[0];
      const context = document.createElement("small");
      const type = String(item.type || "").replace(/_/g, " ");
      context.textContent = [type.charAt(0).toUpperCase() + type.slice(1), ...parts.slice(1, 3)].filter(Boolean).join(" · ");
      option.append(name, context);
      // El foco del combobox permanece en el campo incluso con mouse.
      option.addEventListener("mousedown", ev => ev.preventDefault());
      option.addEventListener("click", () => selectSearchResult(i));
      searchResults.appendChild(option);
    });
    searchResults.hidden = !items.length;
    searchInput.setAttribute("aria-expanded", String(!!items.length));
    searchStatus.textContent = items.length ? "" : `No results in ${CITY_META.display_name}`;
    placeSearchPanel();
  }

  function searchURL(query, language) {
    const url = new URL(searchConfig.endpoint);
    const [south, west, north, east] = CITY_META.bbox;
    for (const [key, value] of Object.entries({ q: query, format: "jsonv2",
      viewbox: `${west},${north},${east},${south}`, bounded: "1", limit: "8",
      polygon_geojson: "1", polygon_threshold: "0.00005", "accept-language": language })) {
      url.searchParams.set(key, value);
    }
    return url;
  }

  async function sendSearch(pending) {
    if (pending !== searchPending || pending.serial !== searchSerial) return;
    // Se vuelve a medir por si el temporizador despertó antes del plazo.
    const wait = 1000 - (performance.now() - searchLastSent);
    if (wait > 0) { searchTimer = setTimeout(() => sendSearch(pending), Math.ceil(wait)); return; }
    searchPending = null;
    searchTimer = null;
    const request = { ...pending, controller: new AbortController(), timeout: null };
    searchRequest = request;
    request.timeout = setTimeout(() => {
      if (request.serial !== searchSerial) return;
      request.controller.abort();
      searchRequest = null;
      searchSerial++;
      searchStatus.textContent = "Search is unavailable right now.";
    }, 10000);
    try {
      searchLastSent = performance.now();
      const response = await fetch(searchURL(request.query, request.language), {
        referrerPolicy: "no-referrer-when-downgrade", credentials: "omit", signal: request.controller.signal,
      });
      if (request.serial !== searchSerial) return;
      if (!response.ok) throw new Error(response.status === 429 ? "busy" : "unavailable");
      const items = await response.json();
      if (request.serial !== searchSerial) return;
      if (!Array.isArray(items)) throw new Error("unavailable");
      const results = items.filter(item => item && typeof item === "object").slice(0, 8);
      searchCache.set(request.key, results);
      if (searchCache.size > 50) searchCache.delete(searchCache.keys().next().value);
      renderSearchResults(results);
    } catch (error) {
      if (request.serial !== searchSerial) return;
      searchStatus.textContent = error.message === "busy"
        ? "Search is busy. Try again in a moment." : "Search is unavailable right now.";
    } finally {
      clearTimeout(request.timeout);
      if (searchRequest === request) searchRequest = null;
    }
  }

  function submitSearch() {
    if (!searchConfig || searchComposing) return;
    const query = searchInput.value.trim().replace(/\s+/g, " ");
    const language = navigator.languages?.join(",") || navigator.language;
    const key = JSON.stringify([CITY_SLUG, language, query]);
    // Confirmar de nuevo una consulta en curso tampoco duplica tráfico.
    if (searchPending?.key === key || searchRequest?.key === key) return;
    cancelSearch();
    clearSearchPlace();
    closeSearchList();
    searchItems = [];
    searchStatus.textContent = "";
    if (query.length < 2) return;
    searchInput.value = query;
    if (searchCache.has(key)) { renderSearchResults(searchCache.get(key)); return; }
    searchStatus.textContent = "Searching…";
    searchPending = { query, language, key, serial: searchSerial };
    sendSearch(searchPending);
  }

  function searchNumber(value) {
    return (typeof value === "number" || typeof value === "string" && value.trim() !== "")
      && Number.isFinite(Number(value)) ? Number(value) : NaN;
  }

  function selectSearchResult(index) {
    const item = searchItems[index];
    if (!item) return;
    const lat = searchNumber(item.lat), lon = searchNumber(item.lon);
    if (Math.abs(lat) > 90 || Math.abs(lon) > 180 || !Number.isFinite(lat + lon)) return;
    closeSearchList();
    clearSearchPlace();
    const pin = document.createElement("div");
    pin.className = "search-pin";
    pin.setAttribute("aria-hidden", "true");
    searchMarker = new maplibregl.Marker({ element: pin }).setLngLat([lon, lat]).addTo(map);
    if (["LineString", "MultiLineString", "Polygon", "MultiPolygon"].includes(item.geojson?.type)) {
      searchGeometry = item.geojson;
    }
    syncSearchGeometry();
    const rect = visibleMapRect();
    const margin = Math.min(32, (rect.right - rect.left) / 4, (rect.bottom - rect.top) / 4);
    const padding = { left: rect.left + margin, top: rect.top + margin,
      right: rect.canvas.width - rect.right + margin, bottom: rect.canvas.height - rect.bottom + margin };
    const bounds = Array.isArray(item.boundingbox) && item.boundingbox.length === 4
      ? item.boundingbox.map(searchNumber) : [];
    const [south, north, west, east] = bounds;
    if (bounds.length === 4 && bounds.every(Number.isFinite) && south <= north && west <= east &&
        south >= -90 && north <= 90 && west >= -180 && east <= 180) {
      map.fitBounds([[west, south], [east, north]], { maxZoom: 17, padding, retainPadding: false });
    } else {
      map.easeTo({ center: [lon, lat], zoom: 17, padding, retainPadding: false });
    }
    if (window.matchMedia("(hover: none), (pointer: coarse)").matches) searchInput.blur();
  }

  searchOpen.addEventListener("click", () => {
    if (!searchPanel.hidden) { closeSearch(); return; }
    finishMeasure();
    closeSharePanel();
    closeExportMenu(false);
    searchPanel.hidden = false;
    searchOpen.setAttribute("aria-expanded", "true");
    placeSearchPanel();
    searchInput.focus({ preventScroll: true });
  });
  document.getElementById("search-close").addEventListener("click", closeSearch);
  searchPanel.querySelector("form").addEventListener("submit", ev => { ev.preventDefault(); submitSearch(); });
  searchInput.addEventListener("compositionstart", () => { searchComposing = true; });
  searchInput.addEventListener("compositionend", () => { searchComposing = false; });
  searchInput.addEventListener("input", () => {
    cancelSearch();
    clearSearchPlace();
    closeSearchList();
    searchItems = [];
    searchStatus.textContent = "";
  });
  searchInput.addEventListener("keydown", ev => {
    if (ev.isComposing || searchComposing) {
      if (ev.key === "Enter") ev.preventDefault();
      return;
    }
    if (ev.key === "Enter") {
      ev.preventDefault();
      if (!searchResults.hidden && searchActiveIndex >= 0) selectSearchResult(searchActiveIndex);
      else submitSearch();
    } else if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && searchItems.length) {
      ev.preventDefault();
      searchResults.hidden = false;
      searchInput.setAttribute("aria-expanded", "true");
      const step = ev.key === "ArrowDown" ? 1 : -1;
      searchActiveIndex = searchActiveIndex < 0 ? (step > 0 ? 0 : searchItems.length - 1)
        : (searchActiveIndex + step + searchItems.length) % searchItems.length;
      for (const [i, option] of Array.from(searchResults.children).entries()) {
        option.setAttribute("aria-selected", String(i === searchActiveIndex));
      }
      const option = searchResults.children[searchActiveIndex];
      searchInput.setAttribute("aria-activedescendant", option.id);
      placeSearchPanel();
      option.scrollIntoView({ block: "nearest" });
    }
  });
  document.addEventListener("click", ev => {
    if (!searchPanel.hidden && !searchPanel.contains(ev.target)) closeSearchList();
  });
  const searchLayoutObserver = new ResizeObserver(placeSearchPanel);
  searchLayoutObserver.observe(document.getElementById("title-header"));
  searchLayoutObserver.observe(colEl);
  map.on("resize", placeSearchPanel);
  window.visualViewport?.addEventListener("resize", placeSearchPanel);
  window.visualViewport?.addEventListener("scroll", placeSearchPanel);
  window.addEventListener("pagehide", cancelSearch);
  map.on("style.load", createSearchLayers);
  mapReady.then(createSearchLayers);
  loadSearchConfig();

  // ── Vista compartida: URL → preferencia guardada → primera visita ──
  function cameraHash() {
    const center = map.getCenter();
    const zoom = Math.round(map.getZoom() * 100) / 100;
    // El mismo redondeo de MapLibre: menos de medio píxel de diferencia.
    const precision = Math.ceil((zoom * Math.LN2 + Math.log(512 / 360 / 0.5)) / Math.LN10);
    const factor = Math.pow(10, precision);
    return `${zoom}/${Math.round(center.lat * factor) / factor}/${Math.round(center.lng * factor) / factor}`;
  }

  function validCameraHash(value) {
    if (!value) return false;
    const parts = value.split("/");
    if (parts.length < 3 || parts.length > 5 || parts.some(p => !p.trim() || !Number.isFinite(Number(p)))) return false;
    const [zoom, lat, , bearing = 0, pitch = 0] = parts.map(Number);
    return zoom >= map.getMinZoom() && zoom <= map.getMaxZoom() && Math.abs(lat) <= 90 &&
      Math.abs(bearing) <= 180 && pitch === 0;
  }

  function writeViewHash(freshCamera = false) {
    const previousCamera = new URLSearchParams(location.hash.slice(1)).get("map");
    const camera = !freshCamera && validCameraHash(previousCamera) ? previousCamera : cameraHash();
    // A mano para conservar comas, barras y el orden de la columna.
    const parts = [`map=${camera}`, `base=${basemap}`];
    if (officialEntry) parts.push(`src=${requestedZoningSource}`);
    if (!singleModule) parts.push(`layers=${moduleKeys.map(mod => `${mod}.${moduleStates[mod]}`).join(",")}`);
    for (const mod of moduleKeys) {
      const hidden = blocks[mod].cats.filter(c => hiddenCats[mod].has(c.key)).map(c => c.key);
      if (hidden.length) parts.push(`hide.${mod}=${hidden.join(",")}`);
    }
    parts.push(`frame=${frameState.on ? `${frameState.lat.toFixed(5)},${frameState.lng.toFixed(5)}` : "off"}`);
    const hash = `#${parts.join("&")}`;
    history.replaceState(history.state, "", hash);
    // La cámara sale de la API al compartir, nunca del hash atrasado por el throttle.
    return new URL(hash, location.href).href;
  }

  function importViewHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    const saved = readViewState();
    importFrame(params.get("frame"), saved?.frame);
    const layers = {};
    for (const entry of (params.get("layers") || "").split(",")) {
      const match = /^([a-z_]+)\.(on|dim|off)$/.exec(entry);
      if (match && Object.hasOwn(MODULES, match[1])) layers[match[1]] = match[2];
    }
    for (const mod of moduleKeys) {
      const stored = saved?.modules?.[mod];
      moduleStates[mod] = failedModules.has(mod) ? "off" : singleModule ? "on"
        : layers[mod] || (MODULE_STATES.includes(stored) ? stored : INITIAL_STATE[mod]);
      const hidden = new Set((params.get(`hide.${mod}`) || "").split(","));
      hiddenCats[mod] = new Set(failedModules.has(mod) ? []
        : blocks[mod].cats.filter(c => hidden.has(c.key)).map(c => c.key));
      delete snapshots[mod];
    }
    const source = ["osm", "official"].includes(params.get("src")) ? params.get("src") : saved?.source;
    requestedZoningSource = source === "official" && officialEntry && !officialFailed ? "official" : "osm";
    syncZoningSource();
    // Se reconstruye todo antes de tocar capas o inspección. Las capas que aún
    // no existen reciben hiddenCats en addLayerOrdered cuando llegan.
    for (const id of Object.keys(layerModule)) staleFilters.add(id);
    applyAllStates(false);
    const base = ["dark", "sat"].includes(params.get("base")) ? params.get("base") : saved?.basemap;
    setBasemap(base === "sat" ? "sat" : "dark", false);
    syncModules();
    for (const mod of moduleKeys) syncCategories(mod);
    updateCounts();
    syncInspection();
    writeViewHash();
  }

  // ── Share: hoja nativa táctil, portapapeles o enlace seleccionable ──
  const shareBtn = document.getElementById("share-view");
  const shareStatus = document.getElementById("share-status");
  const sharePanel = document.getElementById("share-panel");
  const shareInput = sharePanel.querySelector("input");
  let shareStatusTimer = null;

  function closeSharePanel() {
    if (sharePanel.hidden) return;
    sharePanel.hidden = true;
    shareBtn.setAttribute("aria-expanded", "false");
    shareBtn.focus({ preventScroll: true });
  }

  function openSharePanel(url) {
    shareInput.value = url;
    sharePanel.hidden = false;
    shareBtn.setAttribute("aria-expanded", "true");
    shareInput.focus({ preventScroll: true });
    shareInput.select();
  }

  async function shareView() {
    const url = writeViewHash(true);
    closeSharePanel();
    clearTimeout(shareStatusTimer);
    shareStatus.hidden = true;
    if (window.matchMedia("(hover: none) and (pointer: coarse)").matches && navigator.share) {
      try {
        await navigator.share({ title: `${CITY_META.display_name} — CS2 zoning map`, url });
        return;
      } catch (error) {
        if (error.name === "AbortError") return;
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      shareStatus.textContent = "Link copied";
      shareStatus.hidden = false;
      shareStatusTimer = setTimeout(() => { shareStatus.hidden = true; }, 2000);
    } catch {
      openSharePanel(url);
    }
  }
  shareBtn.addEventListener("click", shareView);
  sharePanel.querySelector("button").addEventListener("click", closeSharePanel);
  document.addEventListener("click", ev => {
    if (!sharePanel.hidden && !sharePanel.contains(ev.target) && !shareBtn.contains(ev.target)) closeSharePanel();
  });
  document.addEventListener("keydown", ev => {
    if (ev.key !== "Escape" || sharePanel.hidden) return;
    // Se consume en captura: ese Escape no llega a la selección ni al hover.
    ev.preventDefault();
    ev.stopImmediatePropagation();
    closeSharePanel();
  }, true);

  // ══════════════════════════════════════════════════════════════════════════
  // INSPECCIÓN — hover transitorio y ficha fija, sin reprocesar las teselas
  // ══════════════════════════════════════════════════════════════════════════
  // Las líneas finas se buscan en un cuadrado de ±4 px (clickear una calle de
  // 0.8 px exacta es imposible); las áreas priorizan el punto mismo.
  const LINE_LAYERS = ["vial-line", "transporte-line", "infra-line", "services-points", "infra-points"];
  const AREA_LAYERS = ["zoning-fill", "official-fill", "services-fill", "infra-fill"];

  const isZone = hit => hit && (hit.layerId === "zoning-fill" || hit.layerId === "official-fill");

  function inspectable(hit) {
    const mod = layerModule[hit.layerId];
    return !!MODULES[mod]?.enabled && moduleStates[mod] !== "off" &&
      !hiddenCats[mod]?.has(hit.properties.k) &&
      (!isZone(hit) || hit.layerId === (currentZoningSource === "official" ? "official-fill" : "zoning-fill"));
  }

  function captureHit(f) {
    // layerId describe la ficha; no forma parte de la identidad del feature-state.
    const id = f.id ?? f.properties.id;
    const safeId = typeof id === "string" || Number.isSafeInteger(id);
    const identity = safeId ? {
      source: f.source,
      ...(f.sourceLayer ? { sourceLayer: f.sourceLayer } : {}), id,
    } : null;
    return { identity, source: f.source, layerId: f.layer.id, properties: { ...f.properties } };
  }

  function sameIdentity(a, b) {
    return !!a && !!b && a.source === b.source && a.sourceLayer === b.sourceLayer && a.id === b.id;
  }

  function setInspectionState(hit, key, value) {
    if (isZone(hit) && hit.identity && map.getSource(hit.identity.source)) {
      map.setFeatureState(hit.identity, { [key]: value });
    }
  }

  function externalSource(p) {
    if (p.s === "google" || /^g/.test(String(p.id))) return "Google Open Buildings";
    if (p.s === "microsoft" || /^ms/.test(String(p.id))) return "Microsoft Building Footprints";
    return "";
  }

  // De dónde salió la zona de un edificio de OSM (columna m del extractor)
  const METHOD_LABELS = {
    area: "Guessed from size",
    landuse: "From OSM land use",
    height: "From building height",
    morphology: "Inferred from building shape",
  };
  const methodLabel = m => METHOD_LABELS[m] || "From OSM tags";
  // Las que conviene ver ya al pasar el mouse: son estimaciones
  const GUESSED_METHODS = new Set(["area", "morphology"]);

  function describeHit(hit) {
    const p = hit.properties;
    const mod = layerModule[hit.layerId];
    const meta = blocks[mod]?.cats.find(c => c.key === p.k);
    const label = meta?.label || p.k || "Unknown";
    if (isZone(hit)) {
      const official = hit.layerId === "official-fill";
      const data = official ? window[`DATA_OFFICIAL_${String(p.k).toUpperCase()}`]?.[p.i] : null;
      const external = externalSource(p);
      const method = methodLabel(p.m);
      const provenance = official ? `Official plan: ${officialName}` : external
        ? external + (p.c != null ? ` · confidence ${p.c}` : "") : method;
      return { zone: true, label, name: data?.name || p.n || "Unnamed", color: ZONES[p.k]?.neon,
        provenance, note: !official && external && p.m === "area" ? method : "" };
    }
    if (mod === "vial") return {
      label, name: p.n || "Unnamed road", color: VIAL_TYPES[p.k]?.neon,
      detail: p.b ? "bridge" : "",
    };
    let data;
    if (mod === "services") data = serviceIndex[hit.layerId === "services-fill" ? "poly" : "point"][p.k]?.[p.i];
    else if (mod === "transporte") data = window[`DATA_TRANSPORT_${String(p.k).toUpperCase()}`]?.[p.i];
    else if (mod === "infraestructura") data = window[`DATA_INFRA_${String(p.k).toUpperCase()}`]?.[p.i];
    return {
      label, name: data?.name || (mod === "transporte" ? "Unknown route" : "Unnamed"),
      color: (mod === "services" ? SERVICES_TYPES[p.k] : mod === "transporte" ? TRANSPORT_STYLE[p.k] : INFRA_STYLE[p.k])?.color,
      detail: [data?.subtype, data?.operator].filter(Boolean).join(" · "),
      tags: mod === "services" ? (data?.tags || {}) : null,
    };
  }

  function hitKey(hit) {
    const p = hit.properties;
    if (isZone(hit)) return JSON.stringify([hit.source, hit.identity?.id ?? p.id ?? [p.k, p.i]]);
    if (hit.layerId === "vial-line") return JSON.stringify(["road", p.k, p.n || "", !!p.b]);
    return JSON.stringify([hit.source, p.k, p.i]);
  }

  function hitsAt(point) {
    const present = ids => ids.filter(id => map.getLayer(id));
    const eligible = f => inspectable({ layerId: f.layer.id, properties: f.properties });
    const box = [[point.x - 4, point.y - 4], [point.x + 4, point.y + 4]];
    const lines = map.queryRenderedFeatures(box, { layers: present(LINE_LAYERS) }).filter(eligible);
    const areas = map.queryRenderedFeatures(point, { layers: present(AREA_LAYERS) }).filter(eligible);
    // El borde de un edificio chico puede quedar fuera del relleno. La misma
    // tolerancia sirve al click y al hover, sin desplazar un área bajo el cursor.
    if (!areas.length) {
      const layers = present([currentZoningSource === "official" ? "official-fill" : "zoning-fill"]);
      if (layers.length && moduleStates.zoning !== "off") {
        const nearBox = [[point.x - 3, point.y - 3], [point.x + 3, point.y + 3]];
        const nearby = map.queryRenderedFeatures(nearBox, { layers }).find(eligible);
        if (nearby) areas.push(nearby);
      }
    }
    const hits = [...lines, ...areas];
    // De arriba hacia abajo según el orden de dibujo, pero lo atenuado (Dim) va
    // después de lo prendido: una calle casi invisible no le gana a la zona
    const dimmed = id => (moduleStates[layerModule[id]] === "dim" ? 1 : 0);
    return hits.sort((a, b) => (dimmed(a.layer.id) - dimmed(b.layer.id)) ||
      (LAYER_ORDER.indexOf(b.layer.id) - LAYER_ORDER.indexOf(a.layer.id)));
  }

  function placeSelection() {
    const small = window.matchMedia(SMALL_SCREEN).matches;
    const floating = !small && !document.body.classList.contains("col-open");
    selectionEl.classList.toggle("is-floating", floating);
    if (floating) document.body.appendChild(selectionEl);
    else colEl.insertBefore(selectionEl, small ? colBody : colEl.querySelector(".col-foot"));
    placeFramePanel();
  }

  function syncOnlyButton() {
    const btn = selectionEl.querySelector(".sel-only");
    if (btn) btn.textContent = snapshots.zoning ? "Restore" : "Only this zone";
  }

  function renderAlso() {
    const el = selectionEl.querySelector(".sel-also");
    if (!el) return;
    const hits = selectedAlso.filter(inspectable);
    el.hidden = hits.length === 0;
    el.innerHTML = `<h3>Also here</h3><ul>` + hits.slice(0, 6).map(hit => {
      const info = describeHit(hit);
      return `<li>${escHtml(info.name)} · ${escHtml(info.label)}</li>`;
    }).join("") + `</ul>` + (hits.length > 6 ? `<div class="inspect-meta">+${hits.length - 6} more</div>` : "");
  }

  function renderSelection() {
    const hit = selectedHit;
    const info = describeHit(hit);
    const title = (info.color ? areaSwatch(info.color) : "") + escHtml(info.zone ? info.label : info.name);
    const tags = info.tags ? `<details><summary>OSM tags</summary><div class="sel-tags">` +
      Object.entries(info.tags).map(([k, v]) => `<div><b>${escHtml(k)}</b>=${escHtml(v)}</div>`).join("") + `</div></details>` : "";
    const lon = ((selectedLocation.lng + 180) % 360 + 360) % 360 - 180;
    selectionEl.innerHTML = `<div class="sel-head"><h2>SELECTED</h2>` +
      `<button type="button" class="sel-clear icon-btn" aria-label="Clear selection">✕</button></div>` +
      `<div class="sel-primary" data-layer="${escHtml(hit.layerId)}" data-cat="${escHtml(hit.properties.k)}">` +
      `<div class="inspect-title">${title}</div>` +
      `<div class="inspect-meta">${escHtml(info.zone ? info.name : info.label)}</div>` +
      (info.provenance ? `<div class="inspect-meta">${escHtml(info.provenance)}</div>` : "") +
      (info.note || info.detail ? `<div class="inspect-meta">${escHtml(info.note || info.detail)}</div>` : "") + tags +
      (info.zone ? `<div class="sel-actions"><button type="button" class="sel-only only-btn">Only this zone</button>` +
        `<a class="sel-osm" href="https://www.openstreetmap.org/query?lat=${selectedLocation.lat}&amp;lon=${lon}" target="_blank" rel="noopener noreferrer">Explore on OSM ↗</a></div>` : "") +
      `</div><div class="sel-also"></div>`;
    syncOnlyButton();
    renderAlso();
    selectionEl.hidden = false;
    selectionEl.scrollTop = 0;
    placeSelection();
    updateSummary();
  }

  function clearSelection() {
    setInspectionState(selectedHit, "selected", false);
    selectedHit = null;
    selectedLocation = null;
    selectedAlso = [];
    selectionEl.hidden = true;
    selectionEl.replaceChildren();
    placeFramePanel();
    updateSummary();
  }

  function clearHover() {
    if (hoverFrame !== null) cancelAnimationFrame(hoverFrame);
    hoverFrame = null;
    hoverPending = null;
    setInspectionState(hoveredHit, "hover", false);
    if (hoveredHit) blocks.zoning?.rows[hoveredHit.properties.k]?.el.classList.remove("is-hover");
    hoveredHit = null;
    hoverTip.hidden = true;
    map.getCanvas().style.cursor = measureActive ? "crosshair" : "";
  }

  function syncInspection() {
    // hiddenCats ya refleja el cambio aunque el worker aún esté filtrando.
    if (hoveredHit && !inspectable(hoveredHit)) clearHover();
    if (selectedHit && !inspectable(selectedHit)) clearSelection();
    else if (selectedHit) { syncOnlyButton(); renderAlso(); }
  }

  function showHover(hit, point) {
    if (!hit) { clearHover(); return; }
    if (!sameIdentity(hoveredHit?.identity, hit.identity)) {
      clearHover();
      hoveredHit = hit;
      setInspectionState(hit, "hover", true);
      blocks.zoning?.rows[hit.properties.k]?.el.classList.add("is-hover");
      const info = describeHit(hit);
      const p = hit.properties;
      const notes = hit.layerId === "official-fill" ? ["Official plan"] :
        [GUESSED_METHODS.has(p.m) ? methodLabel(p.m) : "", externalSource(p)].filter(Boolean);
      hoverTip.innerHTML = `<div class="inspect-title">${info.color ? areaSwatch(info.color) : ""}${escHtml(info.label)}</div>` +
        (info.name !== "Unnamed" ? `<div class="inspect-meta">${escHtml(info.name)}</div>` : "") +
        notes.map(note => `<div class="inspect-meta">${escHtml(note)}</div>`).join("");
    }
    hoverTip.hidden = false;
    const rect = map.getCanvas().getBoundingClientRect();
    const x = rect.left + point.x, y = rect.top + point.y;
    const w = hoverTip.offsetWidth, h = hoverTip.offsetHeight;
    hoverTip.style.left = `${Math.max(8, Math.min(x + 14 + w > window.innerWidth - 8 ? x - w - 14 : x + 14, window.innerWidth - w - 8))}px`;
    hoverTip.style.top = `${Math.max(8, Math.min(y + 14 + h > window.innerHeight - 8 ? y - h - 14 : y + 14, window.innerHeight - h - 8))}px`;
  }

  selectionEl.addEventListener("click", ev => {
    if (ev.target.closest(".sel-clear")) {
      clearSelection();
      (window.matchMedia(SMALL_SCREEN).matches ? trayToggle : document.body.classList.contains("col-open") ? layersCloseBtn : layersOpenBtn).focus({ preventScroll: true });
    } else if (ev.target.closest(".sel-only") && isZone(selectedHit)) {
      if (snapshots.zoning) restoreCategories("zoning");
      else showOnly("zoning", [selectedHit.properties.k]);
    }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") { clearHover(); clearSelection(); } });

  map.on("click", ev => {
    if (frameDragging || frameSuppressClick || ev.originalEvent?.target?.closest(".frame-handle")) return;
    if (measureActive) { addMeasurePoint(ev); return; }
    const hits = hitsAt(ev.point).map(captureHit);
    const primary = hits.find(isZone) || hits[0];
    if (!primary) { clearHover(); clearSelection(); return; }
    setInspectionState(selectedHit, "selected", false);
    selectedHit = primary;
    selectedLocation = { lat: ev.lngLat.lat, lng: ev.lngLat.lng };
    const seen = new Set([hitKey(primary)]);
    selectedAlso = hits.filter(hit => {
      const key = hitKey(hit);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    setInspectionState(primary, "selected", true);
    renderSelection();
  });

  // Una sola consulta por frame; salir o arrastrar cancela también la pendiente.
  map.on("mousemove", ev => {
    if (measureActive) { previewMeasure(ev); return; }
    if (!hoverMedia.matches || dragging) return;
    if (ev.originalEvent?.target?.closest(".frame-handle")) { clearHover(); return; }
    hoverPending = ev.point;
    if (hoverFrame !== null) return;
    hoverFrame = requestAnimationFrame(() => {
      const pt = hoverPending;
      hoverFrame = null;
      hoverPending = null;
      if (!pt || dragging || !hoverMedia.matches || measureActive) return;
      const hits = hitsAt(pt);
      const zone = hits.find(f => f.layer.id === "zoning-fill" || f.layer.id === "official-fill");
      showHover(zone ? captureHit(zone) : null, pt);
      map.getCanvas().style.cursor = hits.length ? "pointer" : "";
    });
  });
  map.getCanvas().addEventListener("mouseleave", clearHover);
  map.on("dragstart", () => { dragging = true; clearHover(); });
  map.on("dragend", () => { dragging = false; });
  map.on("zoomstart", clearHover);
  map.on("touchstart", clearHover);
  hoverMedia.addEventListener("change", clearHover);
  placeSelection();

  // ══════════════════════════════════════════════════════════════════════════
  // MÓDULOS SECUNDARIOS — hooks llamados por bootstrap cuando cargan
  // ══════════════════════════════════════════════════════════════════════════
  window.officialZoningLoaded = async function () {
    // El plan oficial es una fuente del bloque de zonas: sin zonas no hay dónde elegirlo
    if (!hasZoning) return;
    await mapReady;
    const features = [];
    for (const zKey of Object.keys(ZONES)) {
      const data = window[`DATA_OFFICIAL_${zKey.toUpperCase()}`];
      if (!Array.isArray(data)) continue;
      data.forEach((item, i) => {
        if (!item.coords || item.coords.length < 3) return;
        features.push({ type: "Feature", properties: { k: zKey, i }, geometry: polygonGeometry(item.coords) });
        officialCounts[zKey]++;
      });
    }
    map.addSource("cs2-official", { type: "geojson", generateId: true, data: { type: "FeatureCollection", features } });
    addLayerOrdered({
      id: "official-fill", type: "fill", source: "cs2-official",
      layout: { visibility: "none" },
      paint: { "fill-color": zoneColor, "fill-opacity": 0.55 },
    }, "zoning");
    addLayerOrdered({
      id: "official-line", type: "line", source: "cs2-official",
      layout: { visibility: "none" },
      paint: { "line-color": zoneNeon, "line-width": 0.7, "line-opacity": 0.9 },
    }, "zoning");
    addLayerOrdered({
      ...inspectionLayer({ source: "cs2-official" }, "official-hover"),
      layout: { visibility: "none" },
    }, "zoning");
    countsKnown.official_zoning = true;
    setZoningSource(requestedZoningSource, false);
    // Recién ahora se puede elegir: antes, el mapa se quedaba sin zonas
    const btn = colBody.querySelector('[data-source="official"]');
    if (btn) btn.disabled = false;
    const nameEl = colBody.querySelector(".src-name");
    if (nameEl) nameEl.textContent = `Official plan: ${officialName}`;
    window._cs2OfficialZoningCount = features.length;
    console.log(`[official_zoning] Loaded ${features.length} polygons.`);
  };

  window.transporteLoaded = async function () {
    await mapReady;
    const features = [];
    for (const cat of Object.keys(TRANSPORT_STYLE)) {
      const data = window[`DATA_TRANSPORT_${cat.toUpperCase()}`];
      if (!Array.isArray(data)) continue;
      data.forEach((route, i) => {
        if (!route.coords || route.coords.length < 2) return;
        features.push({ type: "Feature", properties: { k: cat, i }, geometry: lineGeometry(route.coords) });
        transportCounts[cat]++;
      });
    }
    const byCat = prop => ["match", ["get", "k"],
      ...Object.entries(TRANSPORT_STYLE).flatMap(([k, st]) => [k, st[prop]]), TRANSPORT_STYLE.bus[prop]];
    map.addSource("cs2-transporte", { type: "geojson", data: { type: "FeatureCollection", features } });
    // Oculta hasta que secondaryModuleReady le aplique su estado (así no
    // aparece un instante si estaba apagada)
    addLayerOrdered({
      id: "transporte-line", type: "line", source: "cs2-transporte",
      layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
      paint: { "line-color": byCat("color"), "line-width": byCat("weight"), "line-opacity": byCat("opacity") },
    }, "transporte");
    window._cs2TransporteCount = features.length;
    console.log(`[transporte] Loaded ${features.length} routes.`);
    secondaryModuleReady("transporte");
  };

  // Un módulo que carga tarde arranca como lo dejó la persona la última vez
  // (con el valor de la primera visita si nunca lo tocó)
  function secondaryModuleReady(key) {
    MODULES[key].enabled = true;
    countsKnown[key] = true;
    applyModuleState(key);
    syncModules();
    updateCounts([key]);
    writeViewHash();
    refreshExportControls();
  }

  window.infraestructuraLoaded = async function () {
    await mapReady;
    const features = [];
    for (const cat of Object.keys(INFRA_STYLE)) {
      const data = window[`DATA_INFRA_${cat.toUpperCase()}`];
      if (!Array.isArray(data)) continue;
      data.forEach((f, i) => {
        if (!f.coords) return;
        let geometry;
        if (f.kind === "point") geometry = { type: "Point", coordinates: lngLat(f.coords) };
        else if (f.kind === "polygon") geometry = f.coords.length >= 3 ? polygonGeometry(f.coords) : null;
        else geometry = f.coords.length >= 2 ? lineGeometry(f.coords) : null;
        if (!geometry) return;
        features.push({ type: "Feature", properties: { k: cat, i }, geometry });
        infraCounts[cat]++;
      });
    }
    const color = ["match", ["get", "k"],
      ...Object.entries(INFRA_STYLE).flatMap(([k, st]) => [k, st.color]), "#999999"];
    const isType = t => ["==", ["geometry-type"], t];
    map.addSource("cs2-infra", { type: "geojson", data: { type: "FeatureCollection", features } });
    const startHidden = { visibility: "none" };   // hasta secondaryModuleReady
    addLayerOrdered({
      id: "infra-fill", type: "fill", source: "cs2-infra", filter: isType("Polygon"), layout: startHidden,
      paint: { "fill-color": color, "fill-opacity": 0.25 },
    }, "infraestructura");
    addLayerOrdered({
      id: "infra-line", type: "line", source: "cs2-infra", filter: ["!", isType("Point")], layout: startHidden,
      paint: { "line-color": color, "line-width": 2, "line-opacity": 0.85 },
    }, "infraestructura");
    addLayerOrdered({
      id: "infra-points", type: "circle", source: "cs2-infra", filter: isType("Point"), layout: startHidden,
      paint: {
        "circle-radius": 4, "circle-color": color, "circle-opacity": 0.9,
        "circle-stroke-color": color, "circle-stroke-width": 2, "circle-stroke-opacity": 0.85,
      },
    }, "infraestructura");
    window._cs2InfraCount = features.length;
    console.log(`[infraestructura] Loaded ${features.length} features.`);
    secondaryModuleReady("infraestructura");
  };

  // ══════════════════════════════════════════════════════════════════════════
  // MAIN LOADER
  // ══════════════════════════════════════════════════════════════════════════
  async function loadAll() {
    await mapReady;

    if (hasZoning) {
      setP("zoning", "loading", tileMode ? "⟳ Tiles…" : "⟳ Render…");
      if (tileMode) {
        Object.assign(zoneCounts, TILESET.counts.zoning || {});
      }
      const src = tileMode ? { source: "cs2", "source-layer": "zoning" } : { source: "cs2-zoning" };
      if (tileMode && !map.getSource("cs2")) addTileSource();
      if (!tileMode) map.addSource("cs2-zoning", { type: "geojson", promoteId: "id", data: zoningGeoJSON(), attribution: OSM_ATTR });
      for (const layer of zoningLayers(src, "zoning")) addLayerOrdered(layer, "zoning");
    }

    if (hasVial) {
      setP("vial", "loading", tileMode ? "⟳ Tiles…" : "⟳ Render…");
      if (tileMode) {
        Object.assign(vialCounts, TILESET.counts.vial || {});
        if (!map.getSource("cs2")) addTileSource();
      } else {
        map.addSource("cs2-vial", { type: "geojson", data: vialGeoJSON(), attribution: OSM_ATTR });
      }
      const byKey = prop => ["match", ["get", "k"],
        ...Object.entries(VIAL_TYPES).flatMap(([k, v]) => [k, v[prop]]), VIAL_TYPES.local[prop]];
      addLayerOrdered({
        id: "vial-line", type: "line",
        ...(tileMode ? { source: "cs2", "source-layer": "vial" } : { source: "cs2-vial" }),
        filter: withGate(null),
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": byKey("neon"),
          // bridge → +0.5 px para diferenciar visualmente puentes
          "line-width": ["+", byKey("weight"), ["case", ["to-boolean", ["get", "b"]], 0.5, 0]],
          "line-opacity": 0.85,
        },
      }, "vial");
    }

    if (hasServices) {
      setP("services", "loading", "⟳ Render…");
      const [polys, points] = servicesGeoJSON();
      const color = ["match", ["get", "k"],
        ...Object.entries(SERVICES_TYPES).flatMap(([k, t]) => [k, t.color]), "#999999"];
      map.addSource("cs2-services-poly", { type: "geojson", data: polys });
      map.addSource("cs2-services-pt", { type: "geojson", data: points });
      for (const [key, type] of Object.entries(SERVICES_TYPES)) {
        const { image, pixelRatio } = serviceIconImage(type);
        map.addImage(`svc-${key}`, image, { pixelRatio });
      }
      addLayerOrdered({
        id: "services-fill", type: "fill", source: "cs2-services-poly",
        paint: { "fill-color": color, "fill-opacity": 0.35 },
      }, "services");
      addLayerOrdered({
        id: "services-line", type: "line", source: "cs2-services-poly",
        paint: { "line-color": color, "line-width": 1.5, "line-opacity": 0.9 },
      }, "services");
      addLayerOrdered({
        id: "services-points", type: "symbol", source: "cs2-services-pt",
        minzoom: SERVICES_POINT_MINZOOM,
        layout: {
          "icon-image": ["concat", "svc-", ["get", "k"]],
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
        },
      }, "services");
    }

    // Los conteos de zonas, calles y servicios ya se conocen (de tiles.json o
    // de los datos): recién ahora se pueden agrupar las categorías vacías
    countsKnown.zoning = hasZoning;
    countsKnown.vial = hasVial;
    countsKnown.services = hasServices;
    applyAllStates();
    syncModules();
    updateCounts();

    // La pantalla de carga se va cuando NUESTROS datos del primer encuadre están
    // cargados y dibujados (el fondo de Esri puede tardar o fallar: no se espera)
    await waitForSources(["cs2", "cs2-zoning", "cs2-vial", "cs2-services-poly", "cs2-services-pt"]);
    if (hasZoning)   setP("zoning", "done", `✓ ${sum(zoneCounts).toLocaleString("en-US")}`);
    if (hasVial)     setP("vial", "done", `✓ ${sum(vialCounts).toLocaleString("en-US")}`);
    if (hasServices) setP("services", "done", `✓ ${sum(serviceCounts).toLocaleString("en-US")}`);
    bump(sum(zoneCounts) + sum(vialCounts) + sum(serviceCounts));
    finalizeLoad();
  }

  function waitForSources(ids, timeoutMs = 15000) {
    const present = ids.filter(id => map.getSource(id));
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        map.off("sourcedata", check);
        // Un frame más para que lo cargado llegue a la pantalla
        map.once("render", resolve);
        map.triggerRepaint();
      };
      const check = () => {
        if (present.every(id => map.isSourceLoaded(id))) finish();
      };
      const timer = setTimeout(finish, timeoutMs);   // por si una tesela no llega nunca
      map.on("sourcedata", check);
      check();
    });
  }

  function addTileSource() {
    map.addSource("cs2", {
      type: "vector",
      promoteId: { zoning: "id" },
      tiles: ["cs2tiles://{z}/{x}/{y}"],
      minzoom: TILESET.minzoom,
      maxzoom: TILESET.maxzoom,
      bounds: TILESET.bounds,
      attribution: OSM_ATTR,
    });
  }

  function finalizeLoad() {
    // Llenar la barra hasta el final antes del fade-out
    if (progressFill) progressFill.style.width = "100%";

    const overlay = document.getElementById("loading");
    overlay.style.transition = "opacity 0.5s";
    setTimeout(() => { overlay.style.opacity = "0"; }, 200);
    setTimeout(() => { overlay.style.display = "none"; }, 730);

  }

  // ══════════════════════════════════════════════════════════════════════════
  // GO
  // ══════════════════════════════════════════════════════════════════════════
  importViewHash();
  // MapLibre registró primero su handler: mueve la cámara antes de importar
  // los demás campos. replaceState y moveend no reimportan filtros.
  window.addEventListener("hashchange", importViewHash);
  loadAll().catch(e => {
    console.error("[render] error:", e);
    for (const key of Object.keys(pitems)) setP(key, "error", "✗ Error");
  });
}

// Lanzar todo
bootstrap();
</script>
</body>
</html>
