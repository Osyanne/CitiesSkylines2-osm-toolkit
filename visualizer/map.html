};

// Zooms de MapLibre (teselas de 512 px): equivalen al zoom de Leaflet - 1.
// cities.json guarda zooms de Leaflet.
const SERVICES_POINT_MINZOOM = 11;       // markers de servicios desde Leaflet 12

// Mismas reglas que src/shared/tiles.py. Con teselas ya vienen aplicadas; solo
// se usan cuando la ciudad se dibuja desde los datos completos.
const TIER_MIN_AREA_M2 = { res_low_house: 3000, prk_surface: 3000 };
const TIER_MINZOOM = 13;
const VIAL_MINZOOM = { local: 11, bike: 12, pedestrian: 13 };

// Fondo "Atenuado": factor sobre la opacidad propia de cada capa
const FADE = 0.3;

// ════════════════════════════════════════════════════════════════════════════
// GEOMETRY — polyAreaM2: área aproximada en m² (proyección equirectangular)
// ════════════════════════════════════════════════════════════════════════════
function polyAreaM2(ring) {
  if (!ring || ring.length < 3) return 0;
  const lat0 = ring.reduce((s, p) => s + p[0], 0) / ring.length;
  const cosLat0 = Math.cos(lat0 * Math.PI / 180);
  const MperDegLat = 111320;
  const MperDegLon = 111320 * cosLat0;
  const pts = ring.map(p => [p[1] * MperDegLon, p[0] * MperDegLat]);
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i];
    const [x1, y1] = pts[(i + 1) % pts.length];
    s += x0 * y1 - x1 * y0;
  }
  return Math.abs(s) / 2;
}

// [lat, lon] (datos del toolkit) → [lon, lat] (GeoJSON / MapLibre)
const lngLat = c => [c[1], c[0]];

function polygonGeometry(coords) {
  const ring = coords.map(lngLat);
  const first = ring[0], last = ring[ring.length - 1];
  if (first[0] !== last[0] || first[1] !== last[1]) ring.push(first);
  return { type: "Polygon", coordinates: [ring] };
}

function lineGeometry(coords) {
  return { type: "LineString", coordinates: coords.map(lngLat) };
}

// Anti-XSS: OSM names son contenido user-generated.
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ════════════════════════════════════════════════════════════════════════════
// POPUPS — mismo contenido que el visor Leaflet
// ════════════════════════════════════════════════════════════════════════════
function zoningPopupHtml(p) {
  const zone = ZONES[p.k];
  if (!zone) return null;
  // Fuente: OSM (default) vs Google Open Buildings ML (s === "google").
  const isExt = p.s === "google";
  const sourceLine = isExt
    ? `<span style="color:#555;font-size:10px">Google ML (conf ${escHtml(p.c)})</span>`
    : `<span style="color:#555;font-size:10px">OSM id ${escHtml(p.id)}</span>`;
  // Método de clasificación (encoding de incertidumbre):
  //   sin m      → tag-classified (OSM específico, alta confianza)
  //   "landuse"  → spatial-join contra landuse polygon (alta confianza)
  //   "area"     → heurística de área pura (baja confianza, mostrar como inferido)
  const methodLine =
    p.m === "area"
      ? `<span style="color:#d4a96d;font-size:10px">⚠ inferred from footprint area (low confidence)</span>`
      : p.m === "landuse"
        ? `<span style="color:#78c47b;font-size:10px">✓ inferred from OSM landuse context</span>`
        : `<span style="color:#7c9cd9;font-size:10px">✓ OSM tag-classified</span>`;
  const title = p.n ? escHtml(p.n) : (isExt ? "Building (ML)" : "Sin nombre");
  return `<div style="min-width:170px">` +
    `<b style="color:#ddd;font-size:13px">${title}</b><br>` +
    `<span style="display:inline-block;width:10px;height:10px;background:${zone.neon};` +
    `border-radius:2px;margin-right:5px;vertical-align:middle"></span>` +
    `<span style="color:${zone.neon};font-size:11px">${zone.label}</span><br>` +
    `${sourceLine}<br>` +
    `${methodLine}</div>`;
}

function officialPopupHtml(p) {
  const zone = ZONES[p.k];
  if (!zone) return null;
  return `<b style="color:#ddd">${zone.label}</b><br>` +
         `<span style="color:#888;font-size:11px">Official zoning</span>`;
}

function vialPopupHtml(p) {
  const meta = VIAL_TYPES[p.k];
  if (!meta || !p.n) return null;   // las calles sin nombre no tienen popup
  return `<div style="min-width:140px">` +
    `<b style="color:#ddd;font-size:12px">${escHtml(p.n)}</b><br>` +
    `<span style="color:${meta.neon};font-size:11px">${meta.label}</span>` +
    (p.b ? `<br><span style="color:#888;font-size:10px">puente</span>` : "") +
    `</div>`;
}

function servicePopupHtml(feat, key) {
  const type = SERVICES_TYPES[key];
  if (!feat || !type) return null;
  const name = feat.name ? escHtml(feat.name) : "<em>(sin nombre)</em>";
  const subtype = feat.subtype ? escHtml(feat.subtype) : "—";
  const tagsHtml = Object.entries(feat.tags || {})
    .map(([k, v]) => `<div><b>${escHtml(k)}</b>=${escHtml(String(v))}</div>`)
    .join("");
  return `<div style="font-size:12px;min-width:160px">` +
         `<div style="font-weight:700;color:${type.color};margin-bottom:4px;">${name}</div>` +
         `<div style="color:#888;margin-bottom:6px;">${escHtml(type.label)} · ${subtype}</div>` +
         `<details><summary style="cursor:pointer;color:#888;font-size:11px">Tags OSM</summary>` +
         `<div style="font-family:monospace;font-size:10px;margin-top:4px;color:#aaa">${tagsHtml}</div>` +
         `</details></div>`;
}

function transportPopupHtml(route, cat) {
  if (!route) return null;
  return `<b>${escHtml(route.name || "Unknown route")}</b><br>` +
         `<span style="color:#888;font-size:11px">${escHtml(TRANSPORT_LABELS[cat])}` +
         (route.operator ? ` · ${escHtml(route.operator)}` : "") + `</span>`;
}

function infraPopupHtml(f, cat) {
  if (!f) return null;
  return `<b>${escHtml(f.name || "Sin nombre")}</b><br>` +
    `<span style="color:#888;font-size:11px">${escHtml(INFRA_LABELS[cat])} · ${escHtml(f.subtype || "")}` +
    (f.operator ? ` · ${escHtml(f.operator)}` : "") + `</span>`;
}

// Ícono de servicio (círculo con letra) dibujado en canvas: sin fuentes de
// glifos externas y nítido en pantallas retina
function serviceIconImage(type) {
  const r = 2;
  const size = 26 * r;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  const c = size / 2;
  ctx.shadowColor = "rgba(0,0,0,0.6)";
  ctx.shadowBlur = 3 * r;
  ctx.shadowOffsetY = 1 * r;
  ctx.beginPath();
  ctx.arc(c, c, 10 * r, 0, Math.PI * 2);
  ctx.fillStyle = type.color;
  ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineWidth = 2 * r;
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = `700 ${11 * r}px Inter, system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(type.char, c, c + 0.5 * r);
  return { image: ctx.getImageData(0, 0, size, size), pixelRatio: r };
}

// ════════════════════════════════════════════════════════════════════════════
// renderMap — inicializa MapLibre y los módulos según manifest
// ════════════════════════════════════════════════════════════════════════════
function renderMap() {
  const [s, w, n, e] = CITY_META.bbox;
  const tileMode = !!TILESET;

  // Actualizar title desde metadata
  document.title = `CS2 OSM Toolkit — ${CITY_META.display_name}`;
  const titleText = document.getElementById("title-text");
  if (titleText) {
    titleText.textContent = CITY_META.display_name;
    // Apodo opcional que eligió quien pidió la ciudad: chico, entre paréntesis
    if (CITY_META.nickname) {
      const nick = document.createElement("small");
      nick.className = "nick";
      nick.textContent = ` (${CITY_META.nickname})`;
      titleText.appendChild(nick);
    }
  }

  // Qué módulos hay (manifest + teselas o variables globales presentes)
  const hasExternal = !tileMode && !!CITY_MANIFEST.modules?.external_buildings &&
    typeof DATA_EXT_RES_LOW_HOUSE !== "undefined";
  const hasZoning = tileMode
    ? TILESET.layers.includes("zoning")
    : (!!CITY_MANIFEST.modules?.zoning && typeof DATA_RES_LOW_HOUSE !== "undefined") || hasExternal;
  const hasVial = tileMode
    ? TILESET.layers.includes("vial")
    : !!CITY_MANIFEST.modules?.vial && typeof DATA_VIAL !== "undefined";
  const hasServices = !!CITY_MANIFEST.modules?.services && typeof DATA_SERVICES_POLYGONS !== "undefined";

  // ══════════════════════════════════════════════════════════════════════════
  // MAPA — MapLibre + fondo Esri
  // Esri: free, sin API key. CARTO dejó de servir tiles anónimos sin marca de
  // agua ("API KEY REQUIRED", 2026-09), así que el dark es Esri Dark Gray
  // Canvas: base + capa de etiquetas, oscurecida para el look CS2.
  // ══════════════════════════════════════════════════════════════════════════
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
  const ESRI_ATTR = 'Tiles © <a href="https://www.esri.com">Esri</a> © <a href="https://openstreetmap.org">OSM</a> contributors';
  const DARKEN = { "raster-brightness-max": 0.45, "raster-saturation": -0.25 };
  const OSM_ATTR = '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors';

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        "esri-dark": {
          type: "raster", tileSize: 256, maxzoom: 19, attribution: ESRI_ATTR,
          tiles: [`${ESRI}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`],
        },
        "esri-dark-ref": {
          type: "raster", tileSize: 256, maxzoom: 19,
          tiles: [`${ESRI}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`],
        },
        "esri-sat": {
          type: "raster", tileSize: 256, maxzoom: 19,
          attribution: 'Tiles © <a href="https://www.esri.com">Esri</a> World Imagery',
          tiles: [`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`],
        },
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": "#0a1220" } },
        { id: "base-dark", type: "raster", source: "esri-dark", paint: DARKEN },
        { id: "base-dark-ref", type: "raster", source: "esri-dark-ref", paint: DARKEN },
        { id: "base-sat", type: "raster", source: "esri-sat", layout: { visibility: "none" } },
      ],
    },
    // El mapa arranca ya encuadrado en la ciudad (nada de zoom de planeta)
    bounds: [[w, s], [e, n]],
    minZoom: tileMode ? TILESET.minzoom : 8,
    maxZoom: 19,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false,
    renderWorldCopies: false,
    attributionControl: false,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
  map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
  map.on("error", ev => console.warn("[map]", ev.error?.message || ev));
  window.CS2_MAP = map;   // para depurar desde la consola

  // Las capas se agregan apenas el estilo está listo. No se espera "load": ese
  // evento necesita que el fondo de Esri termine de bajar, y si Esri está
  // bloqueado (adblock, red corporativa) no llega nunca.
  const mapReady = new Promise(r => map.once("style.load", r));

  // ══════════════════════════════════════════════════════════════════════════
  // CAPAS — orden de dibujo (abajo → arriba) y opacidades base
  // ══════════════════════════════════════════════════════════════════════════
  const LAYER_ORDER = [
    "zoning-fill", "zoning-line", "zoning-line-lowconf",
    "official-fill", "official-line",
    "vial-line",
    "services-fill", "services-line",
    "transporte-line",
    "infra-fill", "infra-line", "infra-points",
    "services-points",
  ];
  const OPACITY_PROPS = {
    fill: ["fill-opacity"],
    line: ["line-opacity"],
    circle: ["circle-opacity", "circle-stroke-opacity"],
    symbol: ["icon-opacity"],
  };
  const baseOpacity = {};   // id → {prop: valor o expresión}
  const baseFilter = {};    // id → filtro propio de la capa (sin el de categorías)
  const layerModule = {};   // id → clave de categorías ("zoning", "vial", "services")

  function addLayerOrdered(layer, categoryKey) {
    const idx = LAYER_ORDER.indexOf(layer.id);
    const before = LAYER_ORDER.slice(idx + 1).find(id => map.getLayer(id));
    baseOpacity[layer.id] = Object.fromEntries(
      (OPACITY_PROPS[layer.type] || []).map(p => [p, layer.paint?.[p] ?? 1])
    );
    baseFilter[layer.id] = layer.filter || null;
    if (!layer.filter) delete layer.filter;   // MapLibre rechaza filter: null
    if (categoryKey) layerModule[layer.id] = categoryKey;
    map.addLayer(layer, before);
    applyCategoryFilter(layer.id);
  }

  const zoneColor = ["match", ["get", "k"], ...Object.entries(ZONES).flatMap(([k, z]) => [k, z.color]), "#888888"];
  const zoneNeon = ["match", ["get", "k"], ...Object.entries(ZONES).flatMap(([k, z]) => [k, z.neon]), "#aaaaaa"];
  const isLowConf = ["==", ["get", "m"], "area"];
  // Datos completos (sin teselas): los features traen su zoom mínimo en "mz"
  const zoomGate = tileMode ? null : [">=", ["zoom"], ["get", "mz"]];
  const withGate = f => (zoomGate ? (f ? ["all", zoomGate, f] : zoomGate) : f);

  function zoningLayers(src, idPrefix) {
    return [
      {
        id: `${idPrefix}-fill`, type: "fill", ...src, filter: withGate(null),
        // Visual encoding: baja confianza → fill semitransparente + borde punteado
        paint: { "fill-color": zoneColor, "fill-opacity": ["case", isLowConf, 0.22, 0.55] },
      },
      {
        id: `${idPrefix}-line`, type: "line", ...src, filter: withGate(["!", isLowConf]),
        paint: { "line-color": zoneNeon, "line-width": 0.7, "line-opacity": 0.9 },
      },
      {
        id: `${idPrefix}-line-lowconf`, type: "line", ...src, filter: withGate(isLowConf),
        // dasharray en múltiplos del ancho: 0.5 px × [8, 6] = el "4, 3" de Leaflet
        paint: { "line-color": zoneNeon, "line-width": 0.5, "line-opacity": 0.55, "line-dasharray": [8, 6] },
      },
    ];
  }

  // ══════════════════════════════════════════════════════════════════════════
  // CONTEOS — de tiles.json con teselas, de los datos si no
  // ══════════════════════════════════════════════════════════════════════════
  const zoneCounts = Object.fromEntries(Object.keys(ZONES).map(k => [k, 0]));
  const vialCounts = Object.fromEntries(Object.keys(VIAL_TYPES).map(k => [k, 0]));
  const serviceCounts = Object.fromEntries(Object.keys(SERVICES_TYPES).map(k => [k, 0]));
  const transportCounts = Object.fromEntries(Object.keys(TRANSPORT_STYLE).map(k => [k, 0]));
  const infraCounts = Object.fromEntries(Object.keys(INFRA_STYLE).map(k => [k, 0]));

  // Datos completos → GeoJSON (solo sin teselas)
  function zoningGeoJSON() {
    const features = [];
    for (const key of Object.keys(ZONES)) {
      const osm = window[`DATA_${key.toUpperCase()}`] || [];
      const ext = window[`DATA_EXT_${key.toUpperCase()}`] || [];
      for (const it of [...osm, ...ext]) {
        if (!it.coords || it.coords.length < 3) continue;
        const p = { k: key, id: it.id,
          mz: TIER_MIN_AREA_M2[key] && polyAreaM2(it.coords) < TIER_MIN_AREA_M2[key] ? TIER_MINZOOM : 0 };
        if (it.name) p.n = it.name;
        if (it.method != null) p.m = it.method;
        if (it.src != null) p.s = it.src;
        if (it.conf != null) p.c = it.conf;
        features.push({ type: "Feature", properties: p, geometry: polygonGeometry(it.coords) });
        zoneCounts[key]++;
      }
    }
    return { type: "FeatureCollection", features };
  }

  function vialGeoJSON() {
    const features = [];
    for (const [key, items] of Object.entries(DATA_VIAL)) {
      if (!VIAL_TYPES[key]) continue;
      for (const f of items) {
        if (!f.coords || f.coords.length < 2) continue;
        const p = { k: key, mz: VIAL_MINZOOM[key] || 0 };
        if (f.name) p.n = f.name;
        if (f.bridge) p.b = true;
        features.push({ type: "Feature", properties: p, geometry: lineGeometry(f.coords) });
        vialCounts[key]++;
      }
    }
    return { type: "FeatureCollection", features };
  }

  // Servicios, transporte e infraestructura: el popup sale del objeto original
  // (índice "i"), así los tags anidados no pasan por las propiedades de MapLibre
  const serviceIndex = { poly: {}, point: {} };
  function servicesGeoJSON() {
    const polys = [], points = [];
    for (const [key, items] of Object.entries(DATA_SERVICES_POLYGONS)) {
      if (!SERVICES_TYPES[key]) continue;
      serviceIndex.poly[key] = items;
      items.forEach((f, i) => {
        if (!f.coords || f.coords.length < 3) return;
        polys.push({ type: "Feature", properties: { k: key, i }, geometry: polygonGeometry(f.coords) });
        serviceCounts[key]++;
      });
    }
    for (const [key, items] of Object.entries(DATA_SERVICES_POINTS || {})) {
      if (!SERVICES_TYPES[key]) continue;
      serviceIndex.point[key] = items;
      items.forEach((f, i) => {
        if (!f.coord) return;
        points.push({ type: "Feature", properties: { k: key, i }, geometry: { type: "Point", coordinates: lngLat(f.coord) } });
        serviceCounts[key]++;
      });
    }
    return [{ type: "FeatureCollection", features: polys }, { type: "FeatureCollection", features: points }];
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PROGRESS UI — una fila por módulo cargado
  // ══════════════════════════════════════════════════════════════════════════
  const pgrid = document.getElementById("pgrid");
  const pitems = {};
  const progressFill = document.getElementById("progress-fill");
  let totalModuleSlots = 0;
  let doneSlots = 0;

  function addProgressItem(key, label) {
    const d = Object.assign(document.createElement("div"), { className: "pi", id: "pi-" + key });
    d.innerHTML = `<span>${label}</span><span class="pbadge">Pendiente</span>`;
    pgrid.appendChild(d);
    pitems[key] = d;
    totalModuleSlots++;
  }
  function setP(key, state, text) {
    if (!pitems[key]) return;
    const prevState = pitems[key].className.split(" ")[1] || "";
    pitems[key].className = "pi " + state;
    pitems[key].querySelector(".pbadge").textContent = text;

    if (!progressFill || totalModuleSlots === 0) return;
    // loading → cuenta como media; done → cuenta completa
    if (state === "done" && prevState !== "done") doneSlots++;
    const pct = state === "loading"
      ? Math.min(100, ((doneSlots + 0.5) / totalModuleSlots) * 100)
      : (doneSlots / totalModuleSlots) * 100;
    progressFill.style.width = pct.toFixed(1) + "%";
  }

  if (hasZoning)   addProgressItem("zoning",   "Zonificación");
  if (hasVial)     addProgressItem("vial",      "Red Vial");
  if (hasServices) addProgressItem("services",  "Servicios");

  let total = 0;
  function bump(count) {
    total += count;
    document.getElementById("tcnt").textContent = total.toLocaleString();
  }
  const sum = obj => Object.values(obj).reduce((a, b) => a + b, 0);

  // ══════════════════════════════════════════════════════════════════════════
  // MODULE TILE-ICONS — colored category icons en el top toolbar (estilo CS2)
  // ══════════════════════════════════════════════════════════════════════════
  const headerControls = document.getElementById("header-controls");
  const fondoControl = document.getElementById("fondo-control");

  // Iconos SVG por módulo (lucide-style stroke icons) + color de categoría CS2
  const MODULE_META = {
    zoning: {
      label: "Zoning",
      cat: "var(--cat-zoning)",
      svg: `<svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>` +
           `<path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>` +
           `<path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>` +
           `<path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>`,
    },
    vial: {
      label: "Red vial",
      cat: "var(--cat-vial)",
      svg: `<svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M12 13v8M12 3v3"/>` +
           `<path d="M18 6a2 2 0 0 1 1.387.56l2.307 2.22a1 1 0 0 1 0 1.44l-2.307 2.22A2 2 0 0 1 18 13H6a2 2 0 0 1-1.387-.56l-2.306-2.22a1 1 0 0 1 0-1.44l2.306-2.22A2 2 0 0 1 6 6z"/></svg>`,
    },
    services: {
      label: "Servicios",
      cat: "var(--cat-services)",
      svg: `<svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M12 11v4M14 13h-4"/>` +
           `<path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>` +
           `<rect x="4" y="6" width="16" height="13" rx="2"/></svg>`,
    },
    transporte: {
      label: "Transporte",
      cat: "var(--cat-transport)",
      svg: `<svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M8 6v6M15 6v6M2 12h19.6"/>` +
           `<path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>` +
           `<circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>`,
    },
    infraestructura: {
      label: "Infraestructura",
      cat: "var(--cat-infra)",
      svg: `<svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>`,
    },
  };

  function injectPill(moduleKey, enabled) {
    const meta = MODULE_META[moduleKey];
    if (!meta) return;
    const pill = document.createElement("button");
    pill.type = "button";
    pill.className = enabled ? "pill on" : "pill disabled";
    pill.dataset.module = moduleKey;
    pill.setAttribute("data-label", meta.label);
    pill.setAttribute("aria-label", meta.label);
    pill.setAttribute("aria-pressed", enabled ? "true" : "false");
    pill.style.setProperty("--cat", meta.cat);
    if (!enabled) pill.title = meta.label;
    let inner = meta.svg + `<span class="pill-label">${meta.label}</span>`;
    if (!enabled) {
      inner += `<svg class="pill-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
               `stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
               `<rect x="3" y="11" width="18" height="11" rx="2"/>` +
               `<path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
    }
    pill.innerHTML = inner;
    headerControls.insertBefore(pill, fondoControl);
  }

  function unlockPill(moduleKey) {
    const pill = document.querySelector(`.pill[data-module="${moduleKey}"]`);
    if (!pill) return;
    pill.classList.remove("disabled");
    const lock = pill.querySelector(".pill-lock");
    if (lock) lock.remove();
    pill.title = MODULE_META[moduleKey].label;
  }

  if (hasZoning)   injectPill("zoning",   true);
  if (hasVial)     injectPill("vial",     true);
  if (hasServices) injectPill("services", true);
  // Transporte e infraestructura cargan después: la pill espera bloqueada
  injectPill("transporte", false);
  injectPill("infraestructura", false);

  // Separador vertical antes del control Fondo
  {
    const sep = document.createElement("span");
    sep.className = "pill-sep";
    sep.setAttribute("aria-hidden", "true");
    headerControls.insertBefore(sep, fondoControl);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // MODULES — qué capas de MapLibre prende/apaga cada pill
  // ══════════════════════════════════════════════════════════════════════════
  let currentZoningSource = "osm";  // "osm" | "official"
  const ZONING_LAYERS = ["zoning-fill", "zoning-line", "zoning-line-lowconf"];
  const OFFICIAL_LAYERS = ["official-fill", "official-line"];

  const MODULES = {};
  if (hasZoning) {
    MODULES.zoning = {
      label: "Zoning",
      enabled: true,
      // La fuente activa (OSM u oficial) es la que prenden/apagan las pills
      layerIds: () => currentZoningSource === "official" ? OFFICIAL_LAYERS : ZONING_LAYERS,
      inactiveLayerIds: () => currentZoningSource === "official" ? ZONING_LAYERS : OFFICIAL_LAYERS,
    };
  }
  if (hasVial) {
    MODULES.vial = { label: "Vial", enabled: true, layerIds: () => ["vial-line"] };
  }
  if (hasServices) {
    MODULES.services = {
      label: "Servicios",
      enabled: true,
      layerIds: () => ["services-fill", "services-line", "services-points"],
    };
  }
  MODULES.transporte = { label: "Transporte", enabled: false, layerIds: () => ["transporte-line"] };
  MODULES.infraestructura = {
    label: "Infraestructura",
    enabled: false,
    layerIds: () => ["infra-fill", "infra-line", "infra-points"],
  };

  // State persistido en localStorage (scope por ciudad)
  const VIEW_STATE_KEY = `cs2-view-state-${CITY_SLUG}-v1`;

  function readViewState() {
    try {
      const raw = localStorage.getItem(VIEW_STATE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch { return null; }
  }

  function writeViewState(state) {
    try {
      localStorage.setItem(VIEW_STATE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("[view-state] no se pudo guardar:", e.message);
    }
  }

  const savedState = readViewState();
  const moduleStates = {};
  for (const key of Object.keys(MODULES)) {
    if (savedState && savedState.pills && savedState.pills[key]) {
      moduleStates[key] = savedState.pills[key];
    } else {
      moduleStates[key] = MODULES[key].enabled ? "on" : "off";
    }
  }
  let fondoMode = (savedState && savedState.fondo) || "hidden";

  // Categorías apagadas desde el control de capas (zona, tipo de vía, servicio)
  const hiddenCats = { zoning: new Set(), vial: new Set(), services: new Set() };

  function applyCategoryFilter(id) {
    if (!map.getLayer(id)) return;
    const base = baseFilter[id];
    const hidden = layerModule[id] ? [...hiddenCats[layerModule[id]]] : [];
    const catFilter = hidden.length ? ["!", ["in", ["get", "k"], ["literal", hidden]]] : null;
    const f = base && catFilter ? ["all", base, catFilter] : (base || catFilter);
    map.setFilter(id, f);
  }

  function setLayerState(id, visible, factor) {
    if (!map.getLayer(id)) return;
    map.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
    for (const [prop, value] of Object.entries(baseOpacity[id] || {})) {
      map.setPaintProperty(id, prop, factor === 1 ? value
        : (typeof value === "number" ? value * factor : ["*", factor, value]));
    }
  }

  function applyModuleState(moduleKey) {
    const state = moduleStates[moduleKey];
    const module = MODULES[moduleKey];
    if (!module || !module.enabled) return;

    const visible = state === "on" || fondoMode !== "hidden";
    const factor = state === "off" && fondoMode === "faded" ? FADE : 1;
    for (const id of module.layerIds()) setLayerState(id, visible, factor);
    for (const id of module.inactiveLayerIds?.() || []) setLayerState(id, false, 1);
  }

  function applyAllStates() {
    for (const key of Object.keys(MODULES)) {
      applyModuleState(key);
    }
  }

  function syncUI() {
    for (const pill of document.querySelectorAll(".pill")) {
      const key = pill.dataset.module;
      if (!MODULES[key]) continue;
      const on = moduleStates[key] === "on";
      pill.classList.toggle("on", on && MODULES[key].enabled);
      if (!pill.classList.contains("disabled")) {
        pill.setAttribute("aria-pressed", on ? "true" : "false");
      }
    }
    for (const mt of document.querySelectorAll(".master-toggle")) {
      const key = mt.dataset.module;
      if (!MODULES[key]) continue;
      mt.classList.toggle("on", moduleStates[key] === "on");
    }
    const anyOff = Object.keys(MODULES).some(
      k => MODULES[k].enabled && moduleStates[k] === "off"
    );
    document.getElementById("fondo-control").classList.toggle("visible", anyOff);
    document.getElementById("fondo-select").value = fondoMode;
  }

  function toggleModule(key) {
    if (!MODULES[key] || !MODULES[key].enabled) return;
    moduleStates[key] = moduleStates[key] === "on" ? "off" : "on";
    applyModuleState(key);
    syncUI();
    writeViewState({ pills: moduleStates, fondo: fondoMode });
  }

  function setFondo(mode) {
    fondoMode = mode;
    applyAllStates();
    syncUI();
    writeViewState({ pills: moduleStates, fondo: fondoMode });
  }

  function setZoningSource(mode) {
    currentZoningSource = mode;
    applyModuleState("zoning");
  }

  function wireUpModuleControls() {
    for (const pill of document.querySelectorAll(".pill")) {
      pill.addEventListener("click", () => toggleModule(pill.dataset.module));
    }
    for (const mt of document.querySelectorAll(".master-toggle")) {
      mt.addEventListener("click", () => toggleModule(mt.dataset.module));
    }
    document.getElementById("fondo-select").addEventListener("change", ev => {
      setFondo(ev.target.value);
    });
    document.querySelectorAll('input[name="zoning-source"]').forEach(input => {
      input.addEventListener("change", ev => setZoningSource(ev.target.value));
    });
  }

  // ══════════════════════════════════════════════════════════════════════════
  // CONTROLES — capas (abajo a la derecha) y leyenda (abajo a la izquierda)
  // ══════════════════════════════════════════════════════════════════════════
  class ElementControl {
    constructor(el) { this._el = el; }
    onAdd() { return this._el; }
    onRemove() { this._el.remove(); }
  }

  function buildLayersControl() {
    const el = document.createElement("div");
    el.className = "maplibregl-ctrl cs2-layers";
    let html = `<div class="cs2-layers-sect">Fondo</div>` +
      `<label><input type="radio" name="cs2-basemap" value="dark" checked> Dark (Esri)</label>` +
      `<label><input type="radio" name="cs2-basemap" value="sat"> Satellite (Esri)</label>`;
    const row = (mod, key, swatch, label) =>
      `<label><input type="checkbox" data-mod="${mod}" data-cat="${key}" checked>${swatch}${escHtml(label)}</label>`;
    if (hasZoning) {
      html += `<div class="cs2-layers-sect">Zonas</div>`;
      for (const [key, z] of Object.entries(ZONES)) {
        html += row("zoning", key, `<span style="display:inline-block;width:10px;height:10px;background:${z.neon};border-radius:2px;opacity:0.9"></span>`, z.label);
      }
    }
    if (hasVial) {
      html += `<div class="cs2-layers-sect">Vías</div>`;
      for (const [key, v] of Object.entries(VIAL_TYPES)) {
        html += row("vial", key, `<span style="display:inline-block;width:14px;height:2px;background:${v.neon}"></span>`, v.label);
      }
    }
    if (hasServices) {
      html += `<div class="cs2-layers-sect">Servicios</div>`;
      for (const [key, sv] of Object.entries(SERVICES_TYPES)) {
        html += row("services", key, `<span style="display:inline-block;width:12px;height:12px;background:${sv.color};color:white;text-align:center;line-height:12px;font-size:8px;font-weight:700;border-radius:50%">${sv.char}</span>`, sv.label);
      }
    }
    el.innerHTML = `<button type="button" class="cs2-layers-toggle" aria-label="Capas" title="Capas" aria-expanded="false"></button>` +
      `<div class="cs2-layers-panel hud-panel" hidden>${html}</div>`;

    const toggle = el.querySelector(".cs2-layers-toggle");
    const panel = el.querySelector(".cs2-layers-panel");
    const setOpen = open => {
      panel.hidden = !open;
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    };
    toggle.addEventListener("click", () => setOpen(panel.hidden));
    document.addEventListener("click", ev => { if (!el.contains(ev.target)) setOpen(false); });

    el.querySelectorAll('input[name="cs2-basemap"]').forEach(input => {
      input.addEventListener("change", () => {
        const sat = input.value === "sat";
        map.setLayoutProperty("base-sat", "visibility", sat ? "visible" : "none");
        map.setLayoutProperty("base-dark", "visibility", sat ? "none" : "visible");
        map.setLayoutProperty("base-dark-ref", "visibility", sat ? "none" : "visible");
      });
    });
    el.querySelectorAll("input[data-cat]").forEach(input => {
      input.addEventListener("change", () => {
        const set = hiddenCats[input.dataset.mod];
        if (input.checked) set.delete(input.dataset.cat); else set.add(input.dataset.cat);
        for (const id of Object.keys(layerModule)) {
          if (layerModule[id] === input.dataset.mod) applyCategoryFilter(id);
        }
      });
    });
    return el;
  }

  function buildLegend() {
    const div = document.createElement("div");
    div.className = "maplibregl-ctrl legend hud-panel";
    let html = "";

    const hasOfficial = !!CITY_MANIFEST.modules?.official_zoning;
    const officialSourceName = hasOfficial
      ? CITY_MANIFEST.modules.official_zoning.source_name
      : "";

    if (hasOfficial) {
      html += `<div class="source-toggle">
        <div class="source-toggle-header">Source</div>
        <label><input type="radio" name="zoning-source" value="osm" checked> OSM-derived</label>
        <label><input type="radio" name="zoning-source" value="official"> Official (${escHtml(officialSourceName)})</label>
      </div>`;
    }

    if (hasZoning) {
      html += `<h4><span class="master-toggle on" data-module="zoning" title="Toggle Zoning"></span>CS2 Zonificación</h4>`;
      let lastSect = "";
      for (const [key, z] of Object.entries(ZONES)) {
        if (z.sect !== lastSect) {
          html += `<div class="lsect">${z.sect}</div>`;
          lastSect = z.sect;
        }
        html += `<div class="li">
          <div class="ldot" style="background:${z.neon}"></div>
          <span class="lname">${z.label}</span>
          <span class="lcount zero" id="lcount-${key}">0</span>
        </div>`;
      }
    }

    if (hasVial) {
      html += `<h4 style="margin-top:14px"><span class="master-toggle on" data-module="vial" title="Toggle Vial"></span>Red Vial</h4>`;
      let lastSect = "";
      for (const [key, v] of Object.entries(VIAL_TYPES)) {
        if (v.sect !== lastSect) {
          html += `<div class="lsect">${v.sect}</div>`;
          lastSect = v.sect;
        }
        html += `<div class="li">
          <div class="ldot" style="background:${v.neon};width:14px;height:2px;border-radius:1px"></div>
          <span class="lname">${v.label}</span>
          <span class="lcount zero" id="vcount-${key}">0</span>
        </div>`;
      }
    }

    if (hasServices) {
      html += `<h4 style="margin-top:14px"><span class="master-toggle on" data-module="services" title="Toggle Servicios"></span>Servicios</h4>`;
      for (const [key, sv] of Object.entries(SERVICES_TYPES)) {
        html += `<div class="li">
          <div class="ldot" style="background:${sv.color};color:white;font-size:8px;font-weight:700;text-align:center;line-height:10px;border-radius:50%">${sv.char}</div>
          <span class="lname">${sv.label}</span>
          <span class="lcount zero" id="scount-${key}">0</span>
        </div>`;
      }
    }

    if (CITY_MANIFEST.modules?.transporte) {
      html += `<h4 style="margin-top:14px"><span class="master-toggle on" data-module="transporte" title="Toggle Transporte"></span>Transporte</h4>`;
      for (const [key, style] of Object.entries(TRANSPORT_STYLE)) {
        html += `<div class="li">
          <div class="ldot" style="background:${style.color};width:14px;height:2px;border-radius:1px"></div>
          <span class="lname">${escHtml(TRANSPORT_LABELS[key])}</span>
          <span class="lcount zero" id="tcount-${key}">0</span>
        </div>`;
      }
    }

    if (CITY_MANIFEST.modules?.infraestructura) {
      html += `<h4 style="margin-top:14px"><span class="master-toggle on" data-module="infraestructura" title="Toggle Infraestructura"></span>Infraestructura</h4>`;
      for (const [key, style] of Object.entries(INFRA_STYLE)) {
        html += `<div class="li">
          <div class="ldot" style="background:${style.color}"></div>
          <span class="lname">${escHtml(INFRA_LABELS[key])}</span>
          <span class="lcount zero" id="icount-${key}">0</span>
        </div>`;
      }
    }

    // ── Encoding de incertidumbre ───────────────────────────────────────────
    // Solo aparece si hay zoning, porque solo zoning + external_buildings
    // producen polígonos con `method`. Vial / services no.
    if (hasZoning) {
      html += `<h4 class="compliance" style="margin-top:14px">Confiabilidad de clasificación</h4>`;
      html += `<div class="li" title="Polígono con tag OSM específico (building=house, building=apartments, etc.) — máxima confianza">
        <div class="ldot" style="background:#7c9cd9;opacity:0.9"></div>
        <span class="lname">OSM tag-classified</span>
      </div>`;
      html += `<div class="li" title="Polígono sin tipo cuya zona se infirió por landuse OSM que lo contiene — alta confianza">
        <div class="ldot" style="background:#78c47b;opacity:0.9"></div>
        <span class="lname">Inferred (landuse)</span>
      </div>`;
      html += `<div class="li" title="Polígono sin tipo ni landuse contenedor: zona inferida por footprint area — baja confianza, render etéreo">
        <div class="ldot" style="background:#d4a96d;opacity:0.55;border:1px dashed #d4a96d"></div>
        <span class="lname">Inferred (area heur)</span>
      </div>`;
    }

    div.innerHTML = html;
    return div;
  }

  map.addControl(new ElementControl(buildLayersControl()), "bottom-right");
  map.addControl(new ElementControl(buildLegend()), "bottom-left");

  function updateLegendCounts() {
    const fill = (prefix, counts) => {
      for (const [key, count] of Object.entries(counts)) {
        const el = document.getElementById(prefix + key);
        if (!el) continue;
        el.textContent = count.toLocaleString();
        el.classList.toggle("zero", count === 0);
      }
    };
    fill("lcount-", zoneCounts);
    fill("vcount-", vialCounts);
    fill("scount-", serviceCounts);
    fill("tcount-", transportCounts);
    fill("icount-", infraCounts);
  }

  // ══════════════════════════════════════════════════════════════════════════
  // POPUPS — click → la feature de más arriba que tenga popup
  // ══════════════════════════════════════════════════════════════════════════
  // Las líneas finas se buscan en un cuadrado de ±4 px (clickear una calle de
  // 0.8 px exacta es imposible); las áreas, en el punto mismo.
  const LINE_LAYERS = ["vial-line", "transporte-line", "infra-line", "services-points", "infra-points"];
  const AREA_LAYERS = ["zoning-fill", "official-fill", "services-fill", "infra-fill"];

  function popupFor(f) {
    const p = f.properties;
    switch (f.layer.id) {
      case "zoning-fill":     return zoningPopupHtml(p);
      case "official-fill":   return officialPopupHtml(p);
      case "vial-line":       return vialPopupHtml(p);
      case "services-fill":   return servicePopupHtml(serviceIndex.poly[p.k]?.[p.i], p.k);
      case "services-points": return servicePopupHtml(serviceIndex.point[p.k]?.[p.i], p.k);
      case "transporte-line": return transportPopupHtml(window[`DATA_TRANSPORT_${String(p.k).toUpperCase()}`]?.[p.i], p.k);
      case "infra-fill":
      case "infra-line":
      case "infra-points":    return infraPopupHtml(window[`DATA_INFRA_${String(p.k).toUpperCase()}`]?.[p.i], p.k);
      default:                return null;
    }
  }

  function hitsAt(point) {
    const present = ids => ids.filter(id => map.getLayer(id));
    const box = [[point.x - 4, point.y - 4], [point.x + 4, point.y + 4]];
    const hits = [
      ...map.queryRenderedFeatures(box, { layers: present(LINE_LAYERS) }),
      ...map.queryRenderedFeatures(point, { layers: present(AREA_LAYERS) }),
    ];
    // De arriba hacia abajo según el orden de dibujo
    return hits.sort((a, b) => LAYER_ORDER.indexOf(b.layer.id) - LAYER_ORDER.indexOf(a.layer.id));
  }

  // Un Popup nuevo por click: si se reusara el mismo, su "cerrar al hacer click"
  // (registrado cuando se abrió el anterior) lo cerraría en este mismo click
  let popup = null;
  map.on("click", ev => {
    for (const f of hitsAt(ev.point)) {
      const html = popupFor(f);
      if (html) {
        if (popup) popup.remove();
        popup = new maplibregl.Popup({ maxWidth: "280px", className: "cs2-popup" })
          .setLngLat(ev.lngLat).setHTML(html).addTo(map);
        return;
      }
    }
  });

  // Cursor de mano sobre lo que tiene popup (una consulta por frame, como mucho)
  let hoverPending = null;
  map.on("mousemove", ev => {
    if (hoverPending) { hoverPending = ev.point; return; }
    hoverPending = ev.point;
    requestAnimationFrame(() => {
      const pt = hoverPending;
      hoverPending = null;
      const clickable = hitsAt(pt).some(f => popupFor(f));
      map.getCanvas().style.cursor = clickable ? "pointer" : "";
    });
  });

  // ══════════════════════════════════════════════════════════════════════════
  // MÓDULOS SECUNDARIOS — hooks llamados por bootstrap cuando cargan
  // ══════════════════════════════════════════════════════════════════════════
  window.officialZoningLoaded = async function () {
    await mapReady;
    const features = [];
    for (const zKey of Object.keys(ZONES)) {
      const data = window[`DATA_OFFICIAL_${zKey.toUpperCase()}`];
      if (!Array.isArray(data)) continue;
      data.forEach((item, i) => {
        if (!item.coords || item.coords.length < 3) return;
        features.push({ type: "Feature", properties: { k: zKey, i }, geometry: polygonGeometry(item.coords) });
      });
    }
    map.addSource("cs2-official", { type: "geojson", data: { type: "FeatureCollection", features } });
    addLayerOrdered({
      id: "official-fill", type: "fill", source: "cs2-official",
      layout: { visibility: "none" },
      paint: { "fill-color": zoneColor, "fill-opacity": 0.55 },
    }, "zoning");
    addLayerOrdered({
      id: "official-line", type: "line", source: "cs2-official",
      layout: { visibility: "none" },
      paint: { "line-color": zoneNeon, "line-width": 0.7, "line-opacity": 0.9 },
    }, "zoning");
    applyModuleState("zoning");
    window._cs2OfficialZoningCount = features.length;
    console.log(`[official_zoning] Loaded ${features.length} polygons (hidden until selected).`);
  };

  window.transporteLoaded = async function () {
    await mapReady;
    const features = [];
    for (const cat of Object.keys(TRANSPORT_STYLE)) {
      const data = window[`DATA_TRANSPORT_${cat.toUpperCase()}`];
      if (!Array.isArray(data)) continue;
      data.forEach((route, i) => {
        if (!route.coords || route.coords.length < 2) return;
        features.push({ type: "Feature", properties: { k: cat, i }, geometry: lineGeometry(route.coords) });
        transportCounts[cat]++;
      });
    }
    const byCat = prop => ["match", ["get", "k"],
      ...Object.entries(TRANSPORT_STYLE).flatMap(([k, st]) => [k, st[prop]]), TRANSPORT_STYLE.bus[prop]];
    map.addSource("cs2-transporte", { type: "geojson", data: { type: "FeatureCollection", features } });
    addLayerOrdered({
      id: "transporte-line", type: "line", source: "cs2-transporte",
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": byCat("color"), "line-width": byCat("weight"), "line-opacity": byCat("opacity") },
    });
    window._cs2TransporteCount = features.length;
    console.log(`[transporte] Loaded ${features.length} routes.`);

    MODULES.transporte.enabled = true;
    moduleStates.transporte = "on";
    unlockPill("transporte");
    applyModuleState("transporte");
    updateLegendCounts();
    syncUI();
  };

  window.infraestructuraLoaded = async function () {
    await mapReady;
    const features = [];
    for (const cat of Object.keys(INFRA_STYLE)) {
      const data = window[`DATA_INFRA_${cat.toUpperCase()}`];
      if (!Array.isArray(data)) continue;
      data.forEach((f, i) => {
        if (!f.coords) return;
        let geometry;
        if (f.kind === "point") geometry = { type: "Point", coordinates: lngLat(f.coords) };
        else if (f.kind === "polygon") geometry = f.coords.length >= 3 ? polygonGeometry(f.coords) : null;
        else geometry = f.coords.length >= 2 ? lineGeometry(f.coords) : null;
        if (!geometry) return;
        features.push({ type: "Feature", properties: { k: cat, i }, geometry });
        infraCounts[cat]++;
      });
    }
    const color = ["match", ["get", "k"],
      ...Object.entries(INFRA_STYLE).flatMap(([k, st]) => [k, st.color]), "#999999"];
    const isType = t => ["==", ["geometry-type"], t];
    map.addSource("cs2-infra", { type: "geojson", data: { type: "FeatureCollection", features } });
    addLayerOrdered({
      id: "infra-fill", type: "fill", source: "cs2-infra", filter: isType("Polygon"),
      paint: { "fill-color": color, "fill-opacity": 0.25 },
    });
    addLayerOrdered({
      id: "infra-line", type: "line", source: "cs2-infra", filter: ["!", isType("Point")],
      paint: { "line-color": color, "line-width": 2, "line-opacity": 0.85 },
    });
    addLayerOrdered({
      id: "infra-points", type: "circle", source: "cs2-infra", filter: isType("Point"),
      paint: {
        "circle-radius": 4, "circle-color": color, "circle-opacity": 0.9,
        "circle-stroke-color": color, "circle-stroke-width": 2, "circle-stroke-opacity": 0.85,
      },
    });
    window._cs2InfraCount = features.length;
    console.log(`[infraestructura] Loaded ${features.length} features.`);

    MODULES.infraestructura.enabled = true;
    moduleStates.infraestructura = "on";
    unlockPill("infraestructura");
    applyModuleState("infraestructura");
    updateLegendCounts();
    syncUI();
  };

  // ══════════════════════════════════════════════════════════════════════════
  // MAIN LOADER
  // ══════════════════════════════════════════════════════════════════════════
  async function loadAll() {
    await mapReady;

    if (hasZoning) {
      setP("zoning", "loading", tileMode ? "⟳ Teselas…" : "⟳ Render…");
      if (tileMode) {
        Object.assign(zoneCounts, TILESET.counts.zoning || {});
      }
      const src = tileMode ? { source: "cs2", "source-layer": "zoning" } : { source: "cs2-zoning" };
      if (tileMode && !map.getSource("cs2")) addTileSource();
      if (!tileMode) map.addSource("cs2-zoning", { type: "geojson", data: zoningGeoJSON(), attribution: OSM_ATTR });
      for (const layer of zoningLayers(src, "zoning")) addLayerOrdered(layer, "zoning");
    }

    if (hasVial) {
      setP("vial", "loading", tileMode ? "⟳ Teselas…" : "⟳ Render…");
      if (tileMode) {
        Object.assign(vialCounts, TILESET.counts.vial || {});
        if (!map.getSource("cs2")) addTileSource();
      } else {
        map.addSource("cs2-vial", { type: "geojson", data: vialGeoJSON(), attribution: OSM_ATTR });
      }
      const byKey = prop => ["match", ["get", "k"],
        ...Object.entries(VIAL_TYPES).flatMap(([k, v]) => [k, v[prop]]), VIAL_TYPES.local[prop]];
      addLayerOrdered({
        id: "vial-line", type: "line",
        ...(tileMode ? { source: "cs2", "source-layer": "vial" } : { source: "cs2-vial" }),
        filter: withGate(null),
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": byKey("neon"),
          // bridge → +0.5 px para diferenciar visualmente puentes
          "line-width": ["+", byKey("weight"), ["case", ["to-boolean", ["get", "b"]], 0.5, 0]],
          "line-opacity": 0.85,
        },
      }, "vial");
    }

    if (hasServices) {
      setP("services", "loading", "⟳ Render…");
      const [polys, points] = servicesGeoJSON();
      const color = ["match", ["get", "k"],
        ...Object.entries(SERVICES_TYPES).flatMap(([k, t]) => [k, t.color]), "#999999"];
      map.addSource("cs2-services-poly", { type: "geojson", data: polys });
      map.addSource("cs2-services-pt", { type: "geojson", data: points });
      for (const [key, type] of Object.entries(SERVICES_TYPES)) {
        const { image, pixelRatio } = serviceIconImage(type);
        map.addImage(`svc-${key}`, image, { pixelRatio });
      }
      addLayerOrdered({
        id: "services-fill", type: "fill", source: "cs2-services-poly",
        paint: { "fill-color": color, "fill-opacity": 0.35 },
      }, "services");
      addLayerOrdered({
        id: "services-line", type: "line", source: "cs2-services-poly",
        paint: { "line-color": color, "line-width": 1.5, "line-opacity": 0.9 },
      }, "services");
      addLayerOrdered({
        id: "services-points", type: "symbol", source: "cs2-services-pt",
        minzoom: SERVICES_POINT_MINZOOM,
        layout: {
          "icon-image": ["concat", "svc-", ["get", "k"]],
          "icon-allow-overlap": true,
          "icon-ignore-placement": true,
        },
      }, "services");
    }

    wireUpModuleControls();
    applyAllStates();
    syncUI();
    updateLegendCounts();

    // La pantalla de carga se va cuando NUESTROS datos del primer encuadre están
    // cargados y dibujados (el fondo de Esri puede tardar o fallar: no se espera)
    await waitForSources(["cs2", "cs2-zoning", "cs2-vial", "cs2-services-poly", "cs2-services-pt"]);
    if (hasZoning)   setP("zoning", "done", `✓ ${sum(zoneCounts).toLocaleString()}`);
    if (hasVial)     setP("vial", "done", `✓ ${sum(vialCounts).toLocaleString()}`);
    if (hasServices) setP("services", "done", `✓ ${sum(serviceCounts).toLocaleString()}`);
    bump(sum(zoneCounts) + sum(vialCounts) + sum(serviceCounts));
    finalizeLoad();
  }

  function waitForSources(ids, timeoutMs = 15000) {
    const present = ids.filter(id => map.getSource(id));
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        map.off("sourcedata", check);
        // Un frame más para que lo cargado llegue a la pantalla
        map.once("render", resolve);
        map.triggerRepaint();
      };
      const check = () => {
        if (present.every(id => map.isSourceLoaded(id))) finish();
      };
      const timer = setTimeout(finish, timeoutMs);   // por si una tesela no llega nunca
      map.on("sourcedata", check);
      check();
    });
  }

  function addTileSource() {
    map.addSource("cs2", {
      type: "vector",
      tiles: ["cs2tiles://{z}/{x}/{y}"],
      minzoom: TILESET.minzoom,
      maxzoom: TILESET.maxzoom,
      bounds: TILESET.bounds,
      attribution: OSM_ATTR,
    });
  }

  function finalizeLoad() {
    // Llenar la barra hasta el final antes del fade-out
    if (progressFill) progressFill.style.width = "100%";

    const overlay = document.getElementById("loading");
    overlay.style.transition = "opacity 0.5s";
    setTimeout(() => { overlay.style.opacity = "0"; }, 200);
    setTimeout(() => { overlay.style.display = "none"; }, 730);

    const sb = document.getElementById("statusbar");
    sb.innerHTML =
      `<b>${total.toLocaleString()}</b> polígonos` +
      `<span class="sep">·</span>${escHtml(CITY_META.display_name)}` +
      `<span class="sep">·</span>datos OSM`;
    sb.style.display = "block";
  }

  // ══════════════════════════════════════════════════════════════════════════
  // GO
  // ══════════════════════════════════════════════════════════════════════════
  loadAll().catch(e => {
    console.error("[render] error:", e);
    for (const key of Object.keys(pitems)) setP(key, "error", "✗ Error");
  });
}

// Lanzar todo
bootstrap();
</script>
