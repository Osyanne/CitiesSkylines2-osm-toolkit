<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS2 OSM Toolkit — Loading…</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ══ DESIGN TOKENS — CS2 in-game UI (faithful) ════════════════════════════ */
    :root {
      /* Surfaces — paneles más matte, gradient top→bottom sutil */
      --bg-void:        #0a1220;
      --bg-deep:        #0e1828;
      --bg-panel-top:   rgba(28, 42, 64, 0.95);
      --bg-panel-bot:   rgba(16, 26, 42, 0.97);
      --bg-panel:       rgba(20, 32, 50, 0.94);
      --bg-panel-solid: rgba(18, 28, 44, 0.98);
      --bg-elev:        rgba(255, 255, 255, 0.05);
      --bg-elev-hover:  rgba(255, 255, 255, 0.10);
      --bg-tile:        rgba(35, 52, 78, 0.85);
      --bg-tile-hover:  rgba(50, 72, 105, 0.90);

      /* Borders */
      --border-hair:    rgba(255, 255, 255, 0.06);
      --border-soft:    rgba(255, 255, 255, 0.10);
      --border-strong:  rgba(255, 255, 255, 0.18);

      /* Text */
      --text-strong:    #ffffff;
      --text-base:      #e2e8f0;
      --text-muted:     #a3b1c2;
      --text-dim:       #6b7a8f;
      --text-faint:     #4a5568;

      /* CS2 accent — azul medio del juego (no cyan brillante) */
      --accent:         #4a90e2;
      --accent-bright:  #7ab3f0;
      --accent-deep:    #2f6cb8;
      --accent-soft:    rgba(74, 144, 226, 0.22);
      --accent-glow:    rgba(74, 144, 226, 0.40);
      --accent-on:      #ffffff;

      /* Category colors — paleta de servicios CS2 */
      --cat-zoning:     #5dbe6e;   /* verde residencial */
      --cat-vial:       #f5c842;   /* amarillo tráfico */
      --cat-services:   #5bbdd0;   /* cyan-azulado servicios */
      --cat-transport:  #e89944;   /* naranja transporte */
      --cat-infra:        #f1c40f;   /* amarillo infraestructura */

      /* Status */
      --warn:           #f5c842;
      --ok:             #5dbe6e;
      --err:            #e55b5b;

      /* Layers (z-index) */
      --z-map:          1;
      --z-overlay:      400;
      --z-hud:          600;
      --z-loading:      10000;

      /* Motion */
      --t-fast:         120ms;
      --t-base:         180ms;
      --t-slow:         300ms;
      --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);

      /* Typography — Inter weight medio, sin Orbitron en HUD */
      --font-ui:        'Inter', system-ui, sans-serif;
      --font-display:   'Inter', system-ui, sans-serif;
      --font-mono:      'JetBrains Mono', ui-monospace, monospace;

      /* Shape — CS2 usa border-radius medio (10-12px) */
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;

      /* Elevation — panel sólido con shadow + subtle inner */
      --shadow-panel:   0 6px 24px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.5);
      --inner-top:      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg-void);
      font-family: var(--font-ui);
      font-feature-settings: "cv11", "ss01";
      color: var(--text-base);
      -webkit-font-smoothing: antialiased;
    }
    /* dvh: en el celular, 100vh incluye lo que tapa la barra del navegador */
    #map { height: 100vh; height: 100dvh; }

    /* ══ LOADING OVERLAY — landing-page identity ══════════════════════════════ */
    /* Local palette overrides — hereda 1:1 del landing (assets/landing.css)    */
    #loading {
      --ld-bg:           #0e0e10;
      --ld-text:         #fafafa;
      --ld-text-muted:   #a0a0a8;
      --ld-text-dim:     #71717a;
      --ld-accent:       #5e6ad2;
      --ld-accent-soft:  #c4b5fd;
      --ld-accent-2:     #8b5cf6;
      --ld-border:       rgba(255, 255, 255, 0.06);
      --ld-border-soft:  rgba(255, 255, 255, 0.10);
      --ld-warn:         #f59e0b;
      --ld-err:          #ef4444;

      position: fixed; inset: 0; z-index: var(--z-loading);
      background: var(--ld-bg);
      color: var(--ld-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Radial purple glow — centrado sobre el contenido */
    #loading::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(1400px, 110vw);
      height: min(1000px, 100vh);
      background: radial-gradient(ellipse at center, rgba(94, 106, 210, 0.22) 0%, rgba(94, 106, 210, 0.06) 35%, transparent 65%);
      pointer-events: none;
    }

    .loading-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center;
      width: 100%; max-width: 640px;
      padding: 0 2rem;
      text-align: center;
    }

    /* Brand block — replica del nav.top .brand */
    .loading-brand {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-weight: 600; font-size: 0.95rem;
      margin-bottom: 2.8rem;
      color: var(--ld-text);
    }
    .loading-brand-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--ld-accent), var(--ld-accent-2));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(94, 106, 210, 0.35);
    }
    .loading-brand-logo svg { width: 16px; height: 16px; color: #fff; }
    .loading-brand-ver {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--ld-text-dim);
      padding: 0.15rem 0.45rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-left: 0.2rem;
    }

    /* Badge "Loading [city]" — replica de .hero .badge */
    .loading-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.95rem;
      background: rgba(94, 106, 210, 0.10);
      border: 1px solid rgba(94, 106, 210, 0.30);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--ld-accent-soft);
      margin-bottom: 1.6rem;
    }
    .loading-badge .bdot {
      width: 6px; height: 6px;
      background: var(--ld-accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--ld-accent);
      animation: ldPulse 2s ease-in-out infinite;
    }
    @keyframes ldPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Hero title — replica de .hero h1 */
    #loading .logo {
      font-family: 'Inter', sans-serif;
      font-size: clamp(2.1rem, 4.5vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ld-text);
      margin-bottom: 0.6rem;
      text-shadow: none;
      text-transform: none;
    }
    #loading .logo .city-grad {
      background: linear-gradient(135deg, var(--ld-accent) 0%, var(--ld-accent-soft) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Lede — replica de .hero .lede */
    #loading .sub {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--ld-text-muted);
      max-width: 480px;
      margin-bottom: 2.4rem;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.5;
    }
    #loading .sub::before { content: none; }

    /* Module pills — replica de .filter-pills */
    #pgrid {
      display: flex;
      flex-wrap: wrap; justify-content: center;
      gap: 0.4rem;
      margin-bottom: 2.4rem;
    }
    .pi {
      display: inline-flex; align-items: center; gap: 0.55rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0.42rem 0.95rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ld-text-muted);
      letter-spacing: 0;
      text-transform: none;
      transition: background .2s, border-color .2s, color .2s;
    }
    .pi::before {
      content: ""; width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ld-text-dim);
      flex-shrink: 0;
      transition: background .2s, box-shadow .2s;
    }
    .pi.loading {
      color: var(--ld-text);
      border-color: rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.06);
    }
    .pi.loading::before {
      background: var(--ld-warn);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.55);
      animation: ldDot 1.4s ease-in-out infinite;
    }
    .pi.done {
      color: var(--ld-text);
      border-color: rgba(94, 106, 210, 0.40);
      background: rgba(94, 106, 210, 0.10);
    }
    .pi.done::before {
      background: var(--ld-accent);
      box-shadow: 0 0 8px rgba(94, 106, 210, 0.6);
    }
    .pi.error {
      color: var(--ld-text);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.07);
    }
    .pi.error::before { background: var(--ld-err); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
    @keyframes ldDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .pbadge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ld-text-dim);
      font-variant-numeric: tabular-nums;
      margin-left: 0.15rem;
    }
    .pi.loading .pbadge { background: rgba(245, 158, 11, 0.18); color: var(--ld-warn); }
    .pi.done    .pbadge { background: rgba(94, 106, 210, 0.20); color: var(--ld-accent-soft); }
    .pi.error   .pbadge { background: rgba(239, 68, 68, 0.18);  color: var(--ld-err); }

    /* Progress bar — fina, simple, sin scan */
    .loading-progress {
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column;
      align-items: center; gap: 1rem;
    }
    .loading-progress-bar {
      position: relative;
      width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-progress-bar::before,
    .loading-progress-bar::after { content: none; }
    .loading-progress-fill {
      position: absolute; inset: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--ld-accent) 0%, var(--ld-accent-soft) 100%);
      box-shadow: 0 0 12px rgba(94, 106, 210, 0.5);
      transition: width 500ms cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 999px;
    }
    .loading-progress-scan {
      position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(196, 181, 253, 0.35), transparent);
      animation: ldShimmer 1.8s ease-in-out infinite;
    }
    @keyframes ldShimmer {
      0%   { left: -40%; }
      100% { left: 100%; }
    }

    #totbar {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: var(--ld-text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex; align-items: baseline; gap: 0.7rem;
    }
    #totbar b {
      font-family: 'JetBrains Mono', monospace;
      color: var(--ld-text);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      text-shadow: none;
    }
    #errmsg {
      margin-top: 1.2rem; font-size: 0.85rem; color: var(--ld-text-dim);
      max-width: 520px; text-align: center; line-height: 1.5; display: none;
    }

    @media (max-width: 640px) {
      .loading-brand { margin-bottom: 2rem; }
      #loading .logo { font-size: 1.7rem; }
      #loading .sub  { font-size: 0.9rem; margin-bottom: 1.8rem; }
      #pgrid { margin-bottom: 1.8rem; }
    }

    /* ══ HUD PANEL — gradient sólido CS2 (no glass pesado) ═══════════════════ */
    .hud-panel {
      background: linear-gradient(180deg, var(--bg-panel-top) 0%, var(--bg-panel-bot) 100%);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: var(--shadow-panel), var(--inner-top);
    }

    /* ══ CITY PILL (top-left) — estilo MEGALÓPOLIS de CS2 ════════════════════ */
    /* Arriba a la izquierda del área del mapa, a la derecha del zoom: con la
       columna de capas abierta se corre lo que mide la columna */
    #title-header {
      position: fixed;
      top: 14px; left: 60px;
      z-index: var(--z-hud);
      display: flex; align-items: center; gap: 8px;
      max-width: calc(100vw - 74px);
    }
    body.col-open #title-header {
      left: calc(var(--col-w) + 60px);
      max-width: calc(100vw - var(--col-w) - 74px);
    }
    #title-ctrl {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 14px 8px 11px;
      font-family: var(--font-ui);
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text-strong);
      pointer-events: auto;
      min-width: 0;
      border-color: rgba(122, 142, 200, 0.35) !important;
      transition: border-color var(--t-base) var(--ease-out);
    }
    #title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #title-ctrl::before {
      content: ""; width: 5px; height: 5px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      border-radius: 50%;
      flex-shrink: 0;
    }
    #title-ctrl .title-icon {
      width: 15px; height: 15px;
      color: var(--accent-bright);
      flex-shrink: 0;
    }
    #title-ctrl .nick {
      font-size: 0.8em;
      font-weight: 400;
      opacity: 0.65;
    }
    #star-link {
      display: inline-flex; align-items: center; gap: 5px;
      flex-shrink: 0;
      padding: 8px 10px;
      font-family: var(--font-ui);
      font-size: 12px; font-weight: 600;
      color: var(--accent-bright);
      border-color: rgba(74, 144, 226, 0.45);
      text-decoration: none;
      white-space: nowrap;
      transition: color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
    }
    #star-link:hover { color: var(--text-strong); border-color: var(--accent); }
    #share-view {
      display: inline-flex; align-items: center; gap: 6px;
      flex-shrink: 0; padding: 8px 10px;
      font: 600 12px var(--font-ui); color: var(--accent-bright);
      cursor: pointer;
    }
    #share-view:hover { color: var(--text-strong); border-color: var(--accent); }
    #share-view svg { width: 16px; height: 16px; }
    #share-status, #share-panel {
      position: absolute; top: calc(100% + 8px); right: 0;
      padding: 12px; font-size: 12px;
    }
    #share-panel {
      left: 0; right: auto;
      width: min(440px, calc(100vw - 74px));
      display: flex; align-items: center; gap: 8px;
    }
    body.col-open #share-panel { width: min(440px, calc(100vw - var(--col-w) - 74px)); }
    #share-panel input {
      flex: 1; min-width: 0; padding: 10px;
      background: var(--bg-deep); color: var(--text-base);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font: 12px var(--font-mono);
    }
    #share-panel .icon-btn { flex-shrink: 0; width: 44px; height: 44px; }
    #share-status[hidden], #share-panel[hidden] { display: none; }
    /* Buscar queda debajo de la cabecera, sin agrandar su fila. */
    #search-open {
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 36px; height: 36px; padding: 0;
      color: var(--text-base); cursor: pointer;
    }
    #search-open svg, #search-submit svg { width: 18px; height: 18px; }
    #search-open:hover { color: var(--text-strong); border-color: var(--accent); }
    #search-panel {
      position: absolute; top: calc(100% + 8px); left: 0;
      width: min(360px, calc(100vw - 74px)); padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
      overflow-y: auto; overscroll-behavior: contain; font-size: 12px;
    }
    body.col-open #search-panel { width: min(360px, calc(100vw - var(--col-w) - 74px)); }
    #search-open[hidden], #search-panel[hidden], #search-results[hidden] { display: none; }
    #search-panel form { display: flex; gap: 6px; flex-shrink: 0; }
    #search-input {
      flex: 1; min-width: 0; width: 0; padding: 8px;
      background: var(--bg-deep); color: var(--text-base);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font: 16px var(--font-ui);
    }
    #search-panel button {
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; width: 36px; min-height: 36px; padding: 0;
      border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
      background: var(--bg-deep); color: var(--text-base); cursor: pointer;
    }
    #search-results {
      list-style: none; margin: 0; padding: 0; min-height: 0;
      max-height: 320px; overflow-y: auto; overscroll-behavior: contain;
    }
    #search-results li { padding: 10px 8px; cursor: pointer; overflow-wrap: anywhere; }
    #search-results li:hover, #search-results li[aria-selected="true"] { background: var(--accent-soft); }
    #search-results strong, #search-results small { display: block; }
    #search-results small { margin-top: 3px; color: var(--text-muted); }
    #search-status, #search-attribution { margin: 0; flex-shrink: 0; overflow-wrap: anywhere; }
    #search-status:empty { display: none; }
    #search-attribution { color: var(--text-muted); font-size: 11px; }
    #search-attribution a { color: var(--accent-bright); }
    .search-pin {
      width: 18px; height: 18px; border-radius: 50%; border: 3px solid white;
      background: #4cc9f0; box-shadow: 0 2px 6px #0008; pointer-events: none;
    }
    /* Volver a la lista de ciudades */
    #cities-link {
      display: inline-flex; align-items: center; gap: 6px;
      flex-shrink: 0;
      padding: 8px 12px 8px 9px;
      font-family: var(--font-ui);
      font-size: 12px; font-weight: 600;
      color: var(--text-base);
      text-decoration: none;
      white-space: nowrap;
      transition: color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
    }
    #cities-link svg { width: 14px; height: 14px; }
    #cities-link:hover { color: var(--text-strong); border-color: var(--accent); }
    #star-count:empty { display: none; }

    /* El canvas de Esri es gris medio; se oscurece para el fondo casi negro de CS2 */
    .basemap-dark {
      filter: brightness(0.45) saturate(0.75);
    }
    /* ══ COLUMNA DE CAPAS ═════════════════════════════════════════════════════ */
    /* Leyenda, filtros y mapa base en un solo lugar. En escritorio va acoplada a
       la izquierda y el mapa se achica a su lado (no queda tapado); en el
       celular es una bandeja abajo (ver el bloque responsive). */
    :root {
      --col-w:     300px;
      --tray-head: 52px;
    }
    #layers-col {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      width: var(--col-w);
      z-index: var(--z-hud);
      display: none;
      flex-direction: column;
      background: var(--bg-panel-solid);
      border-right: 1px solid var(--border-soft);
      box-shadow: 4px 0 18px rgba(0, 0, 0, 0.35);
      color: var(--text-base);
      font-size: 12px;
      /* Checkboxes y barras de scroll nativas en oscuro */
      color-scheme: dark;
    }
    body.col-open #layers-col { display: flex; }
    body.col-open #map { margin-left: var(--col-w); }

    .col-head {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      height: 48px;
      padding: 0 8px 0 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .col-title, .foot-label, .group-head, .conf-title {
      font-family: var(--font-ui);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .col-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px;
      letter-spacing: 1.2px;
      color: var(--text-muted);
    }
    .col-title svg, #layers-open svg, .col-tray-toggle svg { width: 15px; height: 15px; flex-shrink: 0; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: none;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
    }
    .icon-btn:hover { color: var(--text-strong); background: var(--bg-elev-hover); border-color: var(--border-soft); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* Cabecera de la bandeja del celular (en escritorio no se ve) */
    .col-tray-toggle {
      position: relative;
      display: none;
      align-items: center; gap: 10px;
      flex-shrink: 0;
      width: 100%; height: var(--tray-head);
      padding: 6px 16px 0;
      background: none;
      border: 0;
      color: var(--text-strong);
      font-family: var(--font-ui);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    /* Asa: avisa que la bandeja se despliega */
    .col-tray-toggle::before {
      content: "";
      position: absolute;
      top: 6px; left: 50%;
      width: 36px; height: 4px;
      margin-left: -18px;
      border-radius: 2px;
      background: var(--border-strong);
    }
    .tray-summary {
      flex: 1; min-width: 0;
      text-align: left;
      font-size: 12px; font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .col-tray-toggle .chev { transform: rotate(180deg); }
    #layers-col.tray-open .col-tray-toggle { border-bottom: 1px solid var(--border-soft); }
    #layers-col.tray-open .col-tray-toggle .chev { transform: none; }

    .col-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
      /* Sombras de scroll: con Zoning desplegado los otros módulos suelen quedar
         abajo del borde, y la sombra avisa que hay más. Las tapas (local) se
         mueven con el contenido y la tapan al llegar a cada punta. */
      background:
        linear-gradient(var(--bg-panel-solid) 30%, transparent) center top,
        linear-gradient(transparent, var(--bg-panel-solid) 70%) center bottom,
        radial-gradient(farthest-side at 50% 0, rgba(0, 0, 0, 0.55), transparent) center top,
        radial-gradient(farthest-side at 50% 100%, rgba(0, 0, 0, 0.55), transparent) center bottom;
      background-repeat: no-repeat;
      background-size: 100% 36px, 100% 36px, 100% 14px, 100% 14px;
      background-attachment: local, local, scroll, scroll;
    }
    .col-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      flex-shrink: 0;
      padding: 10px 12px 10px 16px;
      border-top: 1px solid var(--border-soft);
      background: rgba(0, 0, 0, 0.18);
    }

    /* Botón para abrir la columna: primero en #title-header, con la columna cerrada */
    #layers-open {
      display: inline-flex; align-items: center; gap: 7px;
      flex-shrink: 0;
      padding: 8px 12px 8px 10px;
      font-family: var(--font-ui);
      font-size: 12px; font-weight: 600;
      color: var(--text-base);
      cursor: pointer;
      transition: color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
    }
    #layers-open:hover { color: var(--text-strong); border-color: var(--accent); }
    body.col-open #layers-open { display: none; }

    /* ── Bloque de un módulo ── */
    .mod { --cat: var(--accent); border-bottom: 1px solid var(--border-hair); }
    /* Cabeceras fijas: los módulos plegados que vienen después del último
       abierto se pegan al pie de la columna, apilados. Con la lista de zonas
       desplegada, Roads, Services… y su On/Dim/Off se ven sin scrollear aunque
       la ventana sea baja (1280×720). layoutDock() calcula --dock-bottom. La
       línea y la sombra van con box-shadow para no cambiar el alto del bloque. */
    .mod.docked {
      position: sticky;
      bottom: var(--dock-bottom, 0px);
      z-index: 2;
      background: var(--bg-panel-solid);
    }
    .mod.docked.dock-first {
      box-shadow: inset 0 1px 0 var(--border-soft), 0 -8px 12px -6px rgba(0, 0, 0, 0.45);
    }
    .mod-head {
      display: flex; align-items: center; gap: 6px;
      min-height: 46px;
      padding: 6px 12px 6px 6px;
    }
    .mod-toggle {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 7px;
      padding: 6px;
      background: none;
      border: 0;
      border-radius: var(--radius-sm);
      color: var(--text-strong);
      font-family: var(--font-ui);
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.2px;
      text-align: left;
      cursor: pointer;
    }
    .mod-toggle:hover:not(:disabled) { background: var(--bg-elev); }
    .mod-toggle:disabled { cursor: default; }
    .chev {
      width: 14px; height: 14px;
      flex-shrink: 0;
      color: var(--text-dim);
      transition: transform var(--t-base) var(--ease-out);
    }
    .mod-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
    /* Módulo que no cargó: no hay nada que desplegar */
    .mod-toggle:disabled .chev { visibility: hidden; }
    .mod-icon {
      width: 18px; height: 18px;
      flex-shrink: 0;
      color: var(--cat);
      transition: color var(--t-fast) var(--ease-out), opacity var(--t-fast) var(--ease-out);
    }
    /* El ícono dice el estado sin tener que mirar el control */
    .mod[data-state="dim"] .mod-icon { opacity: 0.5; }
    .mod[data-state="off"] .mod-icon,
    .mod[data-state="loading"] .mod-icon,
    .mod[data-state="failed"] .mod-icon { color: var(--text-faint); }
    .mod-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Conteos: chicos y en gris, dicen qué mezcla tiene la ciudad sin competir con los nombres */
    .count {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .mod-total { margin-left: 2px; }
    .mod-status {
      flex-shrink: 0;
      max-width: 140px;
      font-size: 11px;
      line-height: 1.3;
      text-align: right;
      color: var(--text-dim);
    }
    .mod[data-state="failed"] .mod-status { color: var(--err); }
    .mod-body { padding: 0 12px 12px 14px; }
    .mod-body[hidden], .mod-status[hidden], .seg[hidden] { display: none; }

    /* Ciudad con un solo módulo: la columna es directamente la lista de zonas */
    .mod.solo { border-bottom: 0; }
    .mod-solo-title {
      display: flex; align-items: baseline; gap: 8px;
      padding: 14px 16px 4px 18px;
      font-family: var(--font-ui);
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text-strong);
    }
    .mod.solo .cat-notice { margin-top: 6px; }

    /* ── Segmentados: On/Dim/Off, fuente de zonas y mapa base ── */
    .seg {
      display: inline-flex;
      flex-shrink: 0;
      gap: 2px;
      padding: 2px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
    }
    .seg button {
      padding: 4px 8px;
      background: none;
      border: 0;
      border-radius: 4px;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out);
    }
    .seg button:hover:not(:disabled) { color: var(--text-strong); background: var(--bg-elev-hover); }
    .seg button[aria-pressed="true"] {
      color: var(--text-strong);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    /* Off elegido no es algo prendido: gris en vez de azul */
    .seg button[data-module-state="off"][aria-pressed="true"] {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px var(--border-strong);
    }
    .seg button:disabled { opacity: 0.4; cursor: not-allowed; }

    .src { margin: 2px 0 6px; }
    .src .seg { display: flex; }
    .src .seg button { flex: 1; }
    .src-name {
      margin-top: 5px;
      padding: 0 2px;
      font-size: 10.5px;
      line-height: 1.35;
      color: var(--text-dim);
    }

    /* ── Aviso de filtro (se ve aunque el bloque esté plegado) ──
       Pegado arriba mientras se recorre su bloque: después de un Only en una
       fila de abajo, Restore sigue a la vista. Fondo opaco: la lista pasa por
       debajo. */
    .cat-notice {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 2px 6px;
      margin: 0 12px 8px 14px;
      padding: 5px 10px;
      background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--bg-panel-solid);
      border: 1px solid rgba(74, 144, 226, 0.35);
      border-radius: var(--radius-sm);
      font-size: 11.5px;
      color: var(--text-base);
    }
    .cat-notice[hidden] { display: none; }
    .link-btn {
      padding: 2px 0;
      background: none;
      border: 0;
      color: var(--accent-bright);
      font-family: var(--font-ui);
      font-size: 11.5px; font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .link-btn:hover { color: var(--text-strong); }

    /* ── Grupos y filas de categoría ── */
    .cat-group[hidden] { display: none; }
    .group-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 28px;
      margin-top: 6px;
      padding: 0 4px;
    }
    /* Checkbox · muestra · nombre | conteo u Only (comparten la última celda) */
    .cat-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 8px;
      min-height: 30px;
      padding: 0 4px;
      border-radius: var(--radius-sm);
    }
    .cat-row:hover { background: var(--bg-elev); }
    .cat-row.is-hover { background: var(--accent-soft); box-shadow: inset 2px 0 var(--accent-bright); }
    .cat-row label {
      display: flex; align-items: center; gap: 8px;
      min-width: 0;
      padding: 5px 0;
      cursor: pointer;
    }
    .cat-check {
      width: 14px; height: 14px;
      margin: 0;
      flex-shrink: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .cat-name { flex: 1; min-width: 0; line-height: 1.3; color: var(--text-base); }
    .cat-row.off .cat-name { color: var(--text-dim); }
    .cat-row.off .sw { opacity: 0.3; }
    .cat-count, .cat-row > .only-btn { grid-row: 1; grid-column: 2; justify-self: end; }
    .sw {
      width: 12px; height: 12px;
      flex-shrink: 0;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15), 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .sw-line { width: 14px; height: 3px; border-radius: 2px; box-shadow: none; }
    .sw-icon { width: 16px; height: 16px; margin: -2px; border-radius: 50%; box-shadow: none; }

    .only-btn {
      padding: 2px 7px;
      background: var(--bg-elev);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      color: var(--accent-bright);
      font-family: var(--font-ui);
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: color var(--t-fast) var(--ease-out), background var(--t-fast) var(--ease-out), opacity var(--t-fast) var(--ease-out);
    }
    .only-btn:hover { color: var(--text-strong); background: var(--accent-soft); border-color: var(--accent); }
    /* El de grupo queda siempre a la vista (así se descubre que existe), pero callado */
    .group-only { background: none; border-color: var(--border-hair); color: var(--text-muted); }
    /* El de fila aparece con el mouse o el foco, en el lugar del conteo. Las
       reglas con :has() van aparte: en un navegador que no lo conoce se cae
       solo esa regla y no también la del hover. */
    .cat-row > .only-btn { opacity: 0; }
    .cat-row:hover > .only-btn,
    .cat-row > .only-btn:focus-visible { opacity: 1; }
    .cat-row:has(:focus-visible) > .only-btn { opacity: 1; }
    .cat-row:hover > .cat-count { opacity: 0; }
    .cat-row:has(:focus-visible) > .cat-count { opacity: 0; }

    /* Categorías que la ciudad no tiene: plegadas al final, sin controles */
    .cat-empty { margin-top: 8px; }
    .cat-empty[hidden] { display: none; }
    .cat-empty summary {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      color: var(--text-dim);
      list-style: none;
      cursor: pointer;
    }
    .cat-empty summary::-webkit-details-marker { display: none; }
    .cat-empty summary:hover { color: var(--text-muted); }
    .cat-empty:not([open]) summary .chev { transform: rotate(-90deg); }
    .cat-empty .cat-check, .cat-empty .cat-count, .cat-empty .only-btn { display: none; }
    .cat-empty .cat-row:hover { background: none; }
    .cat-empty .cat-row label { cursor: default; }
    .cat-empty .cat-name { color: var(--text-dim); }
    .cat-empty .sw { opacity: 0.4; }

    /* Leyenda de confianza: al final del bloque de zonas */
    /* Plegada por defecto: abierta ocupaba ~70 px y en una notebook dejaba las
       cabeceras de Roads, Services… debajo del borde de la columna */
    .conf { margin-top: 10px; padding-top: 4px; border-top: 1px solid var(--border-hair); }
    .conf[hidden] { display: none; }
    .conf-title {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 4px;
      border-radius: var(--radius-sm);
      list-style: none;
      cursor: pointer;
    }
    .conf-title::-webkit-details-marker { display: none; }
    .conf-title:hover { color: var(--text-muted); }
    .conf:not([open]) .conf-title .chev { transform: rotate(-90deg); }
    .conf-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* ══ MAPLIBRE DARK OVERRIDES ══════════════════════════════════════════════ */
    #map { background: var(--bg-void); }
    .maplibregl-ctrl-group {
      background: var(--bg-panel-solid) !important;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md) !important;
      box-shadow: var(--inner-top) !important;
      overflow: hidden;
    }
    .maplibregl-ctrl-group button {
      width: 32px; height: 32px;
      background-color: transparent;
    }
    .maplibregl-ctrl-group button + button { border-top: 1px solid var(--border-soft); }
    .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(0.75); }
    .maplibregl-ctrl-group button:hover { background-color: var(--bg-elev-hover) !important; }
    .maplibregl-ctrl-group button.cs2-fit {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }
    .maplibregl-ctrl-group button.cs2-fit svg { width: 16px; height: 16px; }
    .maplibregl-ctrl-group button.cs2-fit:hover { color: var(--text-strong); }

    /* Escala doble arriba de la atribución; el texto no estira la barra. */
    .maplibregl-ctrl-scale {
      background: rgba(10, 14, 26, 0.7);
      color: var(--text-muted);
      border-color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 10px;
    }
    .maplibregl-ctrl-scale.cs2-scale { border: 0; padding: 4px 6px; width: max-content; }
    .cs2-scale .scale-bar { height: 6px; border: solid var(--text-dim); border-width: 0 2px 2px; }
    .cs2-scale .scale-label { display: block; margin-top: 2px; white-space: nowrap; }

    #hover-tip, #selection {
      background: var(--bg-panel-solid);
      color: var(--text-base);
      border: 1px solid var(--border-soft);
      font-family: var(--font-ui);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    #hover-tip[hidden], #selection[hidden] { display: none; }
    #hover-tip {
      position: fixed; z-index: var(--z-hud); pointer-events: none;
      max-width: min(260px, calc(100vw - 16px)); padding: 9px 12px;
      border-radius: var(--radius-sm); box-shadow: var(--shadow-panel);
    }
    .inspect-title { display: flex; align-items: center; gap: 8px; color: var(--text-strong); font-weight: 600; }
    .inspect-meta { margin-top: 4px; color: var(--text-muted); font-size: 11px; }
    #selection { flex: 0 1 auto; min-height: 0; max-height: 42%; overflow-y: auto; padding: 10px 14px; overscroll-behavior: contain; scrollbar-width: thin; }
    #selection.is-floating {
      position: fixed; left: 14px; bottom: 34px; z-index: var(--z-hud);
      width: var(--col-w); max-width: calc(100vw - 28px); max-height: calc(100dvh - 110px);
      border-radius: var(--radius-md); box-shadow: var(--shadow-panel); color-scheme: dark;
    }
    .sel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .sel-head h2 { font-size: 10.5px; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; }
    .sel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
    .sel-osm { color: var(--accent-bright); font-size: 11px; }
    .sel-osm:focus-visible, .sel-primary summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sel-primary details { margin-top: 8px; }
    .sel-primary summary { cursor: pointer; color: var(--text-muted); }
    .sel-tags { font-family: var(--font-mono); font-size: 10px; margin-top: 4px; }
    .sel-also { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
    .sel-also h3 { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .sel-also ul { list-style: none; max-height: 120px; overflow-y: auto; margin-top: 4px; }
    .sel-also li { padding: 3px 0; font-size: 11px; }
    .tray-summary .sw { display: inline-block; vertical-align: -1px; margin-right: 6px; }
    @media (hover: none), (pointer: coarse) { #hover-tip { display: none; } }

    /* Recuadro jugable: panel centrado en la parte libre del mapa */
    #frame-panel, #measure-panel {
      position: fixed; z-index: var(--z-hud);
      left: 50%; bottom: 60px; transform: translateX(-50%);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      flex-wrap: wrap; width: max-content; max-width: calc(100vw - 24px);
      padding: 8px 10px; font-size: 11px;
    }
    #frame-panel[hidden], #measure-panel[hidden], #measure-done[hidden] { display: none; }
    #measure-panel { overflow-y: auto; overscroll-behavior: contain; }
    #measure-total { text-align: center; }
    .frame-label { text-align: center; }
    #frame-center, #frame-export, #export-go, #measure-done, #measure-clear {
      flex-shrink: 0; padding: 7px 10px;
      background: var(--accent-soft); color: var(--text-strong);
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font: 600 11px var(--font-ui); cursor: pointer;
    }
    #frame-center:hover, #frame-export:hover, #export-go:hover,
    #measure-done:hover, #measure-clear:hover { background: var(--accent-deep); }
    #export-go:disabled { opacity: 0.5; cursor: wait; }
    #export-menu {
      position: fixed; z-index: var(--z-hud); width: 320px;
      padding: 12px; overflow-y: auto; overscroll-behavior: contain;
      font-size: 12px;
    }
    #export-menu[hidden], #export-link[hidden] { display: none; }
    #export-menu fieldset { border: 0; margin: 0 0 8px; padding: 0; }
    #export-menu legend { font-weight: 600; margin-bottom: 4px; }
    #export-menu label { display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer; }
    #export-menu input { accent-color: var(--accent); }
    #export-go { margin-top: 8px; }
    #export-status { margin-top: 8px; overflow-wrap: anywhere; color: var(--text-muted); }
    #export-status:empty { display: none; }
    #export-link { display: flex; align-items: center; margin-top: 8px; color: var(--accent-bright); }
    .maplibregl-ctrl-group button.cs2-frame, .maplibregl-ctrl-group button.cs2-measure {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-base);
    }
    .maplibregl-ctrl-group button.cs2-frame:focus-visible,
    .maplibregl-ctrl-group button.cs2-measure:focus-visible { outline-offset: -3px; }
    .maplibregl-ctrl-group button.cs2-frame[aria-pressed="true"],
    .maplibregl-ctrl-group button.cs2-measure[aria-pressed="true"] { color: var(--accent-bright); background: var(--accent-soft); }
    .cs2-frame svg, .cs2-measure svg { width: 20px; height: 20px; vertical-align: middle; }
    .measure-label {
      pointer-events: none; padding: 3px 6px; border-radius: var(--radius-sm);
      background: var(--bg-panel-solid); color: #ffd166;
      font: 11px var(--font-ui); white-space: nowrap; box-shadow: var(--shadow-panel);
    }
    .measure-preview { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .measure-preview[hidden] { display: none; }
    .frame-handle {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0;
      border: 1px solid var(--text-strong); border-radius: 50%;
      background: var(--bg-panel-solid); color: var(--text-strong);
      box-shadow: var(--shadow-panel); cursor: grab;
    }
    .frame-handle svg { width: 20px; height: 20px; pointer-events: none; }
    .frame-handle.is-dragging { cursor: grabbing; }

    /* Attribution: discreta */
    .maplibregl-ctrl-attrib {
      background: rgba(10, 14, 26, 0.7) !important;
      color: var(--text-faint) !important;
      font-size: 10px !important;
    }
    .maplibregl-ctrl-attrib a { color: var(--text-dim) !important; }
    .maplibregl-ctrl-attrib-button { filter: invert(0.8); }

    /* ══ ACCESSIBILITY ════════════════════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    #star-link:focus-visible,
    #share-view:focus-visible,
    #search-open:focus-visible,
    #search-panel input:focus-visible,
    #search-panel button:focus-visible,
    #search-panel a:focus-visible,
    #share-panel input:focus-visible,
    #frame-center:focus-visible,
    #frame-export:focus-visible,
    #measure-done:focus-visible,
    #measure-clear:focus-visible,
    .cs2-measure:focus-visible,
    #export-menu input:focus-visible,
    #export-go:focus-visible,
    #export-link:focus-visible,
    .cs2-frame:focus-visible,
    .frame-handle:focus-visible,
    #cities-link:focus-visible,
    #layers-open:focus-visible,
    .icon-btn:focus-visible,
    .mod-toggle:focus-visible,
    .seg button:focus-visible,
    .only-btn:focus-visible,
    .link-btn:focus-visible,
    .cat-check:focus-visible,
    .cat-empty summary:focus-visible,
    .conf-title:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .col-tray-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* Sin mouse (táctil): Only siempre a la vista, en su propia celda al lado
       del conteo, y filas de 44 px para el dedo */
    @media (hover: none) {
      .cat-row { grid-template-columns: minmax(0, 1fr) auto auto; }
      .cat-row > .only-btn { grid-column: 3; opacity: 1; }
      .cat-row:hover > .cat-count { opacity: 1; }
      .cat-row:has(:focus-visible) > .cat-count { opacity: 1; }
    }
    /* Los demás controles de la bandeja, también a medida del dedo */
    @media (hover: none), (pointer: coarse) {
      #frame-center, #frame-export, #export-go, #export-menu label, #export-link,
      #measure-done, #measure-clear { min-height: 44px; }
      .cat-row { min-height: 44px; }
      .only-btn { min-height: 36px; padding: 6px 10px; }
      .seg button { min-height: 40px; padding: 7px 10px; }
      .mod-toggle { min-height: 44px; }
      .link-btn { min-height: 36px; }
      .mod-head { min-height: 52px; }
      .cat-empty summary, .conf-title { min-height: 44px; }
    }

    /* ══ RESPONSIVE — pantallas chicas ════════════════════════════════════════ */
    @media (max-width: 640px) {
      #title-ctrl {
        font-size: 10.5px;
        padding: 7px 12px 7px 10px;
        letter-spacing: 1.2px;
      }
      #star-link { padding: 7px 9px; font-size: 10.5px; }
      #star-link .star-label { display: none; }
      #cities-link { padding: 7px 8px; }
      #cities-link .cities-label { display: none; }
    }
    /* Mismo corte que SMALL_SCREEN en el JS: la columna pasa a ser una bandeja
       abajo, de ancho completo, que tapa el mapa en vez de achicarlo. Plegada
       muestra solo la cabecera, con el resumen de lo que está prendido. */
    @media (max-width: 640px), (max-height: 500px) {
      #search-open, #search-panel button { min-width: 44px; min-height: 44px; }
      #title-header, body.col-open #title-header { width: calc(100vw - 74px); }
      #search-panel, body.col-open #search-panel { width: 100%; }
      #share-view { min-width: 44px; min-height: 44px; justify-content: center; }
      #share-view .share-label { display: none; }
      #layers-col, body.col-open #layers-col {
        display: flex;
        top: auto; right: 0;
        width: auto;
        max-height: 50vh;
        max-height: 50dvh;
        border-right: 0;
        border-top: 1px solid var(--border-soft);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.5);
      }
      body.col-open #map { margin-left: 0; }
      body.col-open #title-header { left: 60px; max-width: calc(100vw - 74px); }
      body.col-open #share-panel { width: min(440px, calc(100vw - 74px)); }
      #layers-open, body.col-open #layers-open { display: none; }
      .col-head { display: none; }
      .col-tray-toggle { display: flex; }
      #selection { max-height: 24vh; max-height: 24dvh; }
      #layers-col:not(.tray-open) #selection { display: none; }
      #layers-col:not(.tray-open) .col-body,
      #layers-col:not(.tray-open) .col-foot { display: none; }
      .count { display: none; }
      /* La escala y la atribución suben lo que mide la cabecera de la bandeja
         (más su borde de arriba) */
      .maplibregl-ctrl-bottom-right { bottom: calc(var(--tray-head) + 1px); }
    }
    /* Celular apaisado: una bandeja abajo, de la mitad del alto, dejaba unos
       90 px para la lista. Va como cajón a la izquierda: plegada es la misma
       cabecera, abajo a la izquierda; desplegada ocupa todo el alto y el mapa
       sigue a la vista a su derecha. */
    @media (max-height: 500px) and (min-width: 641px) {
      #layers-col, body.col-open #layers-col {
        right: auto;
        width: var(--col-w);
        border-right: 1px solid var(--border-soft);
        border-radius: 0 var(--radius-lg) 0 0;
      }
      #layers-col.tray-open, body.col-open #layers-col.tray-open {
        top: 0;
        max-height: none;
        border-top: 0;
        border-radius: 0;
      }
      /* La bandeja no llega a la derecha: la escala y la atribución quedan abajo */
      .maplibregl-ctrl-bottom-right { bottom: 0; }
      /* Con el cajón desplegado, la ciudad y Star se corren a su derecha (si no,
         asomaba un pedazo de la píldora por el borde del cajón) */
      body.tray-open #title-header {
        left: calc(var(--col-w) + 12px);
        width: calc(100vw - var(--col-w) - 24px);
        max-width: calc(100vw - var(--col-w) - 24px);
      }
      body.tray-open #share-panel { width: min(440px, calc(100vw - var(--col-w) - 24px)); }
    }

  </style>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
async function loadStarCount() {
  const starCount = document.getElementById("star-count");
  const cacheKey = "cs2-osm-toolkit-stars";
  try {
    const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
    if (cached && Number.isInteger(cached.count) && cached.count >= 0 &&
        Number.isFinite(cached.expiresAt) && cached.expiresAt > Date.now()) {
      starCount.textContent = cached.count.toLocaleString("en-US");
      return;
    }
  } catch (_) {}

  try {
    const response = await fetch("https://api.github.com/repos/Osyanne/CitiesSkylines2-osm-toolkit");
    if (!response.ok) return;
    const count = (await response.json()).stargazers_count;
    if (!Number.isInteger(count) || count < 0) return;
    starCount.textContent = count.toLocaleString("en-US");
    try {
      sessionStorage.setItem(cacheKey, JSON.stringify({ count, expiresAt: Date.now() + 3600000 }));
    } catch (_) {}
  } catch (_) {}
}
loadStarCount();

// ════════════════════════════════════════════════════════════════════════════
// Multi-city bootstrap — lee ?city=<slug> de URL, fetch cities.json +
// manifest.json, y carga solo lo que la ciudad tiene.
//
// Zonificación y red vial llegan como teselas vectoriales (cities/<slug>/tiles/,
// generadas por `uv run build-tiles`): el navegador baja solo lo que se ve y
// MapLibre lo dibuja con la GPU. Si una ciudad no tiene teselas (datos de una
// versión vieja del toolkit), se bajan los datos completos como antes.
// ════════════════════════════════════════════════════════════════════════════

const params = new URLSearchParams(window.location.search);
const CITY_SLUG = params.get("city");

if (!CITY_SLUG) {
  // Sin parámetro → redirect a landing
  window.location.replace("index.html");
  throw new Error("no city slug, redirecting to landing");
}

let CITY_META = null;       // entry de cities.json
let CITY_MANIFEST = null;   // manifest.json per-city
let TILESET = null;         // tiles.json de la ciudad (null → datos completos)

// Módulos que viajan dentro de las teselas cuando la ciudad las tiene
const TILED_MODULES = new Set(["zoning", "vial", "external_buildings"]);

async function bootstrap() {
  try {
    // 1. cities.json — deployado al lado de map.html por generate-landing
    const citiesResp = await fetch("cities.json");
    if (!citiesResp.ok) throw new Error(`cities.json not found (HTTP ${citiesResp.status})`);
    const cities = await citiesResp.json();
    if (!(CITY_SLUG in cities)) {
      window.location.replace("index.html");
      return;
    }
    CITY_META = cities[CITY_SLUG];

    // Actualizar título de carga tan pronto como tenemos el nombre
    const cityEl = document.getElementById("loading-city");
    if (cityEl) cityEl.textContent = CITY_META.display_name;

    // 2. manifest.json — qué módulos hay generados para esta ciudad
    // Cache-bust: manifests change when data regenerates and we don't want
    // stale browser cache hiding new modules (official_zoning, etc.)
    const manifestResp = await fetch(`cities/${CITY_SLUG}/manifest.json`, { cache: "no-store" });
    if (!manifestResp.ok) {
      showError(`City data corrupted: manifest.json missing for "${CITY_SLUG}" (HTTP ${manifestResp.status})`);
      return;
    }
    CITY_MANIFEST = await manifestResp.json();

    // 3. Qué archivo corresponde a cada módulo (los manifests viejos no traen "file")
    const moduleToFile = {
      zoning:             "datos_zonificacion.js",
      vial:               "datos_vial.js",
      services:           "datos_servicios.js",
      external_buildings: "datos_external_buildings.js",
      official_zoning:    "datos_zonificacion_official.js",
      transporte:         "datos_transporte.js",
      infraestructura:    "datos_infraestructura.js",
    };
    const modules = Object.keys(CITY_MANIFEST.modules || {});
    if (modules.length === 0) {
      showError(`No modules found in manifest for "${CITY_SLUG}"`);
      return;
    }

    // 4. Teselas: con ellas, zoning/vial/externos no se descargan enteros
    if (CITY_MANIFEST.tiles) {
      try {
        TILESET = await loadTileset(CITY_MANIFEST.tiles);
      } catch (e) {
        console.warn("[tiles] no se pudieron cargar, uso los datos completos:", e);
      }
    }

    // Split modules: primary (block render) vs secondary (lazy)
    const SECONDARY = new Set(["official_zoning", "transporte", "infraestructura"]);
    const primaryModules = modules.filter(m => !SECONDARY.has(m) && !(TILESET && TILED_MODULES.has(m)));
    const secondaryModules = modules.filter(m => SECONDARY.has(m));

    function loadModule(m) {
      const entry = CITY_MANIFEST.modules[m] || {};
      const file = entry.file || moduleToFile[m];
      if (!file) return Promise.resolve();
      const src = `cities/${CITY_SLUG}/${file}?v=${entry.hash ?? ""}`;
      return file.endsWith(".json") ? loadCompact(m, src) : loadScript(src);
    }

    // Load primary modules first, then render the map
    await Promise.all(primaryModules.map(loadModule));

    // 5. Renderizar
    renderMap();

    // Lazy-load secondary modules AFTER first paint, in background.
    const LOADED_HOOK = {
      official_zoning: "officialZoningLoaded",
      transporte:      "transporteLoaded",
      infraestructura: "infraestructuraLoaded",
    };
    for (const m of secondaryModules) {
      loadModule(m)
        .then(() => window[LOADED_HOOK[m]]?.())
        .catch(err => {
          console.warn(`[${m}] Failed to load:`, err);
          window.moduleLoadFailed?.(m);
        });
    }
  } catch (e) {
    showError(`Failed to load city "${CITY_SLUG}": ${e.message}`);
  }
}

async function loadTileset(entry) {
  const base = `cities/${CITY_SLUG}/${entry.path || "tiles"}`;
  const resp = await fetch(`${base}/tiles.json?v=${entry.hash ?? ""}`);
  if (!resp.ok) throw new Error(`tiles.json HTTP ${resp.status}`);
  const info = await resp.json();
  if (info.format !== "cs2-tiles" || info.version > 1) {
    throw new Error(`unsupported tile format (${info.format} v${info.version})`);
  }
  info.base = base;
  // Las teselas vacías no existen en disco: se contestan sin pedirlas
  info.available = new Set(
    Object.entries(info.tiles).flatMap(([z, names]) => names.map(n => `${z}/${n}`))
  );
  return info;
}

// Protocolo cs2tiles://z/x/y → cities/<slug>/tiles/z/x/y.mvt.gz
// Las teselas se guardan con gzip y se sirven como binario opaco (sirve con
// `python -m http.server` y con GitHub Pages); acá se descomprimen.
maplibregl.addProtocol("cs2tiles", async (params, abortController) => {
  const key = params.url.slice("cs2tiles://".length);
  if (!TILESET || !TILESET.available.has(key)) return { data: new ArrayBuffer(0) };
  const resp = await fetch(`${TILESET.base}/${key}.mvt.gz?v=${TILESET.hash}`, {
    signal: abortController.signal,
  });
  if (!resp.ok) throw new Error(`tile ${key}: HTTP ${resp.status}`);
  let buf = await resp.arrayBuffer();
  const head = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
  // Algunos servidores ya la mandan descomprimida (Content-Encoding: gzip)
  if (head[0] === 0x1f && head[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    buf = await new Response(stream).arrayBuffer();
  }
  return { data: buf };
});

// ════════════════════════════════════════════════════════════════════════════
// Formato compacto (src/shared/compact.py): coordenadas como enteros delta y
// propiedades por columna. Se decodifica a las mismas variables globales que
// definían los datos_*.js viejos. Solo se usa cuando la ciudad no tiene teselas.
// ════════════════════════════════════════════════════════════════════════════
function decodeCompact(doc) {
  const scale = 10 ** doc.precision;
  const out = {};
  for (const [key, layer] of Object.entries(doc.layers)) {
    const items = new Array(layer.ids.length);
    for (let i = 0; i < items.length; i++) {
      const g = layer.geom[i];
      const coords = new Array(g.length / 2);
      let lat = 0, lon = 0;
      for (let j = 0; j < g.length; j += 2) {
        lat += g[j];
        lon += g[j + 1];
        coords[j / 2] = [lat / scale, lon / scale];
      }
      items[i] = { id: layer.ids[i], coords, cs2_key: key };
    }
    for (const [prop, col] of Object.entries(layer.props || {})) {
      if (col.values) {
        col.values.forEach((v, i) => { items[i][prop] = v; });
        continue;
      }
      if ("default" in col) for (const it of items) it[prop] = col.default;
      if (col.sparse) {
        for (const [i, v] of Object.entries(col.sparse)) items[+i][prop] = v;
      } else if (col.dict) {
        col.codes.forEach((c, i) => { if (c >= 0) items[i][prop] = col.dict[c]; });
      }
    }
    out[key] = items;
  }
  return out;
}

async function loadCompact(module, src) {
  const resp = await fetch(src);
  if (!resp.ok) throw new Error(`Failed to load ${src} (HTTP ${resp.status})`);
  const doc = await resp.json();
  if (doc.format !== "cs2-compact" || doc.version > 1) {
    throw new Error(`${src}: unsupported data format (${doc.format} v${doc.version})`);
  }
  const layers = decodeCompact(doc);
  if (module === "vial") {
    window.DATA_VIAL = layers;
    return;
  }
  const prefix = module === "external_buildings" ? "DATA_EXT_" : "DATA_";
  for (const [key, items] of Object.entries(layers)) {
    window[prefix + key.toUpperCase()] = items;
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.body.appendChild(s);
  });
}

function showError(msg) {
  document.body.innerHTML = `
    <div style="padding: 2rem; font-family: sans-serif; color: #c9d1d9; background: #0d1117; min-height: 100vh;">
      <h1 style="color:#ef5350;margin-bottom:1rem;">⚠ Error</h1>
      <p style="margin-bottom:1rem;">${msg}</p>
      <p>
        <a href="index.html" style="color: #58a6ff;">← All cities</a> &nbsp;·&nbsp;
        <a href="https://github.com/Osyanne/CitiesSkylines2-osm-toolkit/issues/new"
           style="color: #58a6ff;" target="_blank">Report issue</a>
      </p>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// GEOMETRY — polyAreaM2: área aproximada en m² (proyección equirectangular)
// ════════════════════════════════════════════════════════════════════════════
function polyAreaM2(ring) {
  if (!ring || ring.length < 3) return 0;
  const lat0 = ring.reduce((s, p) => s + p[0], 0) / ring.length;
  const cosLat0 = Math.cos(lat0 * Math.PI / 180);
  const MperDegLat = 111320;
  const MperDegLon = 111320 * cosLat0;
  const pts = ring.map(p => [p[1] * MperDegLon, p[0] * MperDegLat]);
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i];
    const [x1, y1] = pts[(i + 1) % pts.length];
    s += x0 * y1 - x1 * y0;
  }
  return Math.abs(s) / 2;
}

// [lat, lon] (datos del toolkit) → [lon, lat] (GeoJSON / MapLibre)
const lngLat = c => [c[1], c[0]];

function polygonGeometry(coords) {
  const ring = coords.map(lngLat);
  const first = ring[0], last = ring[ring.length - 1];
  if (first[0] !== last[0] || first[1] !== last[1]) ring.push(first);
  return { type: "Polygon", coordinates: [ring] };
}

function lineGeometry(coords) {
  return { type: "LineString", coordinates: coords.map(lngLat) };
}

// Anti-XSS: OSM names son contenido user-generated.
function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Ícono de servicio (círculo con letra, o un árbol para parques) dibujado en
// canvas: sin fuentes de glifos externas y nítido en pantallas retina. El mismo
// dibujo va al mapa (serviceIconImage) y a la leyenda (serviceIconUrl).
const SERVICE_ICON_RATIO = 2;

function serviceIconCanvas(type) {
  const r = SERVICE_ICON_RATIO;
  const size = 26 * r;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  const c = size / 2;
  ctx.shadowColor = "rgba(0,0,0,0.6)";
  ctx.shadowBlur = 3 * r;
  ctx.shadowOffsetY = 1 * r;
  ctx.beginPath();
  ctx.arc(c, c, 10 * r, 0, Math.PI * 2);
  ctx.fillStyle = type.color;
  ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineWidth = 2 * r;
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.stroke();
  ctx.fillStyle = "#fff";
  if (type.char === "tree") {
    // Copa triangular y tronco
    ctx.beginPath();
    ctx.moveTo(c, c - 6.5 * r);
    ctx.lineTo(c + 5 * r, c + 2.5 * r);
    ctx.lineTo(c - 5 * r, c + 2.5 * r);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(c - 1.2 * r, c + 2.5 * r, 2.4 * r, 3.5 * r);
  } else {
    ctx.font = `700 ${11 * r}px Inter, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(type.char, c, c + 0.5 * r);
  }
  return canvas;
}

function serviceIconImage(type) {
  const canvas = serviceIconCanvas(type);
  const ctx = canvas.getContext("2d");
  return { image: ctx.getImageData(0, 0, canvas.width, canvas.height), pixelRatio: SERVICE_ICON_RATIO };
}

function serviceIconUrl(type) {
  return serviceIconCanvas(type).toDataURL();
}

// ════════════════════════════════════════════════════════════════════════════
// renderMap — inicializa MapLibre y los módulos según manifest
// ════════════════════════════════════════════════════════════════════════════
function renderMap() {
  const [s, w, n, e] = CITY_META.bbox;
  const tileMode = !!TILESET;

  // Actualizar title desde metadata
  document.title = `CS2 OSM Toolkit — ${CITY_META.display_name}`;
  const titleText = document.getElementById("title-text");
  if (titleText) {
    titleText.textContent = CITY_META.display_name;
    // Apodo opcional que eligió quien pidió la ciudad: chico, entre paréntesis
    if (CITY_META.nickname) {
      const nick = document.createElement("small");
      nick.className = "nick";
      nick.textContent = ` (${CITY_META.nickname})`;
      titleText.appendChild(nick);
    }
  }

  // Qué módulos hay (manifest + teselas o variables globales presentes)
  const hasExternal = !tileMode && !!CITY_MANIFEST.modules?.external_buildings &&
    typeof DATA_EXT_RES_LOW_HOUSE !== "undefined";
  const hasZoning = tileMode
    ? TILESET.layers.includes("zoning")
    : (!!CITY_MANIFEST.modules?.zoning && typeof DATA_RES_LOW_HOUSE !== "undefined") || hasExternal;
  const hasVial = tileMode
    ? TILESET.layers.includes("vial")
    : !!CITY_MANIFEST.modules?.vial && typeof DATA_VIAL !== "undefined";
  const hasServices = !!CITY_MANIFEST.modules?.services && typeof DATA_SERVICES_POLYGONS !== "undefined";

  // ══════════════════════════════════════════════════════════════════════════
  // ESTADO GUARDADO — por ciudad: módulos, mapa base, fuente y recuadro. La v1 no
  // se lee: guardaba las pills y el "Fondo", que ya no existen.
  // ══════════════════════════════════════════════════════════════════════════
  const VIEW_STATE_KEY = `cs2-view-state-${CITY_SLUG}-v2`;

  function readViewState() {
    try {
      const state = JSON.parse(localStorage.getItem(VIEW_STATE_KEY) || "null");
      return state && typeof state === "object" && !Array.isArray(state) ? state : null;
    } catch { return null; }
  }

  function writeViewState(state) {
    try {
      localStorage.setItem(VIEW_STATE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("[view-state] no se pudo guardar:", e.message);
    }
  }

  const savedState = readViewState();
  const initialHash = new URLSearchParams(location.hash.slice(1));
  let basemap = ["dark", "sat"].includes(initialHash.get("base"))
    ? initialHash.get("base") : savedState?.basemap === "sat" ? "sat" : "dark";

  // Columna de capas abierta o cerrada: se decide antes de crear el mapa para
  // que arranque con su ancho (y el encuadre inicial sea el de ese ancho)
  const SMALL_SCREEN = "(max-width: 640px), (max-height: 500px)";
  const COL_OPEN_KEY = "cs2-layers-col-v1";

  function colStartsOpen() {
    try {
      const saved = localStorage.getItem(COL_OPEN_KEY);
      if (saved !== null) return saved === "1";
    } catch {}
    // En ventanas chicas la columna le come demasiado al mapa: arranca cerrada.
    // 700 de alto deja abierta la columna en las notebooks (1366×768, 1280×720)
    return !(window.innerWidth < 1200 || window.innerHeight < 700);
  }
  document.body.classList.toggle("col-open", colStartsOpen());

  // ══════════════════════════════════════════════════════════════════════════
  // MAPA — MapLibre + fondo Esri
  // Esri: free, sin API key. CARTO dejó de servir tiles anónimos sin marca de
  // agua ("API KEY REQUIRED", 2026-09), así que el dark es Esri Dark Gray
  // Canvas: base + capa de etiquetas, oscurecida para el look CS2.
  // ══════════════════════════════════════════════════════════════════════════
  const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
  const ESRI_ATTR = 'Tiles © <a href="https://www.esri.com">Esri</a> © <a href="https://openstreetmap.org">OSM</a> contributors';
  const DARKEN = { "raster-brightness-max": 0.45, "raster-saturation": -0.25 };
  const OSM_ATTR = '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  const darkVis = basemap === "sat" ? "none" : "visible";

  // En el celular la bandeja plegada tapa la franja de abajo: el encuadre de la
  // ciudad la descuenta
  const TRAY_HEAD = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tray-head")) || 52;
  const fitPadding = () => window.matchMedia(SMALL_SCREEN).matches
    ? { top: 0, right: 0, left: 0, bottom: TRAY_HEAD + 1 }
    : 0;

  function normalizeCameraHash() {
    // El visor es 2D: quitar bearing y pitch antes de que maxPitch: 0 haga
    // que MapLibre rechace también el centro y zoom de un enlace inclinado.
    const normalized = location.hash.replace(/([#&]map=)([^&]*)/g,
      (_, prefix, camera) => prefix + camera.split(/\/|%2f/i).slice(0, 3).join("/"));
    if (normalized !== location.hash) history.replaceState(history.state, "", normalized);
  }
  normalizeCameraHash();
  // Se registra antes que MapLibre para normalizar también un enlace pegado.
  window.addEventListener("hashchange", normalizeCameraHash);

  const map = new maplibregl.Map({
    container: "map",
    hash: "map",
    maxPitch: 0,
    style: {
      version: 8,
      sources: {
        "esri-dark": {
          type: "raster", tileSize: 256, maxzoom: 16, attribution: ESRI_ATTR,
          tiles: [`${ESRI}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`],
        },
        "esri-dark-ref": {
          type: "raster", tileSize: 256, maxzoom: 16,
          tiles: [`${ESRI}/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}`],
        },
        "esri-sat": {
          type: "raster", tileSize: 256, maxzoom: 19,
          attribution: 'Tiles © <a href="https://www.esri.com">Esri</a> World Imagery',
          tiles: [`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`],
        },
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": "#0a1220" } },
        { id: "base-dark", type: "raster", source: "esri-dark", paint: DARKEN, layout: { visibility: darkVis } },
        // Las etiquetas (nombres de calles y barrios) no se oscurecen tanto: con
        // DARKEN no se leían
        { id: "base-dark-ref", type: "raster", source: "esri-dark-ref", paint: { "raster-brightness-max": 0.8 },
          layout: { visibility: darkVis } },
        { id: "base-sat", type: "raster", source: "esri-sat", layout: { visibility: basemap === "sat" ? "visible" : "none" } },
      ],
    },
    // El mapa arranca ya encuadrado en la ciudad (nada de zoom de planeta)
    bounds: [[w, s], [e, n]],
    fitBoundsOptions: { padding: fitPadding() },
    minZoom: tileMode ? TILESET.minzoom : 8,
    maxZoom: 19,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false,
    renderWorldCopies: false,
    attributionControl: false,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
  map.addControl({
    onAdd() {
      const el = document.createElement("div");
      el.className = "maplibregl-ctrl maplibregl-ctrl-group";
      el.innerHTML = `<button type="button" class="cs2-fit" aria-label="Fit city" title="Fit city">` +
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
        `<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></button>` +
        `<button type="button" class="cs2-frame" aria-label="Playable area" aria-pressed="false" title="CS2 playable area (14.3 km, 23 × 23 tiles)">` +
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">` +
        `<rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>` +
        `<button type="button" class="cs2-measure" aria-label="Measure" aria-pressed="false" title="Measure distance in metres and 8 m cells">` +
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">` +
        `<rect x="3" y="7" width="18" height="10" rx="1"/><path d="M7 7v5M12 7v3M17 7v5"/></svg></button>`;
      el.querySelector(".cs2-fit").addEventListener("click", () => map.fitBounds([[w, s], [e, n]], { padding: fitPadding() }));
      el.querySelector(".cs2-frame").addEventListener("click", toggleFrame);
      el.querySelector(".cs2-measure").addEventListener("click", toggleMeasure);
      return el;
    },
    onRemove() {},
  }, "top-left");
  map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");
  function formatMeters(m) {
    return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(2)} km`;
  }

  function formatCells(m) {
    const cells = m / 8;
    return `${cells.toLocaleString("en-US", { maximumFractionDigits: cells < 100 ? 1 : 0 })} cells`;
  }

  function scaleMeters(distance) {
    const power = 10 ** Math.floor(Math.log10(distance));
    return [5, 3, 2, 1].find(step => step * power <= distance) * power;
  }

  // Los controles inferiores se apilan hacia arriba de la atribución.
  map.addControl({
    onAdd() {
      this.el = document.createElement("div");
      this.el.className = "maplibregl-ctrl maplibregl-ctrl-scale cs2-scale";
      this.el.setAttribute("role", "img");
      this.el.innerHTML = '<div class="scale-bar"></div><span class="scale-label"></span>';
      this.update = () => {
        const canvas = map.getCanvas();
        const x = canvas.clientWidth / 2, y = canvas.clientHeight / 2;
        const distance = map.unproject([x - 55, y]).distanceTo(map.unproject([x + 55, y]));
        if (!Number.isFinite(distance) || distance <= 0) return;
        const meters = scaleMeters(distance);
        const label = meters < 1000 ? `${meters} m` : `${meters / 1000} km`;
        const cells = formatCells(meters);
        this.el.querySelector(".scale-bar").style.width = `${110 * meters / distance}px`;
        this.el.querySelector(".scale-label").textContent = `${label} · ${cells}`;
        this.el.setAttribute("aria-label", `Scale: ${label}, ${cells}`);
      };
      map.on("move", this.update);
      map.on("resize", this.update);
      this.update();
      return this.el;
    },
    onRemove() {
      map.off("move", this.update);
      map.off("resize", this.update);
      this.el.remove();
    },
  }, "bottom-right");
  map.on("error", ev => console.warn("[map]", ev.error?.message || ev));
  window.CS2_MAP = map;   // para depurar desde la consola

  // Las capas se agregan apenas el estilo está listo. No se espera "load": ese
  // evento necesita que el fondo de Esri termine de bajar, y si Esri está
  // bloqueado (adblock, red corporativa) no llega nunca.
  const mapReady = new Promise(r => map.once("style.load", r));

  // ══════════════════════════════════════════════════════════════════════════
  // CAPAS — orden de dibujo (abajo → arriba) y opacidades base
  // ══════════════════════════════════════════════════════════════════════════
  const LAYER_ORDER = [
    "zoning-fill", "zoning-line", "zoning-line-lowconf",
    "official-fill", "official-line",
    "zoning-hover", "official-hover",
    "vial-line",
    "services-fill", "services-line",
    "transporte-line",
    "infra-fill", "infra-line", "infra-points",
    "services-points",
    "cs2-search-fill", "cs2-search-line",
    "cs2-frame-mask", "cs2-frame-grid", "cs2-frame-casing", "cs2-frame-outline",
    "cs2-measure-line", "cs2-measure-points",
  ];
  const OPACITY_PROPS = {
    fill: ["fill-opacity"],
    line: ["line-opacity"],
    circle: ["circle-opacity", "circle-stroke-opacity"],
    symbol: ["icon-opacity"],
  };
  const baseOpacity = {};   // id → {prop: valor o expresión}
  const baseFilter = {};    // id → filtro propio de la capa (sin el de categorías)
  const layerModule = {};   // id → clave de categorías ("zoning", "vial", "services")

  function addLayerOrdered(layer, categoryKey) {
    const idx = LAYER_ORDER.indexOf(layer.id);
    const before = LAYER_ORDER.slice(idx + 1).find(id => map.getLayer(id));
    baseOpacity[layer.id] = Object.fromEntries(
      (OPACITY_PROPS[layer.type] || []).map(p => [p, layer.paint?.[p] ?? 1])
    );
    baseFilter[layer.id] = layer.filter || null;
    appliedFilter[layer.id] = JSON.stringify(baseFilter[layer.id]);
    if (!layer.filter) delete layer.filter;   // MapLibre rechaza filter: null
    map.addLayer(layer, before);
    if (categoryKey) {
      // Puede haber categorías ocultas de antes (un Only mientras cargaba)
      layerModule[layer.id] = categoryKey;
      staleFilters.add(layer.id);
      flushFilters();
    }
  }

  const zoneColor = ["match", ["get", "k"], ...Object.entries(ZONES).flatMap(([k, z]) => [k, z.color]), "#888888"];
  const zoneNeon = ["match", ["get", "k"], ...Object.entries(ZONES).flatMap(([k, z]) => [k, z.neon]), "#aaaaaa"];
  const isLowConf = ["==", ["get", "m"], "area"];
  // Relleno de zonas con la transparencia en el color (55 %, o 22 % si la zona
  // salió del tamaño) y fill-opacity fijo en 1. Si la transparencia fuera un
  // fill-opacity que depende de cada polígono, Dim cambiaría una expresión y
  // MapLibre volvería a procesar todas las teselas; así cambia un número y se
  // aplica en el cuadro siguiente.
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  };
  const zoneColorAlpha = a => ["match", ["get", "k"],
    ...Object.entries(ZONES).flatMap(([k, z]) => [k, rgba(z.color, a)]), rgba("#888888", a)];
  const zoneFill = ["case", isLowConf, zoneColorAlpha(0.22), zoneColorAlpha(0.55)];
  // Datos completos (sin teselas): los features traen su zoom mínimo en "mz"
  const zoomGate = tileMode ? null : [">=", ["zoom"], ["get", "mz"]];
  const withGate = f => (zoomGate ? (f ? ["all", zoomGate, f] : zoomGate) : f);

  function inspectionLayer(src, id, filter = null) {
    const selected = ["boolean", ["feature-state", "selected"], false];
    const hover = ["boolean", ["feature-state", "hover"], false];
    return {
      id, type: "line", ...src, filter,
      paint: {
        "line-color": ["case", selected, "#ffffff", zoneNeon],
        "line-width": ["case", selected, 2.5, 1.5],
        "line-opacity": ["case", ["any", selected, hover], 1, 0],
      },
    };
  }

  function zoningLayers(src, idPrefix) {
    return [
      {
        id: `${idPrefix}-fill`, type: "fill", ...src, filter: withGate(null),
        // Visual encoding: baja confianza → fill semitransparente + borde punteado
        paint: { "fill-color": zoneFill, "fill-opacity": 1 },
      },
      {
        id: `${idPrefix}-line`, type: "line", ...src, filter: withGate(["!", isLowConf]),
        paint: { "line-color": zoneNeon, "line-width": 0.7, "line-opacity": 0.9 },
      },
      {
        id: `${idPrefix}-line-lowconf`, type: "line", ...src, filter: withGate(isLowConf),
        // dasharray en múltiplos del ancho: 0.5 px × [8, 6] = el "4, 3" de Leaflet
        paint: { "line-color": zoneNeon, "line-width": 0.5, "line-opacity": 0.55, "line-dasharray": [8, 6] },
      },
      inspectionLayer(src, "zoning-hover", withGate(null)),
    ];
  }

  // ══════════════════════════════════════════════════════════════════════════
  // CONTEOS — de tiles.json con teselas, de los datos si no
  // ══════════════════════════════════════════════════════════════════════════
  const zoneCounts = Object.fromEntries(Object.keys(ZONES).map(k => [k, 0]));
  const vialCounts = Object.fromEntries(Object.keys(VIAL_TYPES).map(k => [k, 0]));
  const serviceCounts = Object.fromEntries(Object.keys(SERVICES_TYPES).map(k => [k, 0]));
  const transportCounts = Object.fromEntries(Object.keys(TRANSPORT_STYLE).map(k => [k, 0]));
  const infraCounts = Object.fromEntries(Object.keys(INFRA_STYLE).map(k => [k, 0]));

  // Datos completos → GeoJSON (solo sin teselas)
  function zoningGeoJSON() {
    const features = [];
    for (const key of Object.keys(ZONES)) {
      const osm = window[`DATA_${key.toUpperCase()}`] || [];
      const ext = window[`DATA_EXT_${key.toUpperCase()}`] || [];
      for (const it of [...osm, ...ext]) {
        if (!it.coords || it.coords.length < 3) continue;
        const p = { k: key, id: it.id,
          mz: TIER_MIN_AREA_M2[key] && polyAreaM2(it.coords) < TIER_MIN_AREA_M2[key] ? TIER_MINZOOM : 0 };
        if (it.name) p.n = it.name;
        if (it.method != null) p.m = it.method;
        if (it.src != null) p.s = it.src;
        if (it.conf != null) p.c = it.conf;
        features.push({ type: "Feature", properties: p, geometry: polygonGeometry(it.coords) });
        zoneCounts[key]++;
      }
    }
    return { type: "FeatureCollection", features };
  }

  function vialGeoJSON() {
    const features = [];
    for (const [key, items] of Object.entries(DATA_VIAL)) {
      if (!VIAL_TYPES[key]) continue;
      for (const f of items) {
        if (!f.coords || f.coords.length < 2) continue;
        const p = { k: key, mz: VIAL_MINZOOM[key] || 0 };
        if (f.name) p.n = f.name;
        if (f.bridge) p.b = true;
        features.push({ type: "Feature", properties: p, geometry: lineGeometry(f.coords) });
        vialCounts[key]++;
      }
    }
    return { type: "FeatureCollection", features };
  }

  // Servicios, transporte e infraestructura: la ficha sale del objeto original
  // (índice "i"), así los tags anidados no pasan por las propiedades de MapLibre
  const serviceIndex = { poly: {}, point: {} };
  function servicesGeoJSON() {
    const polys = [], points = [];
    for (const [key, items] of Object.entries(DATA_SERVICES_POLYGONS)) {
      if (!SERVICES_TYPES[key]) continue;
      serviceIndex.poly[key] = items;
      items.forEach((f, i) => {
        if (!f.coords || f.coords.length < 3) return;
        polys.push({ type: "Feature", properties: { k: key, i }, geometry: polygonGeometry(f.coords) });
        serviceCounts[key]++;
      });
    }
    for (const [key, items] of Object.entries(DATA_SERVICES_POINTS || {})) {
      if (!SERVICES_TYPES[key]) continue;
