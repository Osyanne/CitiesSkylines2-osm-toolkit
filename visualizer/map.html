<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CS2 OSM Toolkit — Cargando…</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ══ DESIGN TOKENS — CS2 in-game UI (faithful) ════════════════════════════ */
    :root {
      /* Surfaces — paneles más matte, gradient top→bottom sutil */
      --bg-void:        #0a1220;
      --bg-deep:        #0e1828;
      --bg-panel-top:   rgba(28, 42, 64, 0.95);
      --bg-panel-bot:   rgba(16, 26, 42, 0.97);
      --bg-panel:       rgba(20, 32, 50, 0.94);
      --bg-panel-solid: rgba(18, 28, 44, 0.98);
      --bg-elev:        rgba(255, 255, 255, 0.05);
      --bg-elev-hover:  rgba(255, 255, 255, 0.10);
      --bg-tile:        rgba(35, 52, 78, 0.85);
      --bg-tile-hover:  rgba(50, 72, 105, 0.90);

      /* Borders */
      --border-hair:    rgba(255, 255, 255, 0.06);
      --border-soft:    rgba(255, 255, 255, 0.10);
      --border-strong:  rgba(255, 255, 255, 0.18);

      /* Text */
      --text-strong:    #ffffff;
      --text-base:      #e2e8f0;
      --text-muted:     #a3b1c2;
      --text-dim:       #6b7a8f;
      --text-faint:     #4a5568;

      /* CS2 accent — azul medio del juego (no cyan brillante) */
      --accent:         #4a90e2;
      --accent-bright:  #7ab3f0;
      --accent-deep:    #2f6cb8;
      --accent-soft:    rgba(74, 144, 226, 0.22);
      --accent-glow:    rgba(74, 144, 226, 0.40);
      --accent-on:      #ffffff;

      /* Category colors — paleta de servicios CS2 */
      --cat-zoning:     #5dbe6e;   /* verde residencial */
      --cat-vial:       #f5c842;   /* amarillo tráfico */
      --cat-services:   #5bbdd0;   /* cyan-azulado servicios */
      --cat-transport:  #e89944;   /* naranja transporte */
      --cat-infra:        #f1c40f;   /* amarillo infraestructura */

      /* Status */
      --warn:           #f5c842;
      --ok:             #5dbe6e;
      --err:            #e55b5b;

      /* Layers (z-index) */
      --z-map:          1;
      --z-overlay:      400;
      --z-hud:          600;
      --z-loading:      10000;

      /* Motion */
      --t-fast:         120ms;
      --t-base:         180ms;
      --t-slow:         300ms;
      --ease-out:       cubic-bezier(0.16, 1, 0.3, 1);

      /* Typography — Inter weight medio, sin Orbitron en HUD */
      --font-ui:        'Inter', system-ui, sans-serif;
      --font-display:   'Inter', system-ui, sans-serif;
      --font-mono:      'JetBrains Mono', ui-monospace, monospace;

      /* Shape — CS2 usa border-radius medio (10-12px) */
      --radius-sm:      6px;
      --radius-md:      10px;
      --radius-lg:      14px;

      /* Elevation — panel sólido con shadow + subtle inner */
      --shadow-panel:   0 6px 24px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.5);
      --inner-top:      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg-void);
      font-family: var(--font-ui);
      font-feature-settings: "cv11", "ss01";
      color: var(--text-base);
      -webkit-font-smoothing: antialiased;
    }
    #map { height: 100vh; }

    /* ══ LOADING OVERLAY — landing-page identity ══════════════════════════════ */
    /* Local palette overrides — hereda 1:1 del landing (assets/landing.css)    */
    #loading {
      --ld-bg:           #0e0e10;
      --ld-text:         #fafafa;
      --ld-text-muted:   #a0a0a8;
      --ld-text-dim:     #71717a;
      --ld-accent:       #5e6ad2;
      --ld-accent-soft:  #c4b5fd;
      --ld-accent-2:     #8b5cf6;
      --ld-border:       rgba(255, 255, 255, 0.06);
      --ld-border-soft:  rgba(255, 255, 255, 0.10);
      --ld-warn:         #f59e0b;
      --ld-err:          #ef4444;

      position: fixed; inset: 0; z-index: var(--z-loading);
      background: var(--ld-bg);
      color: var(--ld-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Radial purple glow — centrado sobre el contenido */
    #loading::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(1400px, 110vw);
      height: min(1000px, 100vh);
      background: radial-gradient(ellipse at center, rgba(94, 106, 210, 0.22) 0%, rgba(94, 106, 210, 0.06) 35%, transparent 65%);
      pointer-events: none;
    }

    .loading-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center;
      width: 100%; max-width: 640px;
      padding: 0 2rem;
      text-align: center;
    }

    /* Brand block — replica del nav.top .brand */
    .loading-brand {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-weight: 600; font-size: 0.95rem;
      margin-bottom: 2.8rem;
      color: var(--ld-text);
    }
    .loading-brand-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--ld-accent), var(--ld-accent-2));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(94, 106, 210, 0.35);
    }
    .loading-brand-logo svg { width: 16px; height: 16px; color: #fff; }
    .loading-brand-ver {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--ld-text-dim);
      padding: 0.15rem 0.45rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-left: 0.2rem;
    }

    /* Badge "Loading [city]" — replica de .hero .badge */
    .loading-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.95rem;
      background: rgba(94, 106, 210, 0.10);
      border: 1px solid rgba(94, 106, 210, 0.30);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--ld-accent-soft);
      margin-bottom: 1.6rem;
    }
    .loading-badge .bdot {
      width: 6px; height: 6px;
      background: var(--ld-accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--ld-accent);
      animation: ldPulse 2s ease-in-out infinite;
    }
    @keyframes ldPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Hero title — replica de .hero h1 */
    #loading .logo {
      font-family: 'Inter', sans-serif;
      font-size: clamp(2.1rem, 4.5vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ld-text);
      margin-bottom: 0.6rem;
      text-shadow: none;
      text-transform: none;
    }
    #loading .logo .city-grad {
      background: linear-gradient(135deg, var(--ld-accent) 0%, var(--ld-accent-soft) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Lede — replica de .hero .lede */
    #loading .sub {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--ld-text-muted);
      max-width: 480px;
      margin-bottom: 2.4rem;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.5;
    }
    #loading .sub::before { content: none; }

    /* Module pills — replica de .filter-pills */
    #pgrid {
      display: flex;
      flex-wrap: wrap; justify-content: center;
      gap: 0.4rem;
      margin-bottom: 2.4rem;
    }
    .pi {
      display: inline-flex; align-items: center; gap: 0.55rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0.42rem 0.95rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ld-text-muted);
      letter-spacing: 0;
      text-transform: none;
      transition: background .2s, border-color .2s, color .2s;
    }
    .pi::before {
      content: ""; width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ld-text-dim);
      flex-shrink: 0;
      transition: background .2s, box-shadow .2s;
    }
    .pi.loading {
      color: var(--ld-text);
      border-color: rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.06);
    }
    .pi.loading::before {
      background: var(--ld-warn);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.55);
      animation: ldDot 1.4s ease-in-out infinite;
    }
    .pi.done {
      color: var(--ld-text);
      border-color: rgba(94, 106, 210, 0.40);
      background: rgba(94, 106, 210, 0.10);
    }
    .pi.done::before {
      background: var(--ld-accent);
      box-shadow: 0 0 8px rgba(94, 106, 210, 0.6);
    }
    .pi.error {
      color: var(--ld-text);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.07);
    }
    .pi.error::before { background: var(--ld-err); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
    @keyframes ldDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .pbadge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--ld-text-dim);
      font-variant-numeric: tabular-nums;
      margin-left: 0.15rem;
    }
    .pi.loading .pbadge { background: rgba(245, 158, 11, 0.18); color: var(--ld-warn); }
    .pi.done    .pbadge { background: rgba(94, 106, 210, 0.20); color: var(--ld-accent-soft); }
    .pi.error   .pbadge { background: rgba(239, 68, 68, 0.18);  color: var(--ld-err); }

    /* Progress bar — fina, simple, sin scan */
    .loading-progress {
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column;
      align-items: center; gap: 1rem;
    }
    .loading-progress-bar {
      position: relative;
      width: 100%; height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-progress-bar::before,
    .loading-progress-bar::after { content: none; }
    .loading-progress-fill {
      position: absolute; inset: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--ld-accent) 0%, var(--ld-accent-soft) 100%);
      box-shadow: 0 0 12px rgba(94, 106, 210, 0.5);
      transition: width 500ms cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 999px;
    }
    .loading-progress-scan {
      position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(196, 181, 253, 0.35), transparent);
      animation: ldShimmer 1.8s ease-in-out infinite;
    }
    @keyframes ldShimmer {
      0%   { left: -40%; }
      100% { left: 100%; }
    }

    #totbar {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: var(--ld-text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex; align-items: baseline; gap: 0.7rem;
    }
    #totbar b {
      font-family: 'JetBrains Mono', monospace;
      color: var(--ld-text);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      text-shadow: none;
    }
    #errmsg {
      margin-top: 1.2rem; font-size: 0.85rem; color: var(--ld-text-dim);
      max-width: 520px; text-align: center; line-height: 1.5; display: none;
    }

    @media (max-width: 640px) {
      .loading-brand { margin-bottom: 2rem; }
      #loading .logo { font-size: 1.7rem; }
      #loading .sub  { font-size: 0.9rem; margin-bottom: 1.8rem; }
      #pgrid { margin-bottom: 1.8rem; }
    }

    /* ══ HUD PANEL — gradient sólido CS2 (no glass pesado) ═══════════════════ */
    .hud-panel {
      background: linear-gradient(180deg, var(--bg-panel-top) 0%, var(--bg-panel-bot) 100%);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: var(--shadow-panel), var(--inner-top);
    }

    /* ══ CITY PILL (top-left) — estilo MEGALÓPOLIS de CS2 ════════════════════ */
    #title-ctrl {
      position: fixed;
      top: 14px; left: 60px;
      z-index: var(--z-hud);
      display: flex; align-items: center; gap: 9px;
      padding: 8px 14px 8px 11px;
      font-family: var(--font-ui);
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text-strong);
      pointer-events: auto;
      border-color: rgba(122, 142, 200, 0.35) !important;
      transition: border-color var(--t-base) var(--ease-out);
    }
    #title-ctrl::before {
      content: ""; width: 5px; height: 5px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      border-radius: 50%;
      flex-shrink: 0;
    }
    #title-ctrl .title-icon {
      width: 15px; height: 15px;
      color: var(--accent-bright);
      flex-shrink: 0;
    }
    #title-ctrl .nick {
      font-size: 0.8em;
      font-weight: 400;
      opacity: 0.65;
    }

    /* El canvas de Esri es gris medio; se oscurece para el fondo casi negro de CS2 */
    .basemap-dark {
      filter: brightness(0.45) saturate(0.75);
    }
    /* ══ MODULE TOOLBAR (top-right tile icons) ════════════════════════════════ */
    #header-controls {
      position: fixed;
      top: 14px; right: 14px;
      z-index: var(--z-hud);
      display: flex; align-items: center;
      padding: 6px;
      gap: 4px;
      max-width: calc(100vw - 28px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #header-controls::-webkit-scrollbar { display: none; }

    /* Tile icons (estilo bottom toolbar de CS2) */
    .pill {
      --cat: var(--accent);
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg,
                    color-mix(in srgb, var(--cat) 18%, var(--bg-tile)) 0%,
                    var(--bg-tile) 100%);
      border: 1px solid var(--border-hair);
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      box-shadow: var(--inner-top);
      transition: background var(--t-fast) var(--ease-out),
                  border-color var(--t-fast) var(--ease-out),
                  transform var(--t-fast) var(--ease-out);
    }
    .pill:hover:not(.disabled) {
      background: linear-gradient(180deg,
                    color-mix(in srgb, var(--cat) 28%, var(--bg-tile-hover)) 0%,
                    var(--bg-tile-hover) 100%);
      border-color: var(--border-soft);
    }
    .pill.on {
      background: linear-gradient(180deg,
                    color-mix(in srgb, var(--cat) 38%, var(--bg-tile)) 0%,
                    color-mix(in srgb, var(--cat) 18%, var(--bg-tile)) 100%);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent),
                  0 4px 16px color-mix(in srgb, var(--cat) 35%, transparent),
                  var(--inner-top);
      color: var(--text-strong);
    }
    /* CS2-style bottom underline para tile activa */
    .pill.on::after {
      content: "";
      position: absolute;
      left: 8px; right: 8px; bottom: -1px;
      height: 2px;
      background: var(--accent-bright);
      border-radius: 1px;
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .pill.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.15));
    }
    .pill-icon {
      width: 22px; height: 22px;
      color: var(--cat);
      flex-shrink: 0;
      transition: color var(--t-fast) var(--ease-out),
                  transform var(--t-fast) var(--ease-out);
    }
    .pill.on .pill-icon {
      color: var(--text-strong);
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--cat) 60%, transparent));
    }
    .pill:hover:not(.disabled) .pill-icon { transform: scale(1.08); }
    .pill .pill-lock {
      width: 12px; height: 12px;
      color: var(--text-faint);
      position: absolute;
      bottom: 4px; right: 4px;
      background: var(--bg-deep);
      border-radius: 50%;
      padding: 1px;
    }

    /* Hidden text label (a11y only) */
    .pill-label {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }

    /* Tooltip on hover — pequeño label debajo */
    .pill::before {
      content: attr(data-label);
      position: absolute;
      top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      padding: 4px 9px;
      background: var(--bg-panel-solid);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-base);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-fast) var(--ease-out);
      box-shadow: var(--shadow-panel);
    }
    .pill:hover::before { opacity: 1; }

    /* Separador vertical antes de Fondo */
    .pill-sep {
      width: 1px;
      background: var(--border-soft);
      margin: 4px 4px;
      align-self: stretch;
      flex-shrink: 0;
    }

    /* ══ FONDO CONTROL ═════════════════════════════════════════════════════════ */
    #fondo-control {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0;
    }
    #fondo-control.visible { display: inline-flex; }
    #fondo-select {
      background: var(--bg-elev);
      border: 1px solid var(--border-soft);
      color: var(--text-base);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 22px 5px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1l4 4 4-4' stroke='%2394a3b8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 7px center;
      transition: border-color var(--t-fast) var(--ease-out);
    }
    #fondo-select:hover, #fondo-select:focus {
      border-color: var(--border-strong);
      outline: none;
    }

    /* ══ LEGEND (bottom-left) — panel sólido CS2 ═════════════════════════════ */
    .legend {
      padding: 14px 16px 16px;
      color: var(--text-base);
      font-size: 12px;
      max-height: 80vh;
      overflow-y: auto;
      min-width: 240px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .legend::-webkit-scrollbar { width: 6px; }
    .legend::-webkit-scrollbar-thumb {
      background: var(--border-strong); border-radius: var(--radius-sm);
    }
    .legend h4 {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-strong);
      font-weight: 600;
      letter-spacing: 0.2px;
      text-transform: none;
      margin-bottom: 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border-hair);
    }
    .legend h4.compliance {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .lsect {
      font-family: var(--font-ui);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: var(--text-dim);
      margin: 12px 0 4px;
    }
    .li {
      display: flex; align-items: center; gap: 9px;
      line-height: 1.85;
      padding: 1px 2px;
    }
    .ldot {
      width: 12px; height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15),
                  0 1px 2px rgba(0,0,0,0.4);
    }
    .lname {
      flex: 1;
      color: var(--text-base);
      font-size: 12px;
    }
    .lcount {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: right;
      letter-spacing: 0.2px;
    }
    .lcount.zero {

    /* Master toggle (mini-checkbox CS2 style) */
    .master-toggle {

    /* Source toggle inside legend (only renders if official_zoning module present) */
    .source-toggle {

      accent-color: var(--accent);

    /* ══ MAPLIBRE DARK OVERRIDES ══════════════════════════════════════════════ */
    #map { background: var(--bg-void); }
    .maplibregl-ctrl-group {
      background: var(--bg-panel-solid) !important;

    /* Leyenda como control de MapLibre */
    .legend.maplibregl-ctrl { margin: 0 0 10px 10px; }

    .cs2-popup.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--bg-panel-solid); }
    .cs2-popup.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--bg-panel-solid); }
    .cs2-popup.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--bg-panel-solid); }
    .cs2-popup .maplibregl-popup-close-button {

    }
    .cs2-popup .maplibregl-popup-close-button:hover { color: var(--accent-bright); background: none; }

    /* Attribution: discreta */
    .maplibregl-ctrl-attrib {
      background: rgba(10, 14, 26, 0.7) !important;

    }

    .maplibregl-ctrl-attrib-button { filter: invert(0.8); }

    /* ══ STATUS BAR ═══════════════════════════════════════════════════════════ */
    #statusbar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);

  </style>
</head>
<body>

<!-- Header — module pills + control de fondo (poblado dinámicamente por renderMap) -->
<div id="header-controls" class="hud-panel">
  <!-- Pills inyectadas dinámicamente según módulos del manifest -->
  <div id="fondo-control">
    <span>Fondo</span>
    <select id="fondo-select" aria-label="Modo de fondo">
      <option value="hidden">Oculto</option>
      <option value="faded">Atenuado</option>
      <option value="full">Completo</option>
    </select>
  </div>
</div>

<!-- Loading screen — landing-page identity -->
<div id="loading">
  <div class="loading-content">
    <div class="loading-brand">
      <div class="loading-brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
          <path d="M9 3v15M15 6v15"/>
        </svg>
      </div>
      <span>CS2 OSM Toolkit</span>
      <span class="loading-brand-ver">v3.4</span>
    </div>
    <span class="loading-badge"><span class="bdot"></span> Loading city data</span>
    <div class="logo">Loading <span class="city-grad" id="loading-city">city</span></div>
    <p class="sub" id="loading-sub">Preparing OpenStreetMap features for Cities: Skylines 2.</p>
    <div id="pgrid"></div>
    <div class="loading-progress">
      <div class="loading-progress-bar" role="progressbar" aria-label="Progreso de carga">
        <div class="loading-progress-fill" id="progress-fill"></div>
        <div class="loading-progress-scan"></div>
      </div>
      <div id="totbar"><span>Features loaded</span><b id="tcnt">0</b></div>
    </div>
    <div id="errmsg"></div>
  </div>
</div>

<div id="map"></div>
<div id="title-ctrl" class="hud-panel" role="status" aria-live="polite">
  <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
    <path d="M9 3v15M15 6v15"/>
  </svg>
  <span id="title-text">CS2 OSM Toolkit</span>
</div>
<div id="statusbar" class="hud-panel"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
// Multi-city bootstrap — lee ?city=<slug> de URL, fetch cities.json +
// manifest.json, y carga solo lo que la ciudad tiene.
//
// Zonificación y red vial llegan como teselas vectoriales (cities/<slug>/tiles/,
// generadas por `uv run build-tiles`): el navegador baja solo lo que se ve y
// MapLibre lo dibuja con la GPU. Si una ciudad no tiene teselas (datos de una
// versión vieja del toolkit), se bajan los datos completos como antes.
// ════════════════════════════════════════════════════════════════════════════

const params = new URLSearchParams(window.location.search);
const CITY_SLUG = params.get("city");

if (!CITY_SLUG) {
  // Sin parámetro → redirect a landing
  window.location.replace("index.html");
  throw new Error("no city slug, redirecting to landing");
}

let CITY_META = null;       // entry de cities.json
let CITY_MANIFEST = null;   // manifest.json per-city
let TILESET = null;         // tiles.json de la ciudad (null → datos completos)

// Módulos que viajan dentro de las teselas cuando la ciudad las tiene
const TILED_MODULES = new Set(["zoning", "vial", "external_buildings"]);

async function bootstrap() {
  try {
    // 1. cities.json — deployado al lado de map.html por generate-landing
    const citiesResp = await fetch("cities.json");
    if (!citiesResp.ok) throw new Error(`cities.json not found (HTTP ${citiesResp.status})`);
    const cities = await citiesResp.json();
    if (!(CITY_SLUG in cities)) {
      window.location.replace("index.html");
      return;
    }
    CITY_META = cities[CITY_SLUG];

    // Actualizar título de carga tan pronto como tenemos el nombre
    const cityEl = document.getElementById("loading-city");
    if (cityEl) cityEl.textContent = CITY_META.display_name;

    // 2. manifest.json — qué módulos hay generados para esta ciudad
    // Cache-bust: manifests change when data regenerates and we don't want
    // stale browser cache hiding new modules (official_zoning, etc.)
    const manifestResp = await fetch(`cities/${CITY_SLUG}/manifest.json`, { cache: "no-store" });
    if (!manifestResp.ok) {
      showError(`City data corrupted: manifest.json missing for "${CITY_SLUG}" (HTTP ${manifestResp.status})`);
      return;
    }
    CITY_MANIFEST = await manifestResp.json();

    // 3. Qué archivo corresponde a cada módulo (los manifests viejos no traen "file")
    const moduleToFile = {
      zoning:             "datos_zonificacion.js",
      vial:               "datos_vial.js",
      services:           "datos_servicios.js",
      external_buildings: "datos_external_buildings.js",
      official_zoning:    "datos_zonificacion_official.js",
      transporte:         "datos_transporte.js",
      infraestructura:    "datos_infraestructura.js",
    };
    const modules = Object.keys(CITY_MANIFEST.modules || {});
    if (modules.length === 0) {
      showError(`No modules found in manifest for "${CITY_SLUG}"`);
      return;
    }

    // 4. Teselas: con ellas, zoning/vial/externos no se descargan enteros
    if (CITY_MANIFEST.tiles) {
      try {
        TILESET = await loadTileset(CITY_MANIFEST.tiles);
      } catch (e) {
        console.warn("[tiles] no se pudieron cargar, uso los datos completos:", e);
      }
    }

    // Split modules: primary (block render) vs secondary (lazy)
    const SECONDARY = new Set(["official_zoning", "transporte", "infraestructura"]);
    const primaryModules = modules.filter(m => !SECONDARY.has(m) && !(TILESET && TILED_MODULES.has(m)));
    const secondaryModules = modules.filter(m => SECONDARY.has(m));

    function loadModule(m) {
      const entry = CITY_MANIFEST.modules[m] || {};
      const file = entry.file || moduleToFile[m];
      if (!file) return Promise.resolve();
      const src = `cities/${CITY_SLUG}/${file}?v=${entry.hash ?? ""}`;
      return file.endsWith(".json") ? loadCompact(m, src) : loadScript(src);
    }

    // Load primary modules first, then render the map
    await Promise.all(primaryModules.map(loadModule));

    // 5. Renderizar
    renderMap();

    // Lazy-load secondary modules AFTER first paint, in background.
    for (const m of secondaryModules) {
      loadModule(m).then(() => {
        if (m === "official_zoning" && typeof window.officialZoningLoaded === "function") {
          window.officialZoningLoaded();
        }
        if (m === "transporte" && typeof window.transporteLoaded === "function") {
          window.transporteLoaded();
        }
        if (m === "infraestructura" && typeof window.infraestructuraLoaded === "function") {
          window.infraestructuraLoaded();
        }
      }).catch(err => {
        console.warn(`[${m}] Failed to load:`, err);
      });
    }
  } catch (e) {
    showError(`Failed to load city "${CITY_SLUG}": ${e.message}`);
  }
}

async function loadTileset(entry) {
  const base = `cities/${CITY_SLUG}/${entry.path || "tiles"}`;
  const resp = await fetch(`${base}/tiles.json?v=${entry.hash ?? ""}`);
  if (!resp.ok) throw new Error(`tiles.json HTTP ${resp.status}`);
  const info = await resp.json();
  if (info.format !== "cs2-tiles" || info.version > 1) {
    throw new Error(`formato de teselas no soportado (${info.format} v${info.version})`);
  }
  info.base = base;
  // Las teselas vacías no existen en disco: se contestan sin pedirlas
  info.available = new Set(
    Object.entries(info.tiles).flatMap(([z, names]) => names.map(n => `${z}/${n}`))
  );
  return info;
}

// Protocolo cs2tiles://z/x/y → cities/<slug>/tiles/z/x/y.mvt.gz
// Las teselas se guardan con gzip y se sirven como binario opaco (sirve con
// `python -m http.server` y con GitHub Pages); acá se descomprimen.
maplibregl.addProtocol("cs2tiles", async (params, abortController) => {
  const key = params.url.slice("cs2tiles://".length);
  if (!TILESET || !TILESET.available.has(key)) return { data: new ArrayBuffer(0) };
  const resp = await fetch(`${TILESET.base}/${key}.mvt.gz?v=${TILESET.hash}`, {
    signal: abortController.signal,
  });
  if (!resp.ok) throw new Error(`tesela ${key}: HTTP ${resp.status}`);
  let buf = await resp.arrayBuffer();
  const head = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
  // Algunos servidores ya la mandan descomprimida (Content-Encoding: gzip)
  if (head[0] === 0x1f && head[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    buf = await new Response(stream).arrayBuffer();
  }
  return { data: buf };
});

// ════════════════════════════════════════════════════════════════════════════
// Formato compacto (src/shared/compact.py): coordenadas como enteros delta y
// propiedades por columna. Se decodifica a las mismas variables globales que
// definían los datos_*.js viejos. Solo se usa cuando la ciudad no tiene teselas.
// ════════════════════════════════════════════════════════════════════════════
function decodeCompact(doc) {
  const scale = 10 ** doc.precision;
  const out = {};
  for (const [key, layer] of Object.entries(doc.layers)) {
    const items = new Array(layer.ids.length);
    for (let i = 0; i < items.length; i++) {
      const g = layer.geom[i];
      const coords = new Array(g.length / 2);
      let lat = 0, lon = 0;
      for (let j = 0; j < g.length; j += 2) {
        lat += g[j];
        lon += g[j + 1];
        coords[j / 2] = [lat / scale, lon / scale];
      }
      items[i] = { id: layer.ids[i], coords, cs2_key: key };
    }
    for (const [prop, col] of Object.entries(layer.props || {})) {
      if (col.values) {
        col.values.forEach((v, i) => { items[i][prop] = v; });
        continue;
      }
      if ("default" in col) for (const it of items) it[prop] = col.default;
      if (col.sparse) {
        for (const [i, v] of Object.entries(col.sparse)) items[+i][prop] = v;
      } else if (col.dict) {
        col.codes.forEach((c, i) => { if (c >= 0) items[i][prop] = col.dict[c]; });
      }
    }
    out[key] = items;
  }
  return out;
}

async function loadCompact(module, src) {
  const resp = await fetch(src);
  if (!resp.ok) throw new Error(`Failed to load ${src} (HTTP ${resp.status})`);
  const doc = await resp.json();
  if (doc.format !== "cs2-compact" || doc.version > 1) {
    throw new Error(`${src}: formato no soportado (${doc.format} v${doc.version})`);
  }
  const layers = decodeCompact(doc);
  if (module === "vial") {
    window.DATA_VIAL = layers;
    return;
  }
  const prefix = module === "external_buildings" ? "DATA_EXT_" : "DATA_";
  for (const [key, items] of Object.entries(layers)) {
    window[prefix + key.toUpperCase()] = items;
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.body.appendChild(s);
  });
}

function showError(msg) {
  document.body.innerHTML = `
    <div style="padding: 2rem; font-family: sans-serif; color: #c9d1d9; background: #0d1117; min-height: 100vh;">
      <h1 style="color:#ef5350;margin-bottom:1rem;">⚠ Error</h1>
      <p style="margin-bottom:1rem;">${msg}</p>
      <p>
        <a href="index.html" style="color: #58a6ff;">← Volver a landing</a> &nbsp;·&nbsp;
        <a href="https://github.com/Osyanne/CitiesSkylines2-osm-toolkit/issues/new"
           style="color: #58a6ff;" target="_blank">Report issue</a>
      </p>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// ZONE CONFIG — modelo CS2 oficial (Sesión 1.6, 2026-05-13)
// Paleta basada en las 4 familias oficiales de CS2:
//   verde (residencial) · azul (comercial) · morado (oficinas) · amarillo (industrial)
// 13 zonas en total: 6 residencial + 2 comercial + 2 oficinas + 1 industrial + 2 parking
// ════════════════════════════════════════════════════════════════════════════
const ZONES = {
  // Residencial (6) — gradiente verde de claro a oscuro
  res_low_house: { color: "#A5D6A7", neon: "#C8E6C9", label: "Low Density Housing",          sect: "Residencial" },
  res_row:       { color: "#9CCC65", neon: "#C5E1A5", label: "Medium Density Row Housing",   sect: "Residencial" },
  res_med:       { color: "#66BB6A", neon: "#81C784", label: "Medium Density Housing",       sect: "Residencial" },
  // Mixed Housing — teal (única excepción: refleja mezcla verde+azul)
  res_mixed:     { color: "#26A69A", neon: "#4DB6AC", label: "Mixed Housing",                sect: "Residencial" },
  res_low_rent:  { color: "#558B2F", neon: "#7CB342", label: "Low Rent Housing",             sect: "Residencial" },
  res_high:      { color: "#1B5E20", neon: "#2E7D32", label: "High Density Housing",         sect: "Residencial" },
  // Comercial (2) — azul medio vs azul oscuro
  com_low:       { color: "#039BE5", neon: "#4FC3F7", label: "Low Density Business",         sect: "Comercial"   },
  com_high:      { color: "#01579B", neon: "#0277BD", label: "High Density Business",        sect: "Comercial"   },
  // Oficinas (2) — morado medio vs morado oscuro
  office_low:    { color: "#9C27B0", neon: "#BA68C8", label: "Low Density Offices",          sect: "Oficinas"    },
  office_high:   { color: "#4A148C", neon: "#6A1B9A", label: "High Density Offices",         sect: "Oficinas"    },
  // Industrial (1) — amarillo dorado
  industrial:    { color: "#F9A825", neon: "#FFCA28", label: "Industrial Manufacturing",     sect: "Industrial"  },
  // Parking (2) — gris (referencia, no es zona CS2 técnicamente)
  prk_surface:   { color: "#B0BEC5", neon: "#CFD8DC", label: "Surface Parking",              sect: "Parking"     },
  prk_ramp:      { color: "#37474F", neon: "#607D8B", label: "Parking Structure",            sect: "Parking"     },
};

// ════════════════════════════════════════════════════════════════════════════
// VIAL_TYPES — 6 categorías de red vial CS2 (Sesión 2, 2026-05-15)
// ════════════════════════════════════════════════════════════════════════════
const VIAL_TYPES = {

  water:   { color: "#3498db" }, // azul
  waste:   { color: "#8d6e63" }, // marron

};

  power:   "Electricidad",
  water:   "Agua y Alcantarillado",
  waste:   "Basura",
