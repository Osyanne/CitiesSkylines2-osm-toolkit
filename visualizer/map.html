      serviceIndex.point[key] = items;
      items.forEach((f, i) => {
        if (!f.coord) return;
        points.push({ type: "Feature", properties: { k: key, i }, geometry: { type: "Point", coordinates: lngLat(f.coord) } });
        serviceCounts[key]++;
      });
    }
    return [{ type: "FeatureCollection", features: polys }, { type: "FeatureCollection", features: points }];
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PROGRESS UI — una fila por módulo cargado
  // ══════════════════════════════════════════════════════════════════════════
  const pgrid = document.getElementById("pgrid");
  const pitems = {};
  const progressFill = document.getElementById("progress-fill");
  let totalModuleSlots = 0;
  let doneSlots = 0;

  function addProgressItem(key, label) {
    const d = Object.assign(document.createElement("div"), { className: "pi", id: "pi-" + key });
    d.innerHTML = `<span>${label}</span><span class="pbadge">Waiting</span>`;
    pgrid.appendChild(d);
    pitems[key] = d;
    totalModuleSlots++;
  }
  function setP(key, state, text) {
    if (!pitems[key]) return;
    const prevState = pitems[key].className.split(" ")[1] || "";
    pitems[key].className = "pi " + state;
    pitems[key].querySelector(".pbadge").textContent = text;

    if (!progressFill || totalModuleSlots === 0) return;
    // loading → cuenta como media; done → cuenta completa
    if (state === "done" && prevState !== "done") doneSlots++;
    const pct = state === "loading"
      ? Math.min(100, ((doneSlots + 0.5) / totalModuleSlots) * 100)
      : (doneSlots / totalModuleSlots) * 100;
    progressFill.style.width = pct.toFixed(1) + "%";
  }

  if (hasZoning)   addProgressItem("zoning",   "Zoning");
  if (hasVial)     addProgressItem("vial",      "Roads");
  if (hasServices) addProgressItem("services",  "Services");

  let total = 0;
  function bump(count) {
    total += count;
    document.getElementById("tcnt").textContent = total.toLocaleString("en-US");
  }
  const sum = obj => Object.values(obj).reduce((a, b) => a + b, 0);

  // ══════════════════════════════════════════════════════════════════════════
  // MÓDULOS — qué capas de MapLibre prende, atenúa o apaga cada uno
  // ══════════════════════════════════════════════════════════════════════════
  // Iconos SVG por módulo (lucide-style stroke icons) + color de categoría CS2
  const MODULE_META = {
    zoning: {
      label: "Zoning",
      cat: "var(--cat-zoning)",
      svg: `<svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>` +
           `<path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>` +
           `<path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>` +
           `<path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>`,
    },
    vial: {
      label: "Roads",
      cat: "var(--cat-vial)",
      svg: `<svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M12 13v8M12 3v3"/>` +
           `<path d="M18 6a2 2 0 0 1 1.387.56l2.307 2.22a1 1 0 0 1 0 1.44l-2.307 2.22A2 2 0 0 1 18 13H6a2 2 0 0 1-1.387-.56l-2.306-2.22a1 1 0 0 1 0-1.44l2.306-2.22A2 2 0 0 1 6 6z"/></svg>`,
    },
    services: {
      label: "Services",
      cat: "var(--cat-services)",
      svg: `<svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M12 11v4M14 13h-4"/>` +
           `<path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>` +
           `<rect x="4" y="6" width="16" height="13" rx="2"/></svg>`,
    },
    transporte: {
      label: "Transit",
      cat: "var(--cat-transport)",
      svg: `<svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M8 6v6M15 6v6M2 12h19.6"/>` +
           `<path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/>` +
           `<circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>`,
    },
    infraestructura: {
      label: "Utilities",
      cat: "var(--cat-infra)",
      svg: `<svg class="mod-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
           `<path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>`,
    },
  };

  // Transporte e infraestructura cargan después (bootstrap): mientras tanto su
  // bloque dice "Loading…". Solo existen si la ciudad tiene el módulo.
  const hasTransporte = !!CITY_MANIFEST.modules?.transporte;
  const hasInfra = !!CITY_MANIFEST.modules?.infraestructura;
  const officialEntry = CITY_MANIFEST.modules?.official_zoning;
  const officialName = officialEntry?.source_name || "Official zoning plan";

  let currentZoningSource = "osm";  // "osm" | "official"
  let requestedZoningSource = "osm";
  let officialFailed = false;
  const ZONING_LAYERS = ["zoning-fill", "zoning-line", "zoning-line-lowconf", "zoning-hover"];
  const OFFICIAL_LAYERS = ["official-fill", "official-line", "official-hover"];

  // El orden de inserción es el de la columna
  const MODULES = {};
  if (hasZoning) {
    MODULES.zoning = {
      enabled: true,
      // La fuente activa (OSM u oficial) es la que sigue el estado del módulo
      layerIds: () => currentZoningSource === "official" ? OFFICIAL_LAYERS : ZONING_LAYERS,
      inactiveLayerIds: () => currentZoningSource === "official" ? ZONING_LAYERS : OFFICIAL_LAYERS,
    };
  }
  if (hasVial) {
    MODULES.vial = { enabled: true, layerIds: () => ["vial-line"] };
  }
  if (hasServices) {
    MODULES.services = { enabled: true, layerIds: () => ["services-fill", "services-line", "services-points"] };
  }
  if (hasTransporte) {
    MODULES.transporte = { enabled: false, layerIds: () => ["transporte-line"] };
  }
  if (hasInfra) {
    MODULES.infraestructura = { enabled: false, layerIds: () => ["infra-fill", "infra-line", "infra-points"] };
  }
  const moduleKeys = Object.keys(MODULES);
  // 33 de 38 ciudades tienen solo zonificación: sin cabecera ni On/Dim/Off
  const singleModule = moduleKeys.length === 1;

  // Primera visita: zonificación al frente, calles atenuadas de referencia y el
  // resto apagado (todo prendido a la vez no se lee)
  const INITIAL_STATE = { zoning: "on", vial: "dim", services: "off", transporte: "off", infraestructura: "off" };
  const MODULE_STATES = ["on", "dim", "off"];
  const STATE_LABELS = { on: "On", dim: "Dim", off: "Off" };

  const savedModules = savedState?.modules || {};
  const moduleStates = {};
  for (const key of moduleKeys) {
    if (singleModule) moduleStates[key] = "on";   // no hay control para apagarlo
    else if (MODULE_STATES.includes(savedModules[key])) moduleStates[key] = savedModules[key];
    else moduleStates[key] = INITIAL_STATE[key];
    // También los que cargan después tienen un estado pedido para compartir.
  }

  function saveViewState(patch) {
    // Un link no se vuelve preferencia: se guarda solo lo que la persona toca.
    const saved = readViewState() || {};
    const next = { ...saved, ...patch };
    if (patch.modules) {
      const modules = saved.modules && typeof saved.modules === "object" && !Array.isArray(saved.modules)
        ? saved.modules : {};
      next.modules = { ...modules, ...patch.modules };
    }
    writeViewState(next);
  }

  // Categorías ocultas por módulo (zona, tipo de vía, servicio, línea, red).
  // Viven en la URL, no en localStorage; sin hide.* se muestran todas.
  const hiddenCats = Object.fromEntries(moduleKeys.map(k => [k, new Set()]));
  // Foto de hiddenCats antes del primer "Only", para que "Restore" vuelva ahí
  const snapshots = {};
  // La ficha conserva propiedades e identidad, nunca geometría recortada por tesela.
  const selectionEl = document.getElementById("selection");
  const hoverTip = document.getElementById("hover-tip");
  let selectedHit = null;
  let hoveredHit = null;
  let selectedLocation = null;
  let selectedAlso = [];
  let hoverFrame = null;
  let hoverPending = null;
  let dragging = false;
  const hoverMedia = window.matchMedia("(hover: hover) and (pointer: fine)");

  // ── Filtros por categoría ──
  // Cada setFilter hace que MapLibre vuelva a procesar en el worker todas las
  // teselas de la fuente (en la de teselas van juntas zonas y calles). Por eso:
  // - una capa oculta (módulo en Off, o la fuente de zonas que no se está
  //   mostrando) no se filtra: queda pendiente y se filtra al mostrarse, en el
  //   mismo reproceso que la muestra;
  // - mientras una fuente está en ese reproceso, los cambios que siguen se
  //   juntan y se aplican una sola vez cuando termina: una ráfaga de clicks no
  //   encola un reproceso por click ni hace pasar el mapa por estados viejos.
  // Un cambio suelto se aplica en el acto.
  const staleFilters = new Set();   // capas cuyo filtro no refleja hiddenCats
  const appliedFilter = {};         // id → filtro puesto (JSON), para no repetirlo
  const busySince = {};             // fuente en reproceso → cuándo se le cambió el filtro
  const BUSY_MAX_MS = 2500;         // tope por si la fuente no termina (paneo sin fin, tesela colgada)

  function categoryFilter(id) {
    const base = baseFilter[id];
    const hidden = [...(hiddenCats[layerModule[id]] ?? [])];
    const catFilter = hidden.length ? ["!", ["in", ["get", "k"], ["literal", hidden]]] : null;
    return base && catFilter ? ["all", base, catFilter] : (base || catFilter);
  }

  const layerHidden = id => map.getLayoutProperty(id, "visibility") === "none";

  // Pone el filtro al día; devuelve si cambió (si cambió, la fuente se reprocesa)
  function setCategoryFilter(id) {
    staleFilters.delete(id);
    const f = categoryFilter(id);
    const key = JSON.stringify(f);
    if (appliedFilter[id] === key) return false;
    appliedFilter[id] = key;
    map.setFilter(id, f);
    return true;
  }

  const isBusy = src => src in busySince && performance.now() - busySince[src] <= BUSY_MAX_MS;
  let flushTimer = null;

  function flushFilters() {
    const touched = new Set();
    let waiting = false;
    for (const id of [...staleFilters]) {
      const layer = map.getLayer(id);
      if (!layer) { staleFilters.delete(id); continue; }
      if (layerHidden(id)) continue;
      if (isBusy(layer.source)) { waiting = true; continue; }
      if (setCategoryFilter(id)) touched.add(layer.source);
    }
    for (const src of touched) markBusy(src);
    // Lo normal es que checkBusy lo aplique al terminar el reproceso; el timer
    // cubre una fuente que no termina y un mapa que dejó de dibujar
    if (waiting && !flushTimer) {
      flushTimer = setTimeout(() => { flushTimer = null; flushFilters(); }, BUSY_MAX_MS + 50);
    }
  }

  function markBusy(src) {
    busySince[src] = performance.now();
    map.off("render", checkBusy);   // un solo listener
    map.on("render", checkBusy);
  }

  // Al final de cada frame. El reproceso arranca en el frame que sigue al
  // setFilter, así que al final de ese frame la fuente ya figura cargando; la
  // da por libre recién cuando sus teselas vuelven.
  function checkBusy() {
    let freed = false;
    for (const src of Object.keys(busySince)) {
      if (map.isSourceLoaded(src) || !isBusy(src)) {
        delete busySince[src];
        freed = true;
      }
    }
    if (!Object.keys(busySince).length) map.off("render", checkBusy);
    if (freed) flushFilters();
  }

  function applyModuleFilters(mod) {
    for (const id of Object.keys(layerModule)) {
      if (layerModule[id] === mod) staleFilters.add(id);
    }
    flushFilters();
    syncInspection();
  }

  // Para depurar y para las pruebas: ¿hay capas visibles esperando su filtro?
  window.CS2_FILTERS_PENDING = () => [...staleFilters].some(id => map.getLayer(id) && !layerHidden(id));

  function setLayerState(id, visible, factor) {
    if (!map.getLayer(id)) return;
    // Una capa que se muestra lleva su filtro al día en el mismo cambio
    if (visible && staleFilters.has(id) && setCategoryFilter(id)) markBusy(map.getLayer(id).source);
    map.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
    for (const [prop, value] of Object.entries(baseOpacity[id] || {})) {
      map.setPaintProperty(id, prop, factor === 1 ? value
        : (typeof value === "number" ? value * factor : ["*", factor, value]));
    }
  }

  // on → como está; dim → visible con la opacidad × FADE; off → oculto
  function applyModuleState(moduleKey, inspect = true) {
    const module = MODULES[moduleKey];
    if (!module || !module.enabled) return;
    const state = moduleStates[moduleKey];
    const factor = state === "dim" ? FADE : 1;
    for (const id of module.layerIds()) setLayerState(id, state !== "off", factor);
    for (const id of module.inactiveLayerIds?.() || []) setLayerState(id, false, 1);
    if (inspect) syncInspection();
  }

  function applyAllStates(inspect = true) {
    for (const key of moduleKeys) applyModuleState(key, false);
    if (inspect) syncInspection();
  }

  // Conteos de la fuente activa: al pasar al plan oficial se cuentan sus zonas
  const officialCounts = Object.fromEntries(Object.keys(ZONES).map(k => [k, 0]));
  const MODULE_COUNTS = {
    zoning: zoneCounts, vial: vialCounts, services: serviceCounts,
    transporte: transportCounts, infraestructura: infraCounts,
  };
  // Hasta que un módulo carga no se sabe qué categorías están vacías
  const countsKnown = {};

  function activeCounts(mod) {
    if (mod === "zoning" && currentZoningSource === "official") {
      return countsKnown.official_zoning ? officialCounts : null;
    }
    return countsKnown[mod] ? MODULE_COUNTS[mod] : null;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // COLUMNA DE CAPAS — un bloque por módulo: estado, grupos y categorías
  // ══════════════════════════════════════════════════════════════════════════
  const CATEGORY_UNITS = {
    zoning: "zones", vial: "road types", services: "services",
    transporte: "lines", infraestructura: "networks",
  };
  const CHEV_SVG = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
  const areaSwatch = color => `<span class="sw" style="background:${color}"></span>`;
  const lineSwatch = color => `<span class="sw sw-line" style="background:${color}"></span>`;

  // Categorías de un módulo en el orden de la columna; "sect" arma los grupos
  // (zonas y calles), los demás módulos son una lista sola
  function categoryList(mod) {
    switch (mod) {
      case "zoning":
        return Object.entries(ZONES).map(([key, z]) =>
          ({ key, label: z.label, sect: z.sect, swatch: areaSwatch(z.neon) }));
      case "vial":
        return Object.entries(VIAL_TYPES).map(([key, v]) =>
          ({ key, label: v.label, sect: v.sect, swatch: lineSwatch(v.neon) }));
      case "services":
        return Object.entries(SERVICES_TYPES).map(([key, sv]) =>
          ({ key, label: sv.label, sect: "", swatch: `<img class="sw sw-icon" src="${serviceIconUrl(sv)}" alt="">` }));
      case "transporte":
        return Object.entries(TRANSPORT_STYLE).map(([key, st]) =>
          ({ key, label: TRANSPORT_LABELS[key], sect: "", swatch: lineSwatch(st.color) }));
      case "infraestructura":
        return Object.entries(INFRA_STYLE).map(([key, st]) =>
          ({ key, label: INFRA_LABELS[key], sect: "", swatch: areaSwatch(st.color) }));
      default:
        return [];
    }
  }

  // Las muestras copian lo que dibuja el mapa (zoningLayers): relleno al 55 % y
  // borde continuo, o relleno al 22 % y borde punteado. Sin colores propios.
  function confidenceLegendHtml() {
    const sample = ZONES.res_low_house;
    return `<details class="conf">` +
      `<summary class="conf-title">${CHEV_SVG}How sure is the zone?</summary>` +
      `<div class="conf-row" title="The zone comes from the building's OSM tags (building=house, building=apartments…) or from the OSM land use around it. Housing without a clear type is refined by its height (building:levels) or, without one, by its shape: shared walls and how built-up the block is">` +
        `<span class="sw" style="background:color-mix(in srgb, ${sample.color} 55%, transparent);box-shadow:inset 0 0 0 1px ${sample.neon}"></span>` +
        `Solid: from OSM tags, land use, height or shape</div>` +
      `<div class="conf-row" title="The building has no type and no land use around it: the zone is guessed from its footprint size">` +
        `<span class="sw" style="background:color-mix(in srgb, ${sample.color} 22%, transparent);box-shadow:none;border:1px dashed ${sample.neon}"></span>` +
        `Faint, dashed: guessed from size</div>` +
    `</details>`;
  }

  // El botón del plan oficial arranca deshabilitado: se habilita cuando el plan
  // termina de cargar (officialZoningLoaded)
  function sourceToggleHtml() {
    const name = escHtml(officialName);
    return `<div class="src">` +
      `<div class="seg" role="group" aria-label="Zoning source">` +
        `<button type="button" data-source="osm" aria-pressed="true" title="Zones derived from OpenStreetMap buildings and land use">OSM-derived</button>` +
        `<button type="button" data-source="official" aria-pressed="false" title="${name}" disabled>Official plan</button>` +
      `</div>` +
      `<div class="src-name">Official plan: ${name} (loading…)</div>` +
    `</div>`;
  }

  const colEl = document.getElementById("layers-col");
  const colBody = document.getElementById("layers-body");
  const summaryEl = document.getElementById("layers-summary");
  const blocks = {};              // módulo → elementos de su bloque
  const failedModules = new Set();

  function buildBlock(mod) {
    const meta = MODULE_META[mod];
    const cats = categoryList(mod);
    const bodyId = `mod-body-${mod}`;
    const loading = !MODULES[mod].enabled;
    const open = singleModule || mod === "zoning";

    const head = singleModule
      ? `<h2 class="mod-solo-title">${mod === "zoning" ? "CS2 zones" : meta.label}<span class="count mod-total"></span></h2>`
      : `<div class="mod-head">` +
          `<button type="button" class="mod-toggle" aria-expanded="${open}" aria-controls="${bodyId}">` +
            `${CHEV_SVG}${meta.svg}<span class="mod-name">${meta.label}</span><span class="count mod-total"></span>` +
          `</button>` +
          `<div class="seg mod-state" role="group" aria-label="${meta.label} layer"${loading ? " hidden" : ""}>` +
            MODULE_STATES.map(s =>
              `<button type="button" data-module-state="${s}" aria-pressed="false">${STATE_LABELS[s]}</button>`).join("") +
          `</div>` +
          `<span class="mod-status"${loading ? "" : " hidden"}>Loading…</span>` +
        `</div>`;

    const rowHtml = c =>
      `<div class="cat-row" data-cat="${c.key}">` +
        `<label><input type="checkbox" class="cat-check" checked>${c.swatch}<span class="cat-name">${escHtml(c.label)}</span></label>` +
        `<span class="count cat-count"></span>` +
        `<button type="button" class="only-btn" aria-label="Show only ${escHtml(c.label)}">Only</button>` +
      `</div>`;
    // Grupos en el orden en que aparecen sus categorías
    const groupsHtml = [...new Set(cats.map(c => c.sect))].map(sect =>
      `<div class="cat-group" data-sect="${sect}">` +
        (sect ? `<div class="group-head"><span>${sect}</span>` +
                `<button type="button" class="only-btn group-only" aria-label="Show only ${sect}">Only</button></div>` : "") +
        `<div class="group-list">${cats.filter(c => c.sect === sect).map(rowHtml).join("")}</div>` +
      `</div>`).join("");

    const sec = document.createElement("section");
    sec.className = singleModule ? "mod solo" : "mod";
    sec.dataset.module = mod;
    sec.dataset.state = loading ? "loading" : moduleStates[mod];
    sec.style.setProperty("--cat", meta.cat);
    // El aviso de filtro va entre la cabecera y el cuerpo: se ve aunque el
    // bloque esté plegado
    sec.innerHTML = head +
      `<div class="cat-notice" hidden><span class="notice-text" aria-live="polite"></span>` +
        `<span aria-hidden="true">·</span><button type="button" class="link-btn notice-action"></button></div>` +
      `<div class="mod-body" id="${bodyId}"${open ? "" : " hidden"}>` +
        (mod === "zoning" && officialEntry ? sourceToggleHtml() : "") +
        groupsHtml +
        `<details class="cat-empty" hidden><summary>${CHEV_SVG}<span class="empty-label"></span></summary>` +
          `<div class="empty-list"></div></details>` +
        (mod === "zoning" ? confidenceLegendHtml() : "") +
      `</div>`;
    colBody.appendChild(sec);

    const b = {
      el: sec,
      cats,
      toggle: sec.querySelector(".mod-toggle"),
      seg: sec.querySelector(".mod-state"),
      status: sec.querySelector(".mod-status"),
      total: sec.querySelector(".mod-total"),
      notice: sec.querySelector(".cat-notice"),
      noticeText: sec.querySelector(".notice-text"),
      noticeAction: sec.querySelector(".notice-action"),
      body: sec.querySelector(".mod-body"),
      empty: sec.querySelector(".cat-empty"),
      emptyLabel: sec.querySelector(".empty-label"),
      emptyList: sec.querySelector(".empty-list"),
      groups: {},
      rows: {},
    };
    for (const g of sec.querySelectorAll(".cat-group")) {
      b.groups[g.dataset.sect] = { el: g, list: g.querySelector(".group-list") };
    }
    for (const r of sec.querySelectorAll(".cat-row")) {
      b.rows[r.dataset.cat] = { el: r, check: r.querySelector(".cat-check"), count: r.querySelector(".cat-count") };
    }
    blocks[mod] = b;
  }

  // Categorías que hay en la ciudad (todas mientras no se sepa) y cuántas se ven
  function filterInfo(mod) {
    const counts = activeCounts(mod);
    const present = blocks[mod].cats.filter(c => !counts || counts[c.key] > 0);
    const shown = present.filter(c => !hiddenCats[mod].has(c.key)).length;
    return { shown, total: present.length };
  }

  function updateNotice(mod) {
    const b = blocks[mod];
    const { shown, total } = filterInfo(mod);
    b.notice.hidden = hiddenCats[mod].size === 0;
    if (b.notice.hidden) return;
    b.noticeText.textContent = `Showing ${shown} of ${total} ${CATEGORY_UNITS[mod]}`;
    b.noticeAction.textContent = snapshots[mod] ? "Restore" : "Show all";
  }

  // Resumen de la bandeja plegada del celular: qué está prendido
  function updateSummary() {
    if (selectedHit) {
      const info = describeHit(selectedHit);
      summaryEl.innerHTML = (info.color ? areaSwatch(info.color) : "") + escHtml(info.zone ? info.label : info.name);
      return;
    }
    const parts = [];
    for (const mod of moduleKeys) {
      const state = MODULES[mod].enabled ? moduleStates[mod] : null;
      if (state !== "on" && state !== "dim") continue;
      const { shown, total } = filterInfo(mod);
      parts.push(MODULE_META[mod].label +
        (state === "dim" ? " dimmed" : "") +
        (shown < total ? ` (${shown}/${total})` : ""));
    }
    summaryEl.textContent = parts.length ? parts.join(" · ") : "All layers off";
  }

  function syncModules() {
    for (const mod of moduleKeys) {
      if (failedModules.has(mod)) continue;
      const b = blocks[mod];
      const enabled = MODULES[mod].enabled;
      b.el.dataset.state = enabled ? moduleStates[mod] : "loading";
      if (!b.seg) continue;
      b.seg.hidden = !enabled;
      b.status.hidden = enabled;
      for (const btn of b.seg.querySelectorAll("[data-module-state]")) {
        btn.setAttribute("aria-pressed", String(btn.dataset.moduleState === moduleStates[mod]));
      }
    }
    updateSummary();
  }

  function syncCategories(mod) {
    const b = blocks[mod];
    for (const c of b.cats) {
      const hidden = hiddenCats[mod].has(c.key);
      b.rows[c.key].check.checked = !hidden;
      b.rows[c.key].el.classList.toggle("off", hidden);
    }
    updateNotice(mod);
    updateSummary();
  }

  // Las categorías vacías (conteo 0 una vez conocido) van al <details> del
  // final; si cambian los conteos (carga, fuente oficial) vuelven a su grupo
  function placeRows(mod) {
    const b = blocks[mod];
    const counts = activeCounts(mod);
    const wanted = new Map();   // contenedor → sus filas, en el orden original
    let empty = 0;
    for (const c of b.cats) {
      const row = b.rows[c.key];
      const isEmpty = !!counts && !(counts[c.key] > 0);
      row.check.disabled = isEmpty;
      const dest = isEmpty ? b.emptyList : b.groups[c.sect].list;
      if (!wanted.has(dest)) wanted.set(dest, []);
      wanted.get(dest).push(row.el);
      if (isEmpty) empty++;
    }
    // Solo se mueve lo que cambia de lugar: sacar una fila del DOM y volver a
    // ponerla le quita el foco del teclado (y esto corre cada vez que carga un
    // módulo). Si la fila con foco igual tuvo que moverse, el foco vuelve.
    const focused = document.activeElement;
    for (const [dest, els] of wanted) {
      const mine = new Set(els);
      // Las que se van a otro contenedor se saltean: se mueven cuando toque el suyo
      const nextMine = node => { while (node && !mine.has(node)) node = node.nextElementSibling; return node; };
      let ref = nextMine(dest.firstElementChild);
      for (const el of els) {
        if (el === ref) ref = nextMine(ref.nextElementSibling);
        else dest.insertBefore(el, ref);
      }
    }
    if (focused && focused !== document.activeElement && b.el.contains(focused) && !focused.disabled) {
      focused.focus({ preventScroll: true });
    }
    for (const g of Object.values(b.groups)) g.el.hidden = g.list.children.length === 0;
    b.empty.hidden = empty === 0;
    const where = mod === "zoning" && currentZoningSource === "official" ? "this plan" : "this city";
    b.emptyLabel.textContent = `${empty} not in ${where}`;
  }

  // Solo los módulos que cambiaron (el que cargó, o zoning al cambiar de fuente)
  function updateCounts(mods = moduleKeys) {
    for (const mod of mods) {
      if (!blocks[mod]) continue;
      const b = blocks[mod];
      const counts = activeCounts(mod);
      for (const c of b.cats) {
        b.rows[c.key].count.textContent = counts ? (counts[c.key] || 0).toLocaleString("en-US") : "";
      }
      b.total.textContent = counts
        ? b.cats.reduce((acc, c) => acc + (counts[c.key] || 0), 0).toLocaleString("en-US")
        : "";
      placeRows(mod);
      updateNotice(mod);
    }
    updateSummary();
  }

  function setModuleState(mod, state) {
    if (!MODULES[mod]?.enabled || !MODULE_STATES.includes(state)) return;
    moduleStates[mod] = state;
    applyModuleState(mod);
    syncModules();
    saveViewState({ modules: { [mod]: state } });
    writeViewHash();
  }

  // Tocar casillas a mano no borra la foto del Only: Restore sigue volviendo a
  // como estaba antes (spec §3). Solo Restore y Show all la borran.
  function toggleCategory(mod, cat, visible) {
    if (visible) hiddenCats[mod].delete(cat); else hiddenCats[mod].add(cat);
    // Con todo tildado a mano ya no hay nada que restaurar: sin foto, un Only +
    // Restore posterior vuelve a este estado y no al de antes del primer Only
    if (hiddenCats[mod].size === 0) delete snapshots[mod];
    applyModuleFilters(mod);
    syncCategories(mod);
    writeViewHash();
  }

  // Only: se ven esas categorías y nada más del módulo; la primera vez guarda
  // cómo estaba para que Restore vuelva ahí
  function showOnly(mod, cats) {
    if (failedModules.has(mod)) return;
    if (!snapshots[mod]) snapshots[mod] = new Set(hiddenCats[mod]);
    const keep = new Set(cats);
    hiddenCats[mod] = new Set(blocks[mod].cats.map(c => c.key).filter(k => !keep.has(k)));
    applyModuleFilters(mod);
    // Aislar algo apagado no mostraría nada: el módulo se prende
    if (moduleStates[mod] === "off" || !MODULES[mod].enabled) {
      if (MODULES[mod].enabled) setModuleState(mod, "on");
      else {
        // Carga todavía: arranca prendido, y la elección se guarda ya
        moduleStates[mod] = "on";
        saveViewState({ modules: { [mod]: "on" } });
      }
    }
    syncCategories(mod);
    writeViewHash();
  }

  function restoreCategories(mod) {
    hiddenCats[mod] = snapshots[mod] || new Set();
    delete snapshots[mod];
    applyModuleFilters(mod);
    syncCategories(mod);
    writeViewHash();
  }

  function showAllCategories(mod) {
    hiddenCats[mod] = new Set();
    delete snapshots[mod];
    applyModuleFilters(mod);
    syncCategories(mod);
    writeViewHash();
  }

  function toggleBlock(mod) {
    const b = blocks[mod];
    const open = b.toggle.getAttribute("aria-expanded") !== "true";
    b.toggle.setAttribute("aria-expanded", String(open));
    b.body.hidden = !open;
  }

  function syncZoningSource() {
    // Mientras llega el plan se sigue viendo OSM, pero se conserva el pedido.
    currentZoningSource = requestedZoningSource === "official" && countsKnown.official_zoning
      ? "official" : "osm";
    for (const btn of colBody.querySelectorAll("[data-source]")) {
      btn.setAttribute("aria-pressed", String(btn.dataset.source === requestedZoningSource));
    }
    // La confianza es de la clasificación OSM: el plan oficial no la tiene
    const conf = blocks.zoning?.el.querySelector(".conf");
    if (conf) conf.hidden = currentZoningSource === "official";
  }

  function setZoningSource(mode, persist = true) {
    if (!["osm", "official"].includes(mode)) return;
    requestedZoningSource = mode === "official" && officialEntry && !officialFailed ? "official" : "osm";
    syncZoningSource();
    applyModuleState("zoning");
    updateCounts(["zoning"]);
    if (persist) saveViewState({ source: requestedZoningSource });
    writeViewHash();
    refreshExportControls();
  }

  for (const mod of moduleKeys) buildBlock(mod);
  for (const mod of moduleKeys) syncCategories(mod);
  syncModules();

  // Cabeceras fijas (ver .mod.docked): cada módulo plegado que viene después del
  // último abierto se pega al pie, a la altura de lo que miden los que tiene
  // debajo. Se recalcula cuando cambia el alto de algún bloque (plegar, aviso de
  // filtro, Loading…, alto táctil), también al abrir la columna o la bandeja.
  const DOCK_MIN_LIST = 240;
  function layoutDock() {
    if (singleModule) return;
    const secs = moduleKeys.map(mod => blocks[mod].el);
    let lastOpen = -1;
    moduleKeys.forEach((mod, i) => { if (!blocks[mod].body.hidden) lastOpen = i; });
    // Solo si a la lista le quedan al menos 240 px: en la bandeja del celular y
    // en el cajón apaisado el dock se comería casi todo el alto
    const dockHeight = secs.slice(lastOpen + 1).reduce((h, sec) => h + sec.offsetHeight, 0);
    const canDock = lastOpen >= 0 && colBody.clientHeight - dockHeight >= DOCK_MIN_LIST;
    let bottom = 0;
    for (let i = secs.length - 1; i >= 0; i--) {
      const dock = canDock && i > lastOpen;
      secs[i].classList.toggle("docked", dock);
      secs[i].classList.toggle("dock-first", dock && i === lastOpen + 1);
      if (dock) {
        secs[i].style.setProperty("--dock-bottom", `${bottom}px`);
        bottom += secs[i].offsetHeight;
      } else {
        secs[i].style.removeProperty("--dock-bottom");
      }
    }
    // Que el foco del teclado no deje una fila escondida detrás del dock
    colBody.style.scrollPaddingBottom = `${bottom}px`;
  }
  if (!singleModule) {
    let dockPending = false;
    const dockObserver = new ResizeObserver(() => {
      if (dockPending) return;
      dockPending = true;
      requestAnimationFrame(() => { dockPending = false; layoutDock(); });
    });
    for (const mod of moduleKeys) dockObserver.observe(blocks[mod].el);
    dockObserver.observe(colBody);   // el alto disponible cambia con la ventana
    layoutDock();
  }

  colBody.addEventListener("click", ev => {
    const btn = ev.target.closest("button");
    if (!btn) return;
    const mod = btn.closest(".mod")?.dataset.module;
    if (!mod) return;
    if (btn.dataset.moduleState) setModuleState(mod, btn.dataset.moduleState);
    else if (btn.classList.contains("mod-toggle")) toggleBlock(mod);
    else if (btn.dataset.source) setZoningSource(btn.dataset.source);
    else if (btn.classList.contains("group-only")) {
      const sect = btn.closest(".cat-group").dataset.sect;
      showOnly(mod, blocks[mod].cats.filter(c => c.sect === sect).map(c => c.key));
    } else if (btn.classList.contains("only-btn")) showOnly(mod, [btn.closest(".cat-row").dataset.cat]);
    else if (btn.classList.contains("notice-action")) {
      if (snapshots[mod]) restoreCategories(mod); else showAllCategories(mod);
    }
  });
  colBody.addEventListener("change", ev => {
    const input = ev.target;
    if (!input.classList.contains("cat-check")) return;
    toggleCategory(input.closest(".mod").dataset.module, input.closest(".cat-row").dataset.cat, input.checked);
  });

  // Si un módulo secundario no se pudo bajar, su bloque lo dice
  window.moduleLoadFailed = function (moduleKey) {
    if (moduleKey === "official_zoning") {
      officialFailed = true;
      const btn = colBody.querySelector('[data-source="official"]');
      if (btn) {
        btn.disabled = true;
        btn.title = "Couldn't load — reload to retry";
      }
      const name = colBody.querySelector(".src-name");
      if (name) name.textContent = "The official plan couldn't load — reload to retry";
      setZoningSource("osm", false);
      return;
    }
    const b = blocks[moduleKey];
    if (!b || MODULES[moduleKey].enabled) return;
    failedModules.add(moduleKey);
    moduleStates[moduleKey] = "off";
    b.el.dataset.state = "failed";
    if (b.status) {
      b.status.textContent = "Couldn't load — reload to retry";
      b.status.hidden = false;
    }
    if (b.toggle) {
      b.toggle.disabled = true;
      b.toggle.setAttribute("aria-expanded", "false");
    }
    b.body.hidden = true;
    // Un Only hecho mientras cargaba ya no tiene sobre qué actuar
    hiddenCats[moduleKey].clear();
    delete snapshots[moduleKey];
    b.notice.hidden = true;
    syncCategories(moduleKey);
    syncInspection();
    writeViewHash();
    refreshExportControls();
  };

  // ── Abrir y cerrar: columna en escritorio, bandeja en el celular ──
  const layersOpenBtn = document.getElementById("layers-open");
  const layersCloseBtn = document.getElementById("layers-close");
  const trayToggle = document.getElementById("layers-tray-toggle");

  function setColOpen(open) {
    document.body.classList.toggle("col-open", open);
    layersOpenBtn.setAttribute("aria-expanded", String(open));
    try { localStorage.setItem(COL_OPEN_KEY, open ? "1" : "0"); } catch {}
    placeSelection();
    map.resize();   // el mapa cambió de ancho sin que cambie la ventana
    (open ? layersCloseBtn : layersOpenBtn).focus({ preventScroll: true });
  }
  layersOpenBtn.setAttribute("aria-expanded", String(document.body.classList.contains("col-open")));
  layersOpenBtn.addEventListener("click", () => setColOpen(true));
  layersCloseBtn.addEventListener("click", () => setColOpen(false));

  // La bandeja arranca plegada: la cabecera la despliega y la vuelve a plegar
  trayToggle.addEventListener("click", () => {
    const open = !colEl.classList.contains("tray-open");
    colEl.classList.toggle("tray-open", open);
    document.body.classList.toggle("tray-open", open);   // para el cajón apaisado
    trayToggle.setAttribute("aria-expanded", String(open));
  });
  // Al pasar de columna a bandeja (rotar el celular, achicar la ventana) el
  // mapa cambia de ancho
  window.matchMedia(SMALL_SCREEN).addEventListener("change", () => { placeSelection(); map.resize(); });

  // ── Mapa base, en el pie de la columna ──
  const basemapBtns = colEl.querySelectorAll("[data-basemap]");
  function syncBasemap() {
    for (const btn of basemapBtns) btn.setAttribute("aria-pressed", String(btn.dataset.basemap === basemap));
  }
  function setBasemap(mode, persist = true) {
    basemap = mode;
    syncBasemap();
    if (persist) saveViewState({ basemap });
    mapReady.then(() => {
      const sat = basemap === "sat";
      map.setLayoutProperty("base-sat", "visibility", sat ? "visible" : "none");
      map.setLayoutProperty("base-dark", "visibility", sat ? "none" : "visible");
      map.setLayoutProperty("base-dark-ref", "visibility", sat ? "none" : "visible");
    });
    if (persist) writeViewHash();
  }
  for (const btn of basemapBtns) btn.addEventListener("click", () => setBasemap(btn.dataset.basemap));
  syncBasemap();

  // ── Distancias en metros y celdas de 8 m ──
  const MEASURE_LAYERS = ["cs2-measure-line", "cs2-measure-points"];
  const measurePanel = document.getElementById("measure-panel");
  const measureTotal = document.getElementById("measure-total");
  const measureDone = document.getElementById("measure-done");
  const measureBtn = document.querySelector(".cs2-measure");
  let measureActive = false;
  let measurePoints = [];
  let measureLabels = [];
  let measureZoomEnabled = false;
  let measurePreviewPoint = null;   // punto de pantalla del último mousemove
  let measurePreviewLabel = null;
  let measurePreviewFrame = null;
  // La vista previa es DOM: conserva las dos capas del contrato y no sale en PNG.
  const measurePreview = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  measurePreview.classList.add("measure-preview");
  measurePreview.setAttribute("aria-hidden", "true");
  measurePreview.setAttribute("hidden", "");
  const measurePreviewLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
  for (const [key, value] of Object.entries({ stroke: "#ffd166", "stroke-width": "2.5", "stroke-dasharray": "5 5" })) {
    measurePreviewLine.setAttribute(key, value);
  }
  measurePreview.appendChild(measurePreviewLine);
  map.getCanvasContainer().appendChild(measurePreview);

  function measureGeoJSON() {
    const features = measurePoints.map(point => ({
      type: "Feature", properties: { part: "point" }, geometry: { type: "Point", coordinates: point.toArray() },
    }));
    if (measurePoints.length > 1) features.unshift({
      type: "Feature", properties: { part: "line" },
      geometry: { type: "LineString", coordinates: measurePoints.map(point => point.toArray()) },
    });
    return { type: "FeatureCollection", features };
  }

  function createMeasureLayers() {
    if (!map.getSource("cs2-measure")) map.addSource("cs2-measure", { type: "geojson", data: measureGeoJSON() });
    const styles = [
      ["line", "line", { "line-color": "#ffd166", "line-width": 2.5, "line-opacity": 1 }],
      ["points", "circle", { "circle-radius": 4, "circle-color": "#ffd166", "circle-stroke-color": "#0a0e1a", "circle-stroke-width": 1.5 }],
    ];
    for (const [name, type, paint] of styles) {
      const id = `cs2-measure-${name}`;
      if (!map.getLayer(id)) addLayerOrdered({
        id, type, source: "cs2-measure", filter: ["==", ["get", "part"], name === "line" ? "line" : "point"],
        layout: { visibility: measurePoints.length ? "visible" : "none" }, paint,
      });
    }
  }

  function measureText(meters) {
    return `${formatMeters(meters)} · ${formatCells(meters)}`;
  }

  function makeMeasureLabel(a, b) {
    const el = document.createElement("div");
    el.className = "measure-label";
    el.textContent = measureText(a.distanceTo(b));
    return new maplibregl.Marker({ element: el })
      .setLngLat(a).addTo(map);
  }

  function placeMeasureLabel(marker, a, b) {
    const start = map.project(a), end = map.project(b);
    // El centro del tramo dibujado se obtiene en pantalla (Mercator).
    marker.setLngLat(map.unproject([(start.x + end.x) / 2, (start.y + end.y) / 2]));
    marker.getElement().style.display = Math.hypot(end.x - start.x, end.y - start.y) < 40 ? "none" : "";
  }

  function updateMeasureLabels() {
    measureLabels.forEach((label, i) => placeMeasureLabel(label, measurePoints[i], measurePoints[i + 1]));
    updateMeasurePreview();
  }

  function clearMeasurePreview() {
    if (measurePreviewFrame !== null) cancelAnimationFrame(measurePreviewFrame);
    measurePreviewFrame = null;
    measurePreviewPoint = null;
    measurePreview.setAttribute("hidden", "");
    measurePreviewLabel?.remove();
    measurePreviewLabel = null;
  }

  function updateMeasurePreview() {
    if (!measureActive || !hoverMedia.matches || !measurePoints.length || !measurePreviewPoint || dragging) {
      clearMeasurePreview();
      return;
    }
    // Desde el punto de pantalla: si la cámara se mueve con el teclado, el
    // extremo sigue bajo el cursor
    const a = measurePoints[measurePoints.length - 1], b = map.unproject(measurePreviewPoint);
    const start = map.project(a), end = measurePreviewPoint;
    for (const [key, value] of Object.entries({ x1: start.x, y1: start.y, x2: end.x, y2: end.y })) {
      measurePreviewLine.setAttribute(key, value);
    }
    measurePreview.removeAttribute("hidden");
    if (!measurePreviewLabel) measurePreviewLabel = makeMeasureLabel(a, b);
    measurePreviewLabel.getElement().textContent = measureText(a.distanceTo(b));
    placeMeasureLabel(measurePreviewLabel, a, b);
  }

  function previewMeasure(ev) {
    if (!hoverMedia.matches || dragging || !measurePoints.length || ev.originalEvent?.buttons) {
      clearMeasurePreview();
      return;
    }
    measurePreviewPoint = ev.point;
    if (measurePreviewFrame !== null) return;
    measurePreviewFrame = requestAnimationFrame(() => {
      measurePreviewFrame = null;
      updateMeasurePreview();
    });
  }

  function syncMeasure() {
    measureBtn.setAttribute("aria-pressed", String(measureActive));
    measurePanel.hidden = !measureActive && !measurePoints.length;
    measureDone.hidden = !measureActive;
    let total = 0;
    for (let i = 1; i < measurePoints.length; i++) total += measurePoints[i - 1].distanceTo(measurePoints[i]);
    measureTotal.textContent = measurePoints.length < 2
      ? (hoverMedia.matches ? "Click to add points" : "Tap to add points") : `Total: ${measureText(total)}`;
    map.getSource("cs2-measure")?.setData(measureGeoJSON());
    for (const id of MEASURE_LAYERS) {
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", measurePoints.length ? "visible" : "none");
    }
    map.getCanvas().style.cursor = measureActive ? "crosshair" : "";
    syncFrameMarker();
    placeFramePanel();
  }

  function finishMeasure() {
    if (!measureActive) return;
    measureActive = false;
    clearMeasurePreview();
    // Un punto solo no mide nada: no queda en el mapa
    if (measurePoints.length < 2) measurePoints = [];
    if (measureZoomEnabled) map.doubleClickZoom.enable();
    syncMeasure();
  }

  function clearMeasure() {
    finishMeasure();
    clearMeasurePreview();
    measurePoints = [];
    for (const label of measureLabels) label.remove();
    measureLabels = [];
    syncMeasure();
  }

  function toggleMeasure() {
    if (measureActive) { finishMeasure(); return; }
    clearMeasure();
    clearHover();
    measureActive = true;
    measureZoomEnabled = map.doubleClickZoom.isEnabled();
    map.doubleClickZoom.disable();
    syncMeasure();
  }

  function addMeasurePoint(ev) {
    const previous = measurePoints[measurePoints.length - 1];
    if (previous) {
      const point = map.project(previous);
      if (Math.hypot(ev.point.x - point.x, ev.point.y - point.y) < 3) return;
    }
    clearMeasurePreview();
    measurePoints.push(new maplibregl.LngLat(ev.lngLat.lng, ev.lngLat.lat));
    if (previous) measureLabels.push(makeMeasureLabel(previous, measurePoints[measurePoints.length - 1]));
    updateMeasureLabels();
    if (measurePoints.length >= 100) finishMeasure();
    else syncMeasure();
  }

  measureDone.addEventListener("click", finishMeasure);
  document.getElementById("measure-clear").addEventListener("click", clearMeasure);
  map.on("dblclick", ev => {
    if (!measureActive) return;
    ev.preventDefault();
    finishMeasure();
  });
  map.on("move", updateMeasureLabels);
  map.on("resize", updateMeasureLabels);
  map.on("dragstart", clearMeasurePreview);
  map.getCanvas().addEventListener("mouseleave", clearMeasurePreview);
  hoverMedia.addEventListener("change", () => { clearMeasurePreview(); syncMeasure(); });
  map.on("style.load", createMeasureLayers);
  mapReady.then(createMeasureLayers);

  // ── Área jugable de CS2 ──
  const FRAME_HALF = 7168;
  const FRAME_TILES = 23;
  const FRAME_LAT_LIMIT = 85.051129;
  const FRAME_LAYERS = ["cs2-frame-mask", "cs2-frame-grid", "cs2-frame-casing", "cs2-frame-outline"];
  const frameState = { on: false, lat: null, lng: null };
  const framePanel = document.getElementById("frame-panel");
  const frameBtn = document.querySelector(".cs2-frame");
  let frameMarker = null;
  let frameUpdate = null;
  let frameDragging = false;
  let frameDragAbort = null;
  let frameSuppressClick = false;

  function frameMeters(lat) {
    const phi = lat * Math.PI / 180;
    return {
      lat: 111132.954 - 559.822 * Math.cos(2 * phi) + 1.175 * Math.cos(4 * phi),
      lng: 111412.84 * Math.cos(phi) - 93.5 * Math.cos(3 * phi) + 0.118 * Math.cos(5 * phi),
    };
  }

  // El límite se resuelve una vez: también el borde debe entrar en Mercator.
  const frameMaxLat = (() => {
    let low = 0, high = FRAME_LAT_LIMIT;
    for (let i = 0; i < 48; i++) {
      const mid = (low + high) / 2;
      if (mid + FRAME_HALF / frameMeters(mid).lat <= FRAME_LAT_LIMIT) low = mid;
      else high = mid;
    }
    return low;
  })();

  function clampFrameCenter(lat, lng) {
    lat = Math.max(-frameMaxLat, Math.min(frameMaxLat, lat));
    const maxLng = 180 - FRAME_HALF / frameMeters(lat).lng;
    return { lat, lng: Math.max(-maxLng, Math.min(maxLng, lng)) };
  }

  function frameBounds(center = frameState) {
    const meters = frameMeters(center.lat);
    const dy = FRAME_HALF / meters.lat, dx = FRAME_HALF / meters.lng;
    return [[center.lng - dx, center.lat - dy], [center.lng + dx, center.lat + dy]];
  }

  function frameGeoJSON(center = frameState) {
    const features = [];
    if (!Number.isFinite(center.lat) || !Number.isFinite(center.lng)) {
      return { type: "FeatureCollection", features };
    }
    // Aproximación local WGS84: error de borde de hasta ~0,2 % (14 m a 60°).
    const [[west, south], [east, north]] = frameBounds(center);
    const outline = [[west, south], [east, south], [east, north], [west, north], [west, south]];
    const feature = (part, geometry) => ({ type: "Feature", properties: { part }, geometry });
    features.push(feature("mask", { type: "Polygon", coordinates: [
      [[-180, -FRAME_LAT_LIMIT], [180, -FRAME_LAT_LIMIT], [180, FRAME_LAT_LIMIT], [-180, FRAME_LAT_LIMIT], [-180, -FRAME_LAT_LIMIT]],
      [...outline].reverse(),
    ] }));
    for (let i = 1; i < FRAME_TILES; i++) {
      const x = west + (east - west) * i / FRAME_TILES;
      const y = south + (north - south) * i / FRAME_TILES;
      features.push(feature("grid", { type: "LineString", coordinates: [[x, south], [x, north]] }));
      features.push(feature("grid", { type: "LineString", coordinates: [[west, y], [east, y]] }));
    }
    features.push(feature("outline", { type: "LineString", coordinates: outline }));
    return { type: "FeatureCollection", features };
  }

  function scheduleFrameData() {
    if (frameUpdate !== null) return;
    frameUpdate = requestAnimationFrame(() => {
      frameUpdate = null;
      map.getSource("cs2-frame")?.setData(frameGeoJSON());
    });
  }

  function createFrameLayers() {
    if (!map.getSource("cs2-frame")) {
      map.addSource("cs2-frame", { type: "geojson", data: frameGeoJSON() });
    }
    const styles = [
      ["mask", "fill", "mask", { "fill-color": "#000000", "fill-opacity": 0.35 }],
      ["grid", "line", "grid", { "line-color": "#ffffff", "line-width": 1, "line-opacity": 0.35 }],
      ["casing", "line", "outline", { "line-color": "#000000", "line-width": 4, "line-opacity": 0.5 }],
      ["outline", "line", "outline", { "line-color": "#ffffff", "line-width": 2, "line-opacity": 0.95 }],
    ];
    for (const [name, type, part, paint] of styles) {
      const id = `cs2-frame-${name}`;
      if (!map.getLayer(id)) addLayerOrdered({
        id, type, source: "cs2-frame", filter: ["==", ["get", "part"], part],
        layout: { visibility: frameState.on ? "visible" : "none" }, paint,
      });
    }
  }

  // Coordenadas de pantalla relativas al canvas, descontando solo la superposición.
  function visibleMapRect() {
    const canvas = map.getCanvas().getBoundingClientRect();
    const col = colEl.getBoundingClientRect();
    let left = 0, bottom = canvas.height;
    const overlapW = Math.min(canvas.right, col.right) - Math.max(canvas.left, col.left);
    const overlapH = Math.min(canvas.bottom, col.bottom) - Math.max(canvas.top, col.top);
    if (overlapW > 0 && overlapH > 0) {
      if (col.width >= canvas.width - 1) bottom = Math.max(0, col.top - canvas.top);
      else if (col.top <= canvas.top + 1 && col.bottom >= canvas.bottom - 1) {
        left = Math.min(canvas.width, col.right - canvas.left);
      }
    }
    return { left, top: 0, right: canvas.width, bottom, canvas };
  }

  function visibleCenter() {
    const rect = visibleMapRect();
    if (rect.left === 0 && rect.bottom === rect.canvas.height) return map.getCenter();
    return map.unproject([(rect.left + rect.right) / 2, (rect.top + rect.bottom) / 2]);
  }

  function placeFramePanel() {
    if (framePanel.hidden && measurePanel.hidden) return;
    const rect = visibleMapRect();
    // Reservar también el alto de escala y atribución cuando quedan a la vista.
    const controls = map.getContainer().querySelector(".maplibregl-ctrl-bottom-right").getBoundingClientRect();
    const bottom = rect.canvas.top + rect.bottom;
    let freeBottom = controls.top < bottom && controls.bottom > rect.canvas.top
      ? Math.min(bottom, controls.top) : bottom;
    // La esquina plegada no altera el centro, pero el panel debe esquivarla.
    const obstacles = [colEl];
    if (!selectionEl.hidden && selectionEl.classList.contains("is-floating")) obstacles.push(selectionEl);
    for (const panelEl of [framePanel, measurePanel]) {
      if (panelEl.hidden) continue;
      panelEl.style.left = `${rect.canvas.left + (rect.left + rect.right) / 2}px`;
      panelEl.style.maxWidth = `${Math.max(0, rect.right - rect.left - 24)}px`;
      panelEl.style.bottom = `${window.innerHeight - freeBottom + 12}px`;
      for (const obstacle of obstacles) {
        const box = obstacle.getBoundingClientRect();
        const panel = panelEl.getBoundingClientRect();
        if (box.left < panel.right && box.right > panel.left && box.top < panel.bottom && box.bottom > panel.top) {
          freeBottom = Math.min(freeBottom, box.top);
          panelEl.style.bottom = `${window.innerHeight - freeBottom + 12}px`;
        }
      }
      if (panelEl === measurePanel) panelEl.style.maxHeight = `${Math.max(0, freeBottom - rect.canvas.top - 24)}px`;
      freeBottom = panelEl.getBoundingClientRect().top;
    }
    placeExportMenu(rect, measurePanel.hidden ? obstacles : [...obstacles, measurePanel]);
  }

  function moveFrame(lat, lng) {
    Object.assign(frameState, clampFrameCenter(lat, lng));
    frameMarker?.setLngLat([frameState.lng, frameState.lat]);
    scheduleFrameData();
  }

  function saveFrame() {
    saveViewState({ frame: { ...frameState } });
    writeViewHash();
  }

  function finishFrameDrag(ev) {
    if (!frameDragging) return;
    let release = ev;
    if (ev.type !== "mouseup") {
      const canvas = map.getCanvas().getBoundingClientRect();
      const point = map.project([frameState.lng, frameState.lat]);
      release = new MouseEvent("mouseup", { clientX: canvas.left + point.x, clientY: canvas.top + point.y, button: 0, buttons: 0 });
    }
    // Pasar por Marker._onUp: quita sus listeners y emite el dragend normal.
    map.fire(new maplibregl.MapMouseEvent("mouseup", map, release));
  }

  function syncFrameMarker() {
    if (!frameState.on || !hoverMedia.matches || measureActive) {
      frameDragAbort?.abort();
      frameDragAbort = null;
      if (frameDragging) { frameDragging = false; dragging = false; }
      frameMarker?.remove();
      frameMarker = null;
      return;
    }
    if (!frameMarker) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "frame-handle";
      el.setAttribute("aria-label", "Move playable area");
      el.title = "Drag to move the playable area";
      el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
        `<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>`;
      el.addEventListener("mouseenter", clearHover);
      el.addEventListener("click", ev => ev.stopPropagation());
      el.addEventListener("keydown", ev => {
        const direction = { ArrowUp: [1, 0], ArrowDown: [-1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[ev.key];
        if (!direction) return;
        ev.preventDefault();
        ev.stopPropagation();
        const meters = frameMeters(frameState.lat);
        const tile = 2 * FRAME_HALF / FRAME_TILES;
        clearHover();
        moveFrame(frameState.lat + direction[0] * tile / meters.lat, frameState.lng + direction[1] * tile / meters.lng);
        saveFrame();
      });
      frameMarker = new maplibregl.Marker({ element: el, draggable: true })
        .setLngLat([frameState.lng, frameState.lat]).addTo(map);
      frameMarker.on("dragstart", () => {
        frameDragging = true;
        refreshExportControls();
        dragging = true;
        el.classList.add("is-dragging");
        clearHover();
        frameDragAbort?.abort();
        frameDragAbort = new AbortController();
        const signal = frameDragAbort.signal;
        document.addEventListener("mouseup", finishFrameDrag, { capture: true, once: true, signal });
        window.addEventListener("blur", finishFrameDrag, { once: true, signal });
        // Si soltó fuera de la ventana sin blur, terminar antes de volver a moverlo.
        document.addEventListener("mousemove", ev => {
          if (ev.buttons === 0) finishFrameDrag(ev);
        }, { capture: true, signal });
      });
      frameMarker.on("drag", () => {
        const center = frameMarker.getLngLat();
        moveFrame(center.lat, center.lng);
      });
      frameMarker.on("dragend", () => {
        const center = frameMarker.getLngLat();
        moveFrame(center.lat, center.lng);
        frameDragging = false;
        refreshExportControls();
        dragging = false;
        frameDragAbort?.abort();
        frameDragAbort = null;
        el.classList.remove("is-dragging");
        // Consumir solo el click de esta suelta; la próxima pulsación lo habilita.
        frameSuppressClick = true;
        saveFrame();
      });
    }
    frameMarker.setLngLat([frameState.lng, frameState.lat]);
  }

  function syncFrame() {
    frameBtn.setAttribute("aria-pressed", String(frameState.on));
    framePanel.hidden = !frameState.on;
    if (!frameState.on) {
      closeExportMenu(false);
      if (exportJob) finishExport(exportJob, "");
      revokeExportURL();
      exportStatus.textContent = "";
    }
    for (const id of FRAME_LAYERS) {
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", frameState.on ? "visible" : "none");
    }
    scheduleFrameData();
    syncFrameMarker();
    refreshExportControls();
    placeFramePanel();
  }

  function toggleFrame() {
    frameState.on = !frameState.on;
    if (frameState.on) {
      if (!Number.isFinite(frameState.lat) || !Number.isFinite(frameState.lng)) {
        const center = visibleCenter();
        const inCity = center.lat >= s && center.lat <= n && center.lng >= w && center.lng <= e;
        const [lat, lng] = CITY_META.center || [(s + n) / 2, (w + e) / 2];
        moveFrame(inCity ? center.lat : lat, inCity ? center.lng : lng);
      }
      const point = map.project([frameState.lng, frameState.lat]);
      const rect = visibleMapRect();
      if (point.x < rect.left || point.x > rect.right || point.y < rect.top || point.y > rect.bottom) {
        map.fitBounds(frameBounds(), { padding: fitPadding() });
      }
    }
    syncFrame();
    saveFrame();
  }

  function importFrame(value, saved) {
    const stored = Number.isFinite(saved?.lat) && Number.isFinite(saved?.lng)
      ? clampFrameCenter(saved.lat, saved.lng) : { lat: null, lng: null };
    Object.assign(frameState, stored, { on: saved?.on === true && stored.lat !== null });
    if (value === "off") frameState.on = false;
    else if (value !== null) {
      const parts = value.split(",");
      if (parts.length === 2 && parts.every(p => p.trim() && Number.isFinite(Number(p)))) {
        const [lat, lng] = parts.map(Number);
        if (Math.abs(lat) <= FRAME_LAT_LIMIT && Math.abs(lng) <= 180) {
          Object.assign(frameState, clampFrameCenter(lat, lng), { on: true });
        }
      }
    }
    syncFrame();
  }

  // ── PNG del recuadro: foto independiente del mapa principal ──
  const exportBtn = document.getElementById("frame-export");
  const exportMenu = document.getElementById("export-menu");
  const exportGo = document.getElementById("export-go");
  const exportStatus = document.getElementById("export-status");
  const exportLink = document.getElementById("export-link");
  const EXPORT_WAITING = "Waiting for layers to finish loading…";
  let exportLimit = null;
  let exportJob = null;
  let exportURL = null;

  function exportMaxSize() {
    if (exportLimit !== null) return exportLimit;
    exportLimit = 0;
    const canvas = document.createElement("canvas");
    let gl;
    try {
      gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
      if (gl) exportLimit = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
        gl.getParameter(gl.MAX_TEXTURE_SIZE), ...gl.getParameter(gl.MAX_VIEWPORT_DIMS));
    } catch {
      exportLimit = 0;
    } finally {
      gl?.getExtension("WEBGL_lose_context")?.loseContext();
      canvas.width = canvas.height = 0;
    }
    return exportLimit;
  }

  function exportWaiting() {
    return moduleKeys.some(key => moduleStates[key] !== "off" &&
      (!MODULES[key].enabled || !countsKnown[key])) ||
      (requestedZoningSource === "official" &&
        (!countsKnown.official_zoning || currentZoningSource !== "official"));
  }

  function refreshExportControls() {
    const waiting = exportWaiting();
    exportGo.disabled = !frameState.on || frameDragging || !!exportJob || waiting;
    if (exportJob) return;
    const message = waiting ? EXPORT_WAITING : frameDragging ? "Finish moving the playable area first." : "";
    if (message || exportStatus.textContent === EXPORT_WAITING ||
        exportStatus.textContent === "Finish moving the playable area first.") {
      if (exportStatus.textContent !== message) {
        exportStatus.textContent = message;
        placeFramePanel();
      }
    }
  }

  function placeExportMenu(rect, obstacles) {
    if (exportMenu.hidden) return;
    const panel = framePanel.getBoundingClientRect();
    const left = Math.max(12, rect.canvas.left + rect.left + 12);
    const right = Math.min(window.innerWidth - 12, rect.canvas.left + rect.right - 12);
    const top = Math.max(12, rect.canvas.top + 12);
    const width = Math.min(320, Math.max(0, right - left));
    let x = Math.max(left, Math.min(right - width, (panel.left + panel.right - width) / 2));
    let bottom = Math.min(window.innerHeight - 12, panel.top - 8);
    exportMenu.style.width = `${width}px`;
    exportMenu.style.maxHeight = `${Math.max(0, bottom - top)}px`;
    const height = exportMenu.getBoundingClientRect().height;
    for (const obstacle of obstacles) {
      const box = obstacle.getBoundingClientRect();
      if (box.left < x + width && box.right > x && box.top < bottom && box.bottom > bottom - height) {
        if (right - box.right - 8 >= width) x = box.right + 8;
        else if (box.left - 8 - left >= width) x = box.left - 8 - width;
        else bottom = Math.min(bottom, box.top - 8);
      }
    }
    exportMenu.style.left = `${x}px`;
    exportMenu.style.bottom = `${window.innerHeight - bottom}px`;
    exportMenu.style.maxHeight = `${Math.max(0, bottom - top)}px`;
  }

  function closeExportMenu(focus = true) {
    if (exportMenu.hidden) return;
    exportMenu.hidden = true;
    exportBtn.setAttribute("aria-expanded", "false");
    if (focus) exportBtn.focus({ preventScroll: true });
  }

  function revokeExportURL() {
    if (exportURL) URL.revokeObjectURL(exportURL);
    exportURL = null;
    exportLink.hidden = true;
    exportLink.removeAttribute("href");
    exportLink.removeAttribute("download");
    exportLink.textContent = "";
  }

  function exportCamera(bounds, size) {
    const [[west, south], [east, north]] = bounds;
    const mercY = lat => {
      const phi = lat * Math.PI / 180;
      return (1 - Math.log(Math.tan(phi) + 1 / Math.cos(phi)) / Math.PI) / 2;
    };
    const southY = mercY(south), northY = mercY(north);
    const dx = (east - west) / 360, dy = southY - northY;
    const width = dx >= dy ? size : Math.round(size * dx / dy);
    const height = dy >= dx ? size : Math.round(size * dy / dx);
    return {
      width, height, zoom: Math.log2(width / (512 * dx)),
      center: [(west + east) / 2, Math.atan(Math.sinh(Math.PI * (1 - southY - northY))) * 180 / Math.PI],
    };
  }

  function exportSnapshot() {
    const center = { lat: frameState.lat, lng: frameState.lng };
    const bounds = frameBounds(center);
    const size = Number(exportMenu.querySelector('[name="export-size"]:checked').value);
    const background = exportMenu.querySelector('[name="export-bg"]:checked').value;
    const grid = document.getElementById("export-grid").checked;
    const style = structuredClone(map.getStyle());
    const omitted = new Set(["zoning-hover", "official-hover", "cs2-frame-mask", "cs2-frame-casing", "cs2-frame-outline", ...MEASURE_LAYERS]);
    if (background === "transparent") {
      for (const id of ["background", "base-dark", "base-dark-ref", "base-sat"]) omitted.add(id);
    }
    style.layers = style.layers.filter(layer => {
      if (layer.id === "cs2-frame-grid") return grid;
      return !omitted.has(layer.id) && !layer.id.startsWith("cs2-search-") && layer.layout?.visibility !== "none";
    });
    for (const layer of style.layers) {
      if (layerModule[layer.id]) {
        const filter = categoryFilter(layer.id);
        if (filter) layer.filter = structuredClone(filter);
        else delete layer.filter;
      }
      if (layer.id === "cs2-frame-grid") layer.layout = { ...layer.layout, visibility: "visible" };
      if (layer.type === "raster") layer.paint = { ...layer.paint, "raster-fade-duration": 0 };
    }
    if (grid && style.sources["cs2-frame"]) {
      style.sources["cs2-frame"] = { type: "geojson", data: frameGeoJSON(center) };
    }
    const sources = new Set(style.layers.map(layer => layer.source).filter(Boolean));
    for (const id of Object.keys(style.sources)) if (!sources.has(id)) delete style.sources[id];
    let attribution = "© OpenStreetMap contributors";
    if ([...sources].some(id => id.startsWith("esri-"))) attribution += " · Esri";
    if (style.layers.some(layer => layer.id.startsWith("official-"))) attribution += ` · ${officialName}`;
    const filename = `${CITY_SLUG}-playable-area-${center.lat.toFixed(4)}_${center.lng.toFixed(4)}-${size}.png`;
    return { frameCenter: center, bounds, size, background, grid, style, attribution, filename, ...exportCamera(bounds, size) };
  }

  function releaseExportRender(job) {
    clearTimeout(job.timer);
    for (const removeListener of job.listeners.splice(0)) removeListener();
    try { job.map?.remove(); }
    finally {
      job.map = null;
      job.container?.remove();
      job.container = null;
      if (job.output) job.output.width = job.output.height = 0;
      job.output = null;
    }
  }

  function finishExport(job, message) {
    if (exportJob !== job) return;
    // Invalidar antes de quitar el mapa: ningún callback tardío puede descargar.
    exportJob = null;
    try { releaseExportRender(job); }
    finally {
      exportStatus.textContent = message;
      refreshExportControls();
      placeFramePanel();
    }
  }

  function checkExportCanvas(job) {
    const canvas = job.map.getCanvas();
    const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
    if (!gl || canvas.width !== job.width || canvas.height !== job.height ||
        gl.drawingBufferWidth !== job.width || gl.drawingBufferHeight !== job.height) {
      throw new Error(`This device can't render ${job.size} px. Try a smaller size.`);
    }
    return canvas;
  }

  function composeExport(job) {
    if (exportJob !== job) return;
    try {
      const source = checkExportCanvas(job);
      const canvas = job.output = document.createElement("canvas");
      canvas.width = canvas.height = job.size;
      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("Couldn't encode the image.");
      ctx.drawImage(source, 0, 0, job.width, job.height, 0, 0, job.size, job.size);
      const fontSize = Math.max(12, Math.round(job.size / 200));
      const margin = Math.round(job.size / 256);
      ctx.font = `${fontSize}px sans-serif`;
      ctx.textBaseline = "top";
      const textWidth = Math.min(ctx.measureText(job.attribution).width, job.size - 4 * margin);
      const x = job.size - textWidth - 3 * margin, y = job.size - fontSize - 3 * margin;
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(x, y, textWidth + 2 * margin, fontSize + 2 * margin);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(job.attribution, x + margin, y + margin, textWidth);
      canvas.toBlob(blob => {
        if (exportJob !== job) return;
        if (!blob) { finishExport(job, "Couldn't encode the image."); return; }
        try {
          exportURL = URL.createObjectURL(blob);
          exportLink.href = exportURL;
          exportLink.download = job.filename;
          exportLink.textContent = `Download PNG (${(blob.size / (1024 * 1024)).toFixed(1)} MB)`;
          exportLink.hidden = false;
          exportLink.click();
          finishExport(job, `Ready: ${job.filename}`);
        } catch {
          revokeExportURL();
          finishExport(job, "Couldn't encode the image.");
        }
      }, "image/png");
    } catch (error) {
      finishExport(job, error.name === "SecurityError"
        ? "Basemap tiles failed to load. Try a Transparent background."
        : error.message || "Couldn't encode the image.");
    }
  }

  function startExport() {
    refreshExportControls();
    if (exportGo.disabled) return;
    revokeExportURL();
    const job = { listeners: [], timer: null, map: null, container: null, output: null };
    exportJob = job;
    exportGo.disabled = true;
    try {
      Object.assign(job, exportSnapshot());
      exportStatus.textContent = `Rendering ${job.size} × ${job.size}…`;
      placeFramePanel();
      const container = job.container = document.createElement("div");
      container.setAttribute("aria-hidden", "true");
      container.style.cssText = `position:fixed;left:-100000px;top:0;width:${job.width}px;height:${job.height}px;pointer-events:none`;
      document.body.appendChild(container);
      job.timer = setTimeout(() => finishExport(job, "Timed out while rendering. Try a smaller size."),
        job.size === 8192 ? 120000 : 60000);
      job.map = new maplibregl.Map({
        container, style: job.style, center: job.center, zoom: job.zoom,
        bearing: 0, pitch: 0, pixelRatio: 1, interactive: false, attributionControl: false,
        hash: false, fadeDuration: 0, renderWorldCopies: false, trackResize: false,
        maxCanvasSize: [job.size, job.size],
        canvasContextAttributes: { preserveDrawingBuffer: true, antialias: true },
      });
      const listen = (type, handler) => {
        const target = job.map;
        target.on(type, handler);
        job.listeners.push(() => target.off(type, handler));
      };
      listen("error", ev => {
        const sourceId = ev.sourceId || ev.source?.id;
        if (sourceId && !job.style.sources[sourceId]) return;
        const esri = sourceId?.startsWith("esri-") || /(?:arcgisonline|arcgis)\.com/i.test(
          `${ev.error?.url || ""} ${ev.error?.message || ""}`);
        finishExport(job, esri ? "Basemap tiles failed to load. Try a Transparent background."
          : "Couldn't load the map data for the image.");
      });
      const canvas = checkExportCanvas(job);
      const lost = ev => {
        ev.preventDefault();
        finishExport(job, "The graphics context was lost. Try a smaller size.");
      };
      canvas.addEventListener("webglcontextlost", lost);
      job.listeners.push(() => canvas.removeEventListener("webglcontextlost", lost));
      listen("style.load", () => {
        try {
          if (job.style.layers.some(layer => layer.id === "services-points")) {
            for (const [key, type] of Object.entries(SERVICES_TYPES)) {
              const { image, pixelRatio } = serviceIconImage(type);
              job.map.addImage(`svc-${key}`, image, { pixelRatio });
            }
          }
        } catch { finishExport(job, "Couldn't load the map data for the image."); }
      });
      let loaded = false, composing = false;
      listen("load", () => { loaded = true; });
      listen("idle", () => {
        if (!loaded || composing || exportJob !== job) return;
        composing = true;
        composeExport(job);
      });
    } catch (error) {
      finishExport(job, error.message?.startsWith("This device can't render") ? error.message
        : `This device can't render ${job.size || "this size"} px. Try a smaller size.`);
    }
  }

  exportBtn.addEventListener("click", () => {
    if (!exportMenu.hidden) { closeExportMenu(); return; }
    if (exportMaxSize() >= 8192 && !exportMenu.querySelector('[name="export-size"][value="8192"]')) {
      const label = document.createElement("label");

  // ── Búsqueda: solo al confirmar, con caché y una consulta por segundo ──
  const searchOpen = document.getElementById("search-open");

  const searchInput = document.getElementById("search-input");
